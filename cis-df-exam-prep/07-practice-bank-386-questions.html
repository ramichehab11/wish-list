<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>CIS-DF Quiz — ServiceNow Data Foundations</title>
<style>
  :root {
    --salmon: #2563EB;
    --salmon-light: #EFF6FF;
    --salmon-dark: #1D4ED8;
    --purple: #0F172A;
    --purple-light: #CBD5E1;
    --purple-bg: rgba(15, 23, 42, 0.06);
    --green: #16A34A;
    --green-dark: #15803D;
    --green-light: #DCFCE7;
    --green-bg: #F0FDF4;
    --red: #DC2626;
    --red-dark: #B91C1C;
    --red-light: #FEE2E2;
    --red-bg: #FEF2F2;
    --orange: #F59E0B;
    --orange-light: #FEF3C7;
    --gray-50: #FAFAFA;
    --gray-100: #F5F5F5;
    --gray-200: #EEEEEE;
    --gray-300: #E0E0E0;
    --gray-400: #9E9E9E;
    --gray-500: #757575;
    --gray-700: #424242;
    --gray-900: #1A1A1A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.10);
    --shadow-green: 0 4px 20px rgba(22, 163, 74, 0.15);
    --shadow-red: 0 4px 20px rgba(220, 38, 38, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--gray-50); color: var(--gray-900); line-height: 1.6; min-height: 100vh; }

  /* === TOPBAR === */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--gray-200);
    padding: 14px 24px;
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo {
    width: 32px; height: auto; display: block;
  }
  .brand-name {
    font-weight: 700; font-size: 17px; color: var(--gray-900); letter-spacing: -0.2px;
  }
  .brand-separator {
    color: var(--salmon); font-weight: 800; font-size: 22px; line-height: 1;
  }
  .cert-select {
    appearance: none; border: 1.5px solid var(--gray-200); background: white;
    padding: 7px 32px 7px 14px; border-radius: 999px;
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--gray-900);
    cursor: pointer; transition: all 0.15s;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23424242' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat; background-position: right 12px center;
  }
  .cert-select:hover { border-color: var(--salmon); }
  .cert-select:focus { outline: none; border-color: var(--salmon); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); }
  .cert-select option:disabled { color: var(--gray-400); }

  .progress-wrap { flex: 1; min-width: 200px; max-width: 400px; }
  .progress-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--gray-700); margin-bottom: 4px; }
  .progress-bar { height: 6px; background: var(--gray-200); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--salmon), var(--purple)); transition: width 0.4s cubic-bezier(.4,0,.2,1); }

  .stats-mini { display: flex; gap: 14px; font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; font-weight: 600; }
  .stats-mini > div { display: flex; align-items: center; gap: 6px; }
  .stats-mini .dot { width: 8px; height: 8px; border-radius: 50%; }
  .stats-mini .ok { color: var(--green); }
  .stats-mini .ok .dot { background: var(--green); }
  .stats-mini .ko { color: var(--red); }
  .stats-mini .ko .dot { background: var(--red); }
  .stats-mini .todo { color: var(--gray-400); }
  .stats-mini .todo .dot { background: var(--gray-400); }
  .stats-mini .flagged { color: var(--orange); }
  .stats-mini .flagged .dot { background: var(--orange); }

  /* === WRAPPER (tabs + toolbar) — défile normalement avec la page === */
  .sticky-wrap {
    background: var(--gray-50);
  }

  /* === TABS === */
  .mode-tabs {
    max-width: 1100px; margin: 0 auto; padding: 16px 24px 0;
    display: flex; gap: 4px; border-bottom: 2px solid var(--gray-200);
  }
  .mode-tab {
    padding: 12px 18px; background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 600; color: var(--gray-400);
    border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .mode-tab:hover { color: var(--gray-700); }
  .mode-tab.active { color: var(--gray-900); border-bottom-color: var(--salmon); }
  .mode-tab .badge-count {
    background: var(--gray-200); color: var(--gray-700); font-size: 11px;
    padding: 2px 8px; border-radius: 999px; font-weight: 700; min-width: 24px; text-align: center;
  }
  .mode-tab.active .badge-count { background: var(--gray-900); color: white; }
  .mode-tab.review-tab .badge-count { background: var(--red-light); color: var(--red-dark); }
  .mode-tab.review-tab.active .badge-count { background: var(--red); color: white; }
  .mode-tab.flagged-tab .badge-count { background: var(--orange-light); color: #B45309; }
  .mode-tab.flagged-tab.active .badge-count { background: var(--orange); color: white; }

  /* === TOOLBAR === */
  .toolbar {
    max-width: 1100px; margin: 0 auto; padding: 14px 24px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .search-wrap {
    position: relative; display: flex; align-items: center;
    background: white; border: 1.5px solid var(--gray-200); border-radius: 999px;
    padding: 0 14px; min-width: 280px; flex: 1; max-width: 420px;
    transition: all 0.15s;
  }
  .search-wrap:focus-within { border-color: var(--salmon); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); }
  .search-icon { width: 15px; height: 15px; color: var(--gray-400); flex-shrink: 0; }
  #search-input {
    flex: 1; border: none; outline: none; padding: 9px 8px;
    font-family: inherit; font-size: 13px; color: var(--gray-900);
    background: transparent; min-width: 0;
  }
  #search-input::placeholder { color: var(--gray-400); }
  .search-clear {
    background: none; border: none; cursor: pointer; color: var(--gray-400);
    font-size: 18px; padding: 0; line-height: 1; display: none;
    border-radius: 50%; width: 20px; height: 20px;
    align-items: center; justify-content: center;
  }
  .search-clear:hover { background: var(--gray-100); color: var(--gray-900); }
  .search-wrap.has-value .search-clear { display: flex; }

  .filter-pill {
    padding: 7px 14px; border: 1.5px solid var(--gray-200); background: white;
    border-radius: 999px; font-family: inherit; font-size: 13px; cursor: pointer;
    transition: all 0.15s; color: var(--gray-700); font-weight: 500;
  }
  .filter-pill:hover { border-color: var(--salmon); color: var(--salmon-dark); }
  .filter-pill.active { background: var(--gray-900); color: white; border-color: var(--gray-900); }
  .filter-pill .count { color: inherit; opacity: 0.6; margin-left: 4px; font-variant-numeric: tabular-nums; }

  select.filter-pill { padding-right: 30px; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23424242' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; }

  .toolbar .spacer { flex: 1; }
  .icon-btn {
    width: 36px; height: 36px; border: 1.5px solid var(--gray-200); background: white;
    border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--gray-700); transition: all 0.15s; flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--salmon); color: var(--salmon-dark); transform: translateY(-1px); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* === MAIN === */
  main { max-width: 1100px; margin: 24px auto 80px; padding: 0 24px; }

  .search-info {
    background: white; border: 1.5px solid var(--gray-200); border-radius: 12px;
    padding: 12px 18px; margin-bottom: 18px; font-size: 13px; color: var(--gray-700);
    display: flex; align-items: center; gap: 10px;
  }
  .search-info strong { color: var(--gray-900); font-weight: 700; }

  .review-banner {
    background: linear-gradient(135deg, #FEF2F2, #FFF7ED);
    border-radius: 16px; padding: 22px 26px; margin-bottom: 24px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    border: 1px solid var(--red-light);
  }
  .review-banner.flagged-banner {
    background: linear-gradient(135deg, var(--orange-light), #FFF7ED);
    border-color: #FED7AA;
  }
  .review-banner .icon {
    width: 48px; height: 48px; border-radius: 12px; background: white;
    display: flex; align-items: center; justify-content: center; color: var(--red);
    flex-shrink: 0; box-shadow: var(--shadow-sm);
  }
  .review-banner.flagged-banner .icon { color: var(--orange); }
  .review-banner .icon svg { width: 24px; height: 24px; }
  .review-banner .text { flex: 1; min-width: 200px; }
  .review-banner h3 { font-size: 17px; margin-bottom: 4px; color: var(--gray-900); font-weight: 700; }
  .review-banner p { font-size: 13px; color: var(--gray-700); }

  .empty-review {
    text-align: center; padding: 70px 24px; background: white;
    border-radius: 16px; border: 2px dashed var(--gray-200);
  }
  .empty-review .icon {
    width: 72px; height: 72px; margin: 0 auto 18px; background: var(--green-light);
    border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--green);
  }
  .empty-review .icon svg { width: 36px; height: 36px; }
  .empty-review h2 { font-size: 22px; margin-bottom: 8px; color: var(--gray-900); }
  .empty-review p { color: var(--gray-700); font-size: 14px; max-width: 400px; margin: 0 auto; }

  /* === QUESTION CARD === */
  .question-card {
    background: white; border-radius: 16px; padding: 32px;
    margin-bottom: 20px; box-shadow: var(--shadow-sm);
    border: 1.5px solid var(--gray-200);
    transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
    scroll-margin-top: 100px;
    position: relative;
  }
  .question-card:hover { box-shadow: var(--shadow-md); }
  .question-card.answered-correct {
    border-color: var(--green-light);
    box-shadow: var(--shadow-green);
  }
  .question-card.answered-incorrect {
    border-color: var(--red-light);
    box-shadow: var(--shadow-red);
  }
  .question-card.flagged { border-right: 4px solid var(--orange); }

  .question-meta {
    display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap;
  }
  .badge {
    padding: 5px 11px; border-radius: 999px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.3px; text-transform: uppercase; display: inline-flex;
    align-items: center; gap: 5px;
  }
  .badge.num { background: var(--gray-900); color: white; }
  .badge.quiz { background: var(--salmon-light); color: var(--salmon-dark); }
  .badge.type { background: var(--purple-light); color: var(--purple); }
  .badge.status-ok {
    background: var(--green); color: white;
    box-shadow: 0 2px 8px rgba(22, 163, 74, 0.3);
  }
  .badge.status-ko {
    background: var(--red); color: white;
    box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
  }
  .badge.flagged { background: var(--orange); color: white; }
  .badge.corrected { background: var(--purple); color: white; }
  .badge.in-review { background: #6366F1; color: white; }
  .badge svg { width: 11px; height: 11px; }

  .flag-btn {
    margin-left: auto; background: none; border: 1.5px solid var(--gray-200); cursor: pointer;
    color: var(--gray-500); padding: 6px 12px; border-radius: 999px; font-size: 12px;
    display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s;
    font-family: inherit; font-weight: 500;
  }
  .flag-btn:hover { border-color: var(--orange); color: var(--orange); }
  .flag-btn.active { background: var(--orange); color: white; border-color: var(--orange); }
  .flag-btn svg { width: 13px; height: 13px; }

  .question-text {
    font-size: 17px; line-height: 1.65; color: var(--gray-900); margin-bottom: 22px;
    font-weight: 500;
  }
  .question-text p { margin-bottom: 10px; }
  .question-text p:last-child { margin-bottom: 0; }
  .question-text code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px;
    background: var(--gray-100); padding: 2px 6px; border-radius: 4px;
  }

  .hint {
    font-size: 12px; color: var(--gray-500); margin-bottom: 14px; padding: 8px 12px;
    background: var(--purple-bg); border-radius: 8px; border-left: 3px solid var(--purple);
    display: inline-block;
  }

  .answers { display: flex; flex-direction: column; gap: 10px; }
  .answer {
    display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px;
    border: 1.5px solid var(--gray-200); border-radius: 12px;
    cursor: pointer; transition: all 0.15s; background: white;
    user-select: none; position: relative;
  }
  .answer:hover { border-color: var(--salmon); background: var(--salmon-light); transform: translateX(2px); }
  .answer.selected {
    border-color: var(--purple); background: var(--purple-bg);
  }
  .answer.correct-revealed {
    border-color: var(--green); background: var(--green-bg);
    animation: correctPulse 0.5s ease-out;
  }
  .answer.incorrect-revealed {
    border-color: var(--red); background: var(--red-bg);
    animation: incorrectShake 0.4s ease-out;
  }
  .answer.disabled { cursor: default; }
  .answer.disabled:hover { background: white; border-color: var(--gray-200); transform: none; }
  .answer.correct-revealed:hover { background: var(--green-bg); border-color: var(--green); transform: none; }
  .answer.incorrect-revealed:hover { background: var(--red-bg); border-color: var(--red); transform: none; }

  @keyframes correctPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.01); box-shadow: 0 0 0 6px rgba(22, 163, 74, 0.15); }
    100% { transform: scale(1); }
  }
  @keyframes incorrectShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .answer-marker {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid var(--gray-400); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: var(--gray-700);
    transition: all 0.15s;
  }
  .answer.selected .answer-marker {
    background: var(--purple); color: white; border-color: var(--purple);
  }
  .answer.correct-revealed .answer-marker {
    background: var(--green); color: white; border-color: var(--green);
  }
  .answer.incorrect-revealed .answer-marker {
    background: var(--red); color: white; border-color: var(--red);
  }
  .answer-marker svg { width: 14px; height: 14px; stroke-width: 3; }

  .answer-text {
    flex: 1; line-height: 1.55; color: var(--gray-900); font-size: 14.5px;
  }
  .answer-text p { margin-bottom: 6px; }
  .answer-text p:last-child { margin-bottom: 0; }
  .answer-text code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px;
    background: var(--gray-100); padding: 1px 5px; border-radius: 3px;
  }

  .answer-tag {
    flex-shrink: 0; align-self: center; padding: 4px 10px;
    border-radius: 999px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .answer-tag.correct {
    background: var(--green); color: white;
  }
  .answer-tag.your-wrong {
    background: var(--red); color: white;
  }
  .answer-tag svg { width: 11px; height: 11px; stroke-width: 3; }

  .actions {
    display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; align-items: center;
  }
  .btn {
    padding: 11px 22px; border: none; border-radius: 999px;
    font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
    transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--gray-900); color: white; }
  .btn-primary:hover:not(:disabled) { background: var(--purple); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-primary:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; }
  .btn-secondary {
    background: white; color: var(--gray-700); border: 1.5px solid var(--gray-200);
  }
  .btn-secondary:hover { border-color: var(--salmon); color: var(--salmon-dark); }
  .btn-ghost { background: transparent; color: var(--gray-500); }
  .btn-ghost:hover { color: var(--gray-900); background: var(--gray-100); }
  .btn-warn { background: var(--orange); color: white; }
  .btn-warn:hover { background: #D97706; }
  .btn-danger { background: var(--red); color: white; }
  .btn-danger:hover { background: var(--red-dark); }
  .btn-sm {
    padding: 7px 14px; font-size: 12.5px;
  }
  .btn-sm svg { width: 12px; height: 12px; }

  .explanation {
    margin-top: 22px; padding: 20px 22px; background: var(--salmon-light); border-radius: 12px;
    border-left: 4px solid var(--salmon); font-size: 14px; line-height: 1.65; color: var(--gray-700);
    animation: slideIn 0.3s ease-out;
  }
  .explanation-title {
    font-weight: 700; color: var(--salmon-dark); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .explanation-title svg { width: 14px; height: 14px; }
  .explanation p { margin-bottom: 8px; }
  .explanation a { color: var(--purple); text-decoration: underline; word-break: break-word; }
  .explanation code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; background: white; padding: 1px 5px; border-radius: 3px; font-size: 13px; }

  .flag-comment {
    margin-top: 18px; padding: 16px 18px; background: var(--orange-light); border-radius: 12px;
    border-left: 4px solid var(--orange);
  }
  .flag-comment-title {
    font-weight: 700; color: #B45309; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .flag-comment-title svg { width: 13px; height: 13px; }
  .flag-comment textarea {
    width: 100%; border: 1px solid #FED7AA; background: white; border-radius: 8px;
    padding: 10px 12px; font-family: inherit; font-size: 13px; resize: vertical;
    min-height: 60px; color: var(--gray-900);
  }
  .flag-comment textarea:focus { outline: 2px solid var(--orange); border-color: transparent; }

  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

  mark.search-highlight {
    background: #FEF08A; color: var(--gray-900); padding: 0 3px;
    border-radius: 3px; font-weight: 600;
  }

  /* === Drag-and-drop === */
  .dnd-banner {
    background: linear-gradient(135deg, #F3E8FF, #EDE9FE);
    border: 1.5px solid #DDD6FE; border-radius: 14px;
    padding: 18px 20px; margin-bottom: 22px;
  }
  .dnd-title {
    font-size: 12px; font-weight: 700; color: var(--purple);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .dnd-title svg { width: 14px; height: 14px; }
  .dnd-columns {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  .dnd-col {
    background: white; border-radius: 10px; padding: 12px;
    border: 1px solid #E9D5FF;
  }
  .dnd-col-label {
    font-size: 11px; font-weight: 700; color: var(--gray-500);
    text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 10px;
    padding-bottom: 8px; border-bottom: 1px solid var(--gray-100);
  }
  .dnd-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 0;
    font-size: 13.5px; line-height: 1.5; color: var(--gray-900);
  }
  .dnd-item + .dnd-item { border-top: 1px solid var(--gray-100); }
  .dnd-marker {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px;
  }
  .dnd-marker-num { background: var(--purple); color: white; }
  .dnd-marker-letter { background: var(--salmon); color: white; }
  .dnd-text { flex: 1; padding-top: 2px; }

  /* Mappings visuels dans les réponses */
  .dnd-mapping {
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .dnd-pair {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--gray-50); padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--gray-200); font-size: 13px; font-weight: 600;
  }
  .answer.correct-revealed .dnd-pair { background: white; border-color: var(--green-light); }
  .answer.incorrect-revealed .dnd-pair { background: white; border-color: var(--red-light); }
  .dnd-pair-num {

  /* Liste des items avec drop zones */

<script>
const QUESTIONS = [{"num": 1, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator is beginning the journey of populating the CMDB and needs to verify that any data which is no longer useful/applicable is removed.</p><p>Which governance management tool will accomplish this?</p>", "question_plain": "A CMDB Administrator is beginning the journey of populating the CMDB and needs to verify that any data which is no longer useful/applicable is removed.Which governance management tool will accomplish this?", "answers": [{"id": "a0", "text": "CI Class Manager", "text_plain": "CI Class Manager", "correct": false}, {"id": "a1", "text": "CMDB and CSDM Data Foundations Dashboard", "text_plain": "CMDB and CSDM Data Foundations Dashboard", "correct": false}, {"id": "a2", "text": "CMDB Health Dashboard", "text_plain": "CMDB Health Dashboard", "correct": false}, {"id": "a3", "text": "CMDB Data Manager", "text_plain": "CMDB Data Manager", "correct": true}, {"id": "a4", "text": "De-duplication Templates", "text_plain": "De-duplication Templates", "correct": false}], "correct_count": 1, "correct_texts": ["CMDB Data Manager"], "explanation": "<p><strong>CMDB Data Manager</strong> is a policy-driven framework that allows CMDB Administrators to automate the lifecycle of Configuration Items (CIs). It is specifically designed to handle the \"governance\" aspect of data removal and maintenance.</p><p>Instead of manually deleting records, an administrator creates <strong>policies</strong> (such as Retirement, Archive, or Delete) based on specific filter criteria (e.g., \"CIs not updated in 90 days\"). The tool then:</p><ul><li><p>Identifies the CIs that meet the criteria.</p></li><li><p>Triggers a workflow for approval (if required).</p></li><li><p>Executes the action (retiring or deleting the data) automatically.</p></li></ul><p>This ensures the CMDB remains a \"single source of truth\" by systematically purging data that is no longer useful or applicable to the organization.</p><p><strong>Main takeaway:</strong></p><p>👉 While dashboards <strong>identify</strong> data issues, <strong>CMDB Data Manager</strong> is the governance tool that <strong>acts</strong> on those issues by automating the retirement, archival, and deletion of CIs through policy-driven workflows.</p><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/cmdb-data-management.html\"><strong>Working with CMDB Data Manager (ServiceNow Docs)</strong></a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_09-59-14-58d8bb28bbb8630bce8e64f74354f818.png\">", "corrected": false}, {"num": 2, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>What types of policies can be created within CMDB Data Manager? (Choose two)</p>", "question_plain": "What types of policies can be created within CMDB Data Manager? (Choose two)", "answers": [{"id": "a0", "text": "De-duplication", "text_plain": "De-duplication", "correct": false}, {"id": "a1", "text": "Archive", "text_plain": "Archive", "correct": true}, {"id": "a2", "text": "Reconciliation", "text_plain": "Reconciliation", "correct": false}, {"id": "a3", "text": "Retire", "text_plain": "Retire", "correct": true}], "correct_count": 2, "correct_texts": ["Archive", "Retire"], "explanation": "<p><strong>CMDB Data Manager</strong> uses a policy-driven framework to automate the maintenance and lifecycle of Configuration Items (CIs). When you create a policy, you are essentially telling ServiceNow what action to take when a CI meets certain criteria (like being inactive or \"stale\").</p><p>The primary policy types available in CMDB Data Manager include:</p><ul><li><p><code><strong>Retire</strong></code><strong>:</strong> Automatically moves the \"Life Cycle Stage\" to \"End of Life\" and \"Stage Detail\" to \"Retired\" (or updates the legacy operational status).</p></li><li><p><code><strong>Archive</strong></code><strong>:</strong> Moves records from the active CMDB table to an archive table. This keeps the database clean while preserving the data for historical or compliance reasons.</p></li><li><p><code><strong>Delete</strong></code><strong>:</strong> Permanently removes the CI records from the system.</p></li><li><p><code><strong>Attestation</strong></code><strong>:</strong> Sends a task to a CI owner to verify that the CI still exists and the data is accurate.</p></li></ul><p>Reference:&nbsp;<a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/data-manager-create-policy-wrkspc.html\" target=\"_blank\" rel=\"noopener\">Create a CMDB Data Manager policy (ServiceNow Docs)</a></p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_10-04-15-bf0360e0f719292bdc2674c2c9003f76.png\"></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_13-25-53-617acc0600b362764f6328ad5b73e78f.png\">", "corrected": false}, {"num": 3, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>A CMDB Administrator wants to educate the team on the various actions that can be performed within the CMDB Workspace.</p><p>What actions can be initiated from the CMDB Workspace? (Choose two)</p>", "question_plain": "A CMDB Administrator wants to educate the team on the various actions that can be performed within the CMDB Workspace.What actions can be initiated from the CMDB Workspace? (Choose two)", "answers": [{"id": "a0", "text": "Execute ServiceNow Discovery", "text_plain": "Execute ServiceNow Discovery", "correct": true}, {"id": "a1", "text": "Create a CMDB Data Manager certification policy", "text_plain": "Create a CMDB Data Manager certification policy", "correct": false}, {"id": "a2", "text": "Remediate duplicate Cl records", "text_plain": "Remediate duplicate Cl records", "correct": true}, {"id": "a3", "text": "Create a new CMDB class", "text_plain": "Create a new CMDB class", "correct": false}], "correct_count": 2, "correct_texts": ["Execute ServiceNow Discovery", "Remediate duplicate Cl records"], "explanation": "<p>The <strong>CMDB Workspace</strong> is designed to help CMDB administrators <strong>monitor, analyze, and improve CMDB data quality</strong>. From within the workspace, users can take action directly on identified issues.</p><p>Here’s how each option stacks up:</p><ul><li><p><code><strong>Execute ServiceNow Discovery</strong></code><strong> — ✅ Correct</strong><br>CMDB Workspace allows administrators to initiate <strong>Discovery-related actions</strong> to help improve CI completeness and correctness when issues are identified.</p></li></ul><ul><li><p><code><strong>Remediate duplicate CI records</strong></code><strong> — ✅ Correct</strong><br>One of the core capabilities of CMDB Workspace is <strong>identifying and remediating duplicate CIs</strong>, including merging or resolving duplicates directly from the workspace.</p></li></ul><p><strong>Key takeaway:</strong></p><ul><li><p>CMDB Workspace is focused on <strong>operational CMDB health and remediation</strong>, not CMDB structural design or policy configuration.</p></li></ul><p><strong>Reference:</strong></p><p><strong>-</strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/cmdb-workspace.html\"><strong> CMDB Workspace store app (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/setup-cmdb-workspace.html\"><strong>Set up CMDB Workspace (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 4, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator changes the query for the SCCM Service Graph Connector.</p><p>What is the impact of this change?</p>", "question_plain": "A CMDB Administrator changes the query for the SCCM Service Graph Connector.What is the impact of this change?", "answers": [{"id": "a0", "text": "The Data Source for the SCCM Service Graph Connector will be marked as Inactive.", "text_plain": "The Data Source for the SCCM Service Graph Connector will be marked as Inactive.", "correct": false}, {"id": "a1", "text": "Any Scheduled Jobs for the SCCM Service Graph Connector will need to be configured.", "text_plain": "Any Scheduled Jobs for the SCCM Service Graph Connector will need to be configured.", "correct": true}, {"id": "a2", "text": "Any updates for the SCCM Service Graph Connector will be skipped during the upgrade.", "text_plain": "Any updates for the SCCM Service Graph Connector will be skipped during the upgrade.", "correct": false}], "correct_count": 1, "correct_texts": ["Any Scheduled Jobs for the SCCM Service Graph Connector will need to be configured."], "explanation": "<p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/service-graph-connectors/configure-sccm-integration.html\"><strong>Configure Service Graph Connector for Microsoft SCCM using the guided setup (ServiceNow Docs)</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/service-graph-connectors/upgrade-sccm-newer-version.html\"><strong>Upgrade to the latest version of Service Graph Connector for Microsoft SCCM (ServiceNow Docs)</strong></a></p><p><strong>-&nbsp;</strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/service-graph-connectors/cmdb-integration-sccm.html\"><strong>Service Graph Connector for Microsoft SCCM (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 5, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>Using existing baseline Data Manager policies, what condition must a Cl meet before it can be archived or deleted?</p>", "question_plain": "Using existing baseline Data Manager policies, what condition must a Cl meet before it can be archived or deleted?", "answers": [{"id": "a0", "text": "Be marked as inactive", "text_plain": "Be marked as inactive", "correct": false}, {"id": "a1", "text": "Be marked as critical", "text_plain": "Be marked as critical", "correct": false}, {"id": "a2", "text": "Be retired and in end of life", "text_plain": "Be retired and in end of life", "correct": true}, {"id": "a3", "text": "Be fully operational and in use", "text_plain": "Be fully operational and in use", "correct": false}], "correct_count": 1, "correct_texts": ["Be retired and in end of life"], "explanation": "<p>ServiceNow follows a specific <strong>Life Cycle Management</strong> framework (aligned with CSDM) to prevent accidental data loss. Within the <strong>CMDB Data Manager</strong>, baseline policies are designed to follow a logical progression.</p><p>For a Configuration Item (CI) to reach the \"cleanup\" stages (Archive or Delete), it must first be transitioned out of active service. In the baseline configuration:</p><ul><li><p><code><strong>Retire Policy</strong></code><strong>:</strong> First moves the CI to the <strong>Retired</strong> state and sets the Life Cycle Stage to <strong>End of Life</strong>.</p></li><li><p><code><strong>Archive/Delete Policy</strong></code><strong>:</strong> These policies typically use a filter that targets CIs where the <strong>Life Cycle Stage is End of Life</strong> and the <strong>Life Cycle Stage Detail is Retired</strong>.</p></li></ul><p>This \"safety buffer\" ensures that organizations don't delete CIs that are still operational, as the data is needed for incident history and relationship mapping until the asset is officially retired.</p><p><strong>Main takeaway:</strong></p><ul><li><p>The standard flow for CMDB governance is: </p><p><code><strong>Operational → Retired (End of Life) → Archived → Deleted</strong></code></p></li><li><p> A CI must be officially moved to a \"<code>Retired</code>\" status before the Data Manager will consider it eligible for archiving or permanent deletion.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/data-manager-manage-ret-def-wrkspc.html?section=data-manager-manage-ret-def-wrkspc\"><strong>Manage retirement definitions for CMDB Data Manager (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 6, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CSDM Data Manager needs metrics on the alignment of product models, locations, and business units with best practices. Which tab in the CSDM Data Foundations Dashboard provides this information?</p>", "question_plain": "A CSDM Data Manager needs metrics on the alignment of product models, locations, and business units with best practices. Which tab in the CSDM Data Foundations Dashboard provides this information?", "answers": [{"id": "a0", "text": "Run", "text_plain": "Run", "correct": false}, {"id": "a1", "text": "Foundation", "text_plain": "Foundation", "correct": true}, {"id": "a2", "text": "Crawl", "text_plain": "Crawl", "correct": false}, {"id": "a3", "text": "Walk", "text_plain": "Walk", "correct": false}, {"id": "a4", "text": "Fly", "text_plain": "Fly", "correct": false}], "correct_count": 1, "correct_texts": ["Foundation"], "explanation": "<p>The <strong>CSDM Data Foundations Dashboard</strong> is structured according to the Common Service Data Model (CSDM) maturity journey. It provides a series of tabs that report on how well your data aligns with ServiceNow's prescribed framework.</p><p>The <strong>Foundation</strong> tab is the starting point. It tracks the quality and alignment of the \"referential\" data that all other CSDM tiers rely on. This includes core data elements such as:</p><ul><li><p><code><strong>Business Units</strong></code></p></li><li><p><code><strong>Locations</strong></code></p></li><li><p><code><strong>Product Models</strong></code></p></li><li><p><code><strong>Companies and Departments</strong></code></p></li></ul><p>If these foundational elements are missing or poorly configured (e.g., missing Product Models on CIs), the higher-level service mappings in the Crawl, Walk, and Run phases will be inaccurate.</p><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/common-service-data-model-csdm/csdm-foundations-dashboard.html\"><strong>Configure the CSDM Data Foundations dashboard (ServiceNow Docs)</strong></a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_13-47-45-8418543e0fc8664b641bd8a66a63a773.png\"><p><br></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_13-47-45-9ad1d40fc4fbd846e9c0fccd2ecdf975.png\">", "corrected": false}, {"num": 7, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>User endpoint devices are imported into the CMDB and populate the 'Assigned to' [assigned_to] field on the Computer [cmdb_ci_computer] Cl. The Asset team puts in a request for the Configuration Analysts to populate the 'Assigned to' field on the related Asset.</p><p>What action does a Configuration Analyst take to achieve this in an automated way?</p>", "question_plain": "User endpoint devices are imported into the CMDB and populate the 'Assigned to' [assigned_to] field on the Computer [cmdb_ci_computer] Cl. The Asset team puts in a request for the Configuration Analysts to populate the 'Assigned to' field on the related Asset.What action does a Configuration Analyst take to achieve this in an automated way?", "answers": [{"id": "a0", "text": "Configure a business rule on the computer table to use a script to populate the 'Assigned to' field on the asset based on insert or update in the computer class 'Assigned to' field", "text_plain": "Configure a business rule on the computer table to use a script to populate the 'Assigned to' field on the asset based on insert or update in the computer class 'Assigned to' field", "correct": false}, {"id": "a1", "text": "Use the Asset-CI Field Mapping module to create a new rule to replicate the 'Assigned to' value between the asset and associated Cl", "text_plain": "Use the Asset-CI Field Mapping module to create a new rule to replicate the 'Assigned to' value between the asset and associated Cl", "correct": true}, {"id": "a2", "text": "Hide the 'Assigned to' field on the asset record and create a new field that dot walks to the related CI to get the 'Assigned to' value", "text_plain": "Hide the 'Assigned to' field on the asset record and create a new field that dot walks to the related CI to get the 'Assigned to' value", "correct": false}], "correct_count": 1, "correct_texts": ["Use the Asset-CI Field Mapping module to create a new rule to replicate the 'Assigned to' value between the asset and associated Cl"], "explanation": "<p>ServiceNow provides a native, out-of-the-box synchronization engine designed specifically to keep <strong>Assets</strong> and <strong>Configuration Items (CIs)</strong> in sync. Since Assets (financial/contractual) and CIs (technical/operational) are often two sides of the same coin, data like \"Location,\" \"Department,\" and \"Assigned to\" should match on both records.</p><p>The <strong>Asset-CI Field Mapping</strong> module allows an analyst to:</p><ul><li><p>Define which field on the CI table should map to which field on the Asset table.</p></li><li><p>Control the direction of the sync (CI to Asset, Asset to CI, or Both).</p></li><li><p>Ensure that when a user is imported into the <code>cmdb_ci_computer</code> record, the platform automatically updates the corresponding <code>alm_asset</code> record without needing custom code.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/it-asset-management/hardware-asset-management/c_ManagingAssets.html\"><strong>Asset and CI management (ServiceNow Docs)</strong></a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_13-53-35-8693fc795613e3f0637739e70ad9a426.png\">", "corrected": false}, {"num": 8, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator is asked to clean up the CMDB duplicates.</p><p>What is the preferred way to manage this task?</p>", "question_plain": "A CMDB Administrator is asked to clean up the CMDB duplicates.What is the preferred way to manage this task?", "answers": [{"id": "a0", "text": "My Tasks in the Application Navigator", "text_plain": "My Tasks in the Application Navigator", "correct": false}, {"id": "a1", "text": "The de-duplication task module", "text_plain": "The de-duplication task module", "correct": false}, {"id": "a2", "text": "The de-duplication dashboard on the CMDB workspace", "text_plain": "The de-duplication dashboard on the CMDB workspace", "correct": true}], "correct_count": 1, "correct_texts": ["The de-duplication dashboard on the CMDB workspace"], "explanation": "<p>While there are multiple ways to view duplicate tasks, the <strong>CMDB Workspace</strong> is the ServiceNow-recommended, modern \"command center\" for CMDB health. It is specifically designed to provide a unified experience for managing the <strong>Correctness</strong> of the CMDB.</p><p>Within the CMDB Workspace, the de-duplication dashboard allows an administrator to:</p><ul><li><p>View all duplicate CI sets at a glance.</p></li><li><p>Prioritize remediation based on the criticality of the CI class.</p></li><li><p>Launch the <strong>Duplicate CI Remediation</strong> tool directly, which provides a guided, side-by-side comparison to help determine which record should be the \"Master\" and which should be merged or deleted.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/dedup-ci-exp-cmdb-workspace.html\"><strong>CI de-duplication experience in CMDB Workspace (ServiceNow Docs)</strong></a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_13-56-48-dc2dd63545109f9a1ed4db5e4066578b.png\">", "corrected": false}, {"num": 9, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator wants to ensure all short-lived Cls that have not been discovered in the past week are removed.</p><p>After retiring the Cl records, which recommended action does the CMDB Administrator take?</p>", "question_plain": "A CMDB Administrator wants to ensure all short-lived Cls that have not been discovered in the past week are removed.After retiring the Cl records, which recommended action does the CMDB Administrator take?", "answers": [{"id": "a0", "text": "Create a delete policy", "text_plain": "Create a delete policy", "correct": true}, {"id": "a1", "text": "Create a scheduled job", "text_plain": "Create a scheduled job", "correct": false}, {"id": "a2", "text": "Create a business rule", "text_plain": "Create a business rule", "correct": false}], "correct_count": 1, "correct_texts": ["Create a delete policy"], "explanation": "<p>In modern ServiceNow CMDB administration, the <strong>CMDB Data Manager</strong> is the primary tool for managing the lifecycle of Configuration Items (CIs). Once CIs have reached the end of their useful life—specifically after they have been moved to a <strong>Retired</strong> state—they should be purged to keep the CMDB lean and performant.</p><p>A <code><strong>Delete Policy</strong></code> within the CMDB Data Manager allows the administrator to:</p><ul><li><p><code><strong>Target specific CIs</strong></code><strong>:</strong> Use filters to identify \"short-lived\" CIs (like containers or virtual machines) that have not been updated or discovered within a specific timeframe (e.g., 7 days).</p></li><li><p><code><strong>Automate at scale</strong></code><strong>:</strong> Instead of manually deleting records, the policy runs on a schedule.</p></li><li><p><code><strong>Maintain Governance</strong></code><strong>:</strong> The policy can include an approval workflow, ensuring that a human or automated process verifies the deletion before it occurs.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/data-manager-create-policy-wrkspc.html\"><strong>Create a CMDB Data Manager policy (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 10, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator group aims to establish a process for receiving task notifications when the Support Group or Managed By Group fields are not populated for operational Linux servers stored in the CMDB.</p><p>Which ServiceNow modules can be leveraged to configure recommended fields and generate task records in cases where these fields are missing for Linux servers in the CMDB?</p>", "question_plain": "A CMDB Administrator group aims to establish a process for receiving task notifications when the Support Group or Managed By Group fields are not populated for operational Linux servers stored in the CMDB.Which ServiceNow modules can be leveraged to configure recommended fields and generate task records in cases where these fields are missing for Linux servers in the CMDB?", "answers": [{"id": "a0", "text": "Technical Service Offerings and Dynamic Cl groups", "text_plain": "Technical Service Offerings and Dynamic Cl groups", "correct": false}, {"id": "a1", "text": "CMDB Workspace and Scheduled Jobs", "text_plain": "CMDB Workspace and Scheduled Jobs", "correct": false}, {"id": "a2", "text": "Dynamic Cl groups and CMDB groups", "text_plain": "Dynamic Cl groups and CMDB groups", "correct": false}, {"id": "a3", "text": "CI Class Manager and Health Preferences", "text_plain": "CI Class Manager and Health Preferences", "correct": true}], "correct_count": 1, "correct_texts": ["CI Class Manager and Health Preferences"], "explanation": "<p>To ensure data quality, ServiceNow uses the <strong>CMDB Health</strong> framework, specifically the <strong>Completeness</strong> metric. This metric checks for the presence of data in fields that the organization deems important but not necessarily \"mandatory\" for the record to exist.</p><ul><li><p><code><strong>CI Class Manager</strong></code><strong>:</strong> This is the central tool where a CMDB Administrator defines which fields are <strong>Recommended</strong> for a specific class (e.g., Linux Servers). By adding \"Support Group\" and \"Managed By Group\" to the Recommended Fields list for the Linux class, the system knows to monitor these attributes.</p></li><li><p><code><strong>Health Preferences</strong></code><strong>:</strong> Within the CMDB Health Dashboard settings (Health Preferences), the administrator can enable <strong>\"Create Health Task.\"</strong> When the nightly health job runs and finds an operational Linux server missing those recommended fields, it automatically generates a <strong>Remediation Task</strong> (Health Task) assigned to the appropriate group.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/overview-cmdb-health.html\"><strong>Overview of CMDB Health (ServiceNow Docs)</strong></a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_14-09-54-3d3fedb923d3e36bffb2c37e4e0a35d4.png\">", "corrected": false}, {"num": 11, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator is asked to create a query using the CMDB Query Builder that displays all operational Cls belonging to a specific application service.</p><p>Which steps provide the desired outcome?</p>", "question_plain": "A CMDB Administrator is asked to create a query using the CMDB Query Builder that displays all operational Cls belonging to a specific application service.Which steps provide the desired outcome?", "answers": [{"id": "a0", "text": "1. Add the Business Application, Application Service, and Configuration Item classes to the canvas.</p><p>2. Define a filter for the application service name and the operational status of the configuration items. </p><p>3. Configure the relationship between the classes.</p><p>4. Run the query.", "text_plain": "1. Add the Business Application, Application Service, and Configuration Item classes to the canvas.2. Define a filter for the application service name and the operational status of the configuration items. 3. Configure the relationship between the classes.4. Run the query.", "correct": false}, {"id": "a1", "text": "1. Add the Application Service and Configuration Item classes to the canvas.</p><p>2. Configure the relationship between the classes.</p><p>3. Define a filter for the application service name and the operational status of the configuration items. </p><p>4. Run the query.", "text_plain": "1. Add the Application Service and Configuration Item classes to the canvas.2. Configure the relationship between the classes.3. Define a filter for the application service name and the operational status of the configuration items. 4. Run the query.", "correct": true}, {"id": "a2", "text": "1. Add the Application Service and Configuration Item classes to the canvas.</p><p>2. Configure the relationship between the classes.</p><p>3. Add the Operational Status and Name fields as columns.</p><p>4. Run the query.", "text_plain": "1. Add the Application Service and Configuration Item classes to the canvas.2. Configure the relationship between the classes.3. Add the Operational Status and Name fields as columns.4. Run the query.", "correct": false}], "correct_count": 1, "correct_texts": ["1. Add the Application Service and Configuration Item classes to the canvas.2. Configure the relationship between the classes.3. Define a filter for the application service name and the operational status of the configuration items. 4. Run the query."], "explanation": "<p>The <strong>CMDB Query Builder</strong> is a powerful tool for creating complex infrastructure queries without writing SQL. To find specific CIs within a service, you must follow a logical flow of <strong>Class → Connection → Filter</strong>.</p><ol><li><p><code><strong>Classes</strong></code><strong>:</strong> You only need the <strong>Application Service</strong> and the <strong>Configuration Item</strong> (the base class or a specific child class like Server) to get the results.</p></li><li><p><code><strong>Relationships</strong></code><strong>:</strong> You must connect the two nodes on the canvas. This tells the query engine to look for CIs that have an existing relationship (e.g., \"Contained by\" or \"Runs on\") with that service.</p></li><li><p><code><strong>Filters</strong></code><strong>:</strong> This is the most critical step for the specific requirements.</p><ul><li><p>You filter the <strong>Application Service</strong> node by <code>Name</code> (to target the \"specific\" service).</p></li><li><p>You filter the <strong>Configuration Item</strong> node by <code>Operational Status</code> (to ensure you only see \"operational\" items).</p></li></ul></li></ol><p>Reference:</p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/use-cmdb-query-builder.html\" target=\"_blank\" rel=\"noopener\">Build a CMDB query using the CMDB Query Builder (ServiceNow Docs)</a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_14-22-09-5947a8f5e84c652269bee5ea95241aba.png\">\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_14-22-09-53e0d2eda82a9b67d0d1b3397d933094.png\">", "corrected": false}, {"num": 12, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>What is the value of using the CMDB in security operations? (Choose two)</p>", "question_plain": "What is the value of using the CMDB in security operations? (Choose two)", "answers": [{"id": "a0", "text": "Allows security team to assess and remediate an incident", "text_plain": "Allows security team to assess and remediate an incident", "correct": true}, {"id": "a1", "text": "Enables audits and attestations across Cls", "text_plain": "Enables audits and attestations across Cls", "correct": false}, {"id": "a2", "text": "Auto-resolves a vulnerability", "text_plain": "Auto-resolves a vulnerability", "correct": false}, {"id": "a3", "text": "Identifies the IT infrastructure with a vulnerability", "text_plain": "Identifies the IT infrastructure with a vulnerability", "correct": true}], "correct_count": 2, "correct_texts": ["Allows security team to assess and remediate an incident", "Identifies the IT infrastructure with a vulnerability"], "explanation": "<p>The CMDB serves as the \"source of truth\" for the IT environment, and its value in Security Operations (SecOps) is primarily rooted in <strong>visibility</strong> and <strong>context</strong>.</p><ul><li><p><code><strong>Identifies IT infrastructure with a vulnerability</strong></code><strong> (Risk Identification):</strong> When a vulnerability scanner (like Qualys or Tenable) finds a flaw, it identifies an IP address or a hostname. The CMDB translates that raw data into a Configuration Item (CI). This allows the security team to know exactly what the asset is and who owns it.</p></li><li><p><code><strong>Allows security team to assess and remediate an incident</strong></code><strong> (Impact &amp; Response):</strong> Because the CMDB stores relationships (via the Dependency Views), a security analyst can see the \"blast radius\" of an incident. If a server is compromised, the CMDB shows which Business Applications or Services are at risk. This context is vital for prioritizing remediation efforts based on business criticality</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/security-management/vulnerability-response/c_VulnerabilityResponse.html\"><strong>Exploring the Vulnerability Response application (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 13, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator needs to set a CI Class as a Principal Class.</p><p>Which CI Class Manager tab would need to be accessed?</p>", "question_plain": "A CMDB Administrator needs to set a CI Class as a Principal Class.Which CI Class Manager tab would need to be accessed?", "answers": [{"id": "a0", "text": "Health &gt; Attributes", "text_plain": "Health > Attributes", "correct": false}, {"id": "a1", "text": "Class Info &gt; Basic Info", "text_plain": "Class Info > Basic Info", "correct": true}, {"id": "a2", "text": "Class Info &gt; Attributes", "text_plain": "Class Info > Attributes", "correct": false}], "correct_count": 1, "correct_texts": ["Class Info > Basic Info"], "explanation": "<p>In ServiceNow, <strong>Principal Classes</strong> are a subset of CI classes that you designate as the most important or relevant for your organization’s configuration management processes. Setting a class as a Principal Class helps filter noise in the CMDB, as many tools (like the CMDB Workspace or certain CI Pickers) can be configured to show only these \"Principal\" records.</p><p>To enable this setting:</p><ol><li><p>Navigate to the <strong>CI Class Manager</strong>.</p></li><li><p>Select the specific class (e.g., Server, Database, or Business Application) from the class hierarchy.</p></li><li><p>Navigate to the <strong>Class Info</strong> section and click the <strong>Basic Info</strong> tab.</p></li><li><p>There is a checkbox labeled <strong>Principal Class</strong>. Checking this box flags the class accordingly across the platform.</p></li></ol><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/update-principal-class-filter.html\"><strong>Update class list in the Principal Class filter (ServiceNow Docs)</strong></a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_14-41-05-bc0a8ae82388577d861dbd5759fb7474.png\">", "corrected": false}, {"num": 14, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>An organization utilizes multiple data sources to update its CMDB, each assigned a different priority level. A high-priority data source is scheduled to update server records weekly. However, due to an integration issue, the high-priority data source stops updating the records.</p><p>Which configuration can be used to allow a lower-priority data source to update records after a specified period of inactivity from the higher-priority source?</p>", "question_plain": "An organization utilizes multiple data sources to update its CMDB, each assigned a different priority level. A high-priority data source is scheduled to update server records weekly. However, due to an integration issue, the high-priority data source stops updating the records.Which configuration can be used to allow a lower-priority data source to update records after a specified period of inactivity from the higher-priority source?", "answers": [{"id": "a0", "text": "Data Refresh Rules", "text_plain": "Data Refresh Rules", "correct": true}, {"id": "a1", "text": "Health Inclusion Rules", "text_plain": "Health Inclusion Rules", "correct": false}, {"id": "a2", "text": "Identification Rules", "text_plain": "Identification Rules", "correct": false}, {"id": "a3", "text": "Reconciliation Rules", "text_plain": "Reconciliation Rules", "correct": false}], "correct_count": 1, "correct_texts": ["Data Refresh Rules"], "explanation": "<p>ServiceNow uses <strong>Reconciliation Rules</strong> to decide which data source has the authority to update a CI attribute. Normally, if a high-priority source (like Discovery) is authorized, a lower-priority source (like an Excel import) is blocked from making changes to that same attribute.</p><p><strong>Data Refresh Rules</strong> (introduced to enhance the Reconciliation engine) provide a \"failover\" mechanism. They allow a CMDB Administrator to define a <strong>staleness threshold</strong>.</p><ul><li><p>If the high-priority data source fails to update a record within a specific timeframe (e.g., 30 days), the Data Refresh Rule marks that source's \"authority\" as stale for those specific records.</p></li><li><p>Once the high-priority source is considered stale, the <strong>Reconciliation Engine</strong> will allow the next lower-priority data source in line to successfully update the record.</p></li></ul><p>This ensures the CMDB remains up-to-date even if a primary integration fails.</p><p>Reference: <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/create-datasource-staleness-rule.html\" target=\"_blank\" rel=\"noopener\">Create a data refresh rule (ServiceNow Docs)</a></p>", "corrected": false}, {"num": 15, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator wants to leverage the Staleness metric from the CMDB Health Dashboard - Correctness Scorecard. What is the default duration of this metric?</p>", "question_plain": "A CMDB Administrator wants to leverage the Staleness metric from the CMDB Health Dashboard - Correctness Scorecard. What is the default duration of this metric?", "answers": [{"id": "a0", "text": "24 hours", "text_plain": "24 hours", "correct": false}, {"id": "a1", "text": "30 days", "text_plain": "30 days", "correct": false}, {"id": "a2", "text": "7 days", "text_plain": "7 days", "correct": false}, {"id": "a3", "text": "60 days", "text_plain": "60 days", "correct": true}], "correct_count": 1, "correct_texts": ["60 days"], "explanation": "<p>The <strong>Staleness</strong> metric is a sub-metric of the <strong>Correctness</strong> scorecard within the CMDB Health Dashboard. It identifies CIs that haven't been updated within a specific timeframe, suggesting the CI may no longer exist or the data source has failed.</p><p>In a baseline ServiceNow installation:</p><ul><li><p>The system checks the <code>sys_updated_on</code> field (or the discovery source update time).</p></li><li><p>If a CI has not been updated for <code><strong>60 days</strong></code>, it is flagged as <strong>Stale</strong>.</p></li><li><p>This duration is globally configurable via the <strong>CMDB Health Preferences</strong>, but out-of-the-box (OOTB), it is set to <code>60</code>.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/r_CMDBHealthMetrics.html?contentId=rMlrQjWOdtxtDRD8k3ABSg\"><strong>CMDB Health KPIs and metrics (ServiceNow Docs)</strong></a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_15-05-57-20f5c875d383c113b0082d1511af4f67.png\">", "corrected": true}, {"num": 16, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>The CMDB Configuration Management team has successfully developed a healthy and trusted CMDB. They have integrated discovered infrastructure data, accurately referenced non-discoverable data (such as change and support group information), and made the CMDB service-aware using Service Mapping.</p><p>How will these improvements enhance the change management process? (Choose two)</p>", "question_plain": "The CMDB Configuration Management team has successfully developed a healthy and trusted CMDB. They have integrated discovered infrastructure data, accurately referenced non-discoverable data (such as change and support group information), and made the CMDB service-aware using Service Mapping.How will these improvements enhance the change management process? (Choose two)", "answers": [{"id": "a0", "text": "Automatically schedules and deploys changes without human review or approval", "text_plain": "Automatically schedules and deploys changes without human review or approval", "correct": false}, {"id": "a1", "text": "Provides insight into the potential impact of the change", "text_plain": "Provides insight into the potential impact of the change", "correct": true}, {"id": "a2", "text": "Ensures that no changes result in service downtime, regardless of planning or execution", "text_plain": "Ensures that no changes result in service downtime, regardless of planning or execution", "correct": false}, {"id": "a3", "text": "Enables auto population of the assignment group field to dynamically route changes", "text_plain": "Enables auto population of the assignment group field to dynamically route changes", "correct": true}], "correct_count": 2, "correct_texts": ["Provides insight into the potential impact of the change", "Enables auto population of the assignment group field to dynamically route changes"], "explanation": "<p>A \"healthy and trusted\" CMDB is the engine that drives high-maturity ITSM processes. By moving beyond a simple list of hardware to a service-aware model, Change Management gains critical context:</p><ul><li><p><code><strong>Insight into potential impact</strong></code><strong> (B):</strong> When the CMDB is <strong>service-aware</strong> (using Service Mapping), it connects technical infrastructure to the <strong>Application Services</strong> they support. When a change is proposed for that server, the <strong>Dependency Views</strong> or <strong>Impact Analysis</strong> tools can show exactly which business services will be affected. This allows for more accurate risk assessment and better scheduling to avoid business disruption.</p></li><li><p><code><strong>Auto-population for dynamic routing</strong></code><strong> (D):</strong> By accurately referencing <strong>non-discoverable data</strong> on the CI records, the Change Management process becomes more efficient. When selecting a Configuration Item for a Change Request, the platform can automatically pull the <strong>Assignment Group</strong> from the CI record. This ensures the change is routed to correct technical team for implementation without manual intervention.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/overview-cmdb-health.html\"><strong>Overview of CMDB Health (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 17, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator has a report in ServiceNow that lists all CMDB Services that do not have an owner and wants to use a ServiceNow Playbook. What Governance process play can prevent this from recurring?</p>", "question_plain": "A CMDB Administrator has a report in ServiceNow that lists all CMDB Services that do not have an owner and wants to use a ServiceNow Playbook. What Governance process play can prevent this from recurring?", "answers": [{"id": "a0", "text": "Make the field Managed by mandatory on all Cls", "text_plain": "Make the field Managed by mandatory on all Cls", "correct": false}, {"id": "a1", "text": "Make the field Owned by mandatory", "text_plain": "Make the field Owned by mandatory", "correct": true}, {"id": "a2", "text": "Set a default value on the Service Owner field so that is never empty", "text_plain": "Set a default value on the Service Owner field so that is never empty", "correct": false}], "correct_count": 1, "correct_texts": ["Make the field Owned by mandatory"], "explanation": "<p>In the context of <strong>CMDB Governance</strong>, \"Plays\" are designed to enforce best practices.</p><p>The <strong>Owned by</strong> field is a critical CSDM attribute for any <strong>Service</strong> (Business Service, Technical Service, or Application Service). Without owner, there is no accountability for the service's lifecycle, costs, or risks.</p><ul><li><p><strong>Why a Playbook?</strong> A ServiceNow Playbook for CMDB Governance would guide Administrator to enforce data integrity at the point of entry. By making <strong>Owned by</strong> field mandatory on Service classes, the system ensures that a record cannot be created or saved without identifying the responsible individual.</p></li><li><p><strong>The Result:</strong> This prevents the \"empty owner\" issue from recurring because the data entry process is physically blocked unless the information is provided.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/common-service-data-model-csdm/csdm-foundations-dashboard.html\"><strong>Configure the CSDM Data Foundations dashboard (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 18, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p><strong>Which Security Center metric measures the instance hardening level</strong></p>", "question_plain": "Which Security Center metric measures the instance hardening level", "answers": [{"id": "a0", "text": "Compliance score", "text_plain": "Compliance score", "correct": false}, {"id": "a1", "text": "Configuration score", "text_plain": "Configuration score", "correct": true}, {"id": "a2", "text": "Monitoring score", "text_plain": "Monitoring score", "correct": false}, {"id": "a3", "text": "Security scanner", "text_plain": "Security scanner", "correct": false}], "correct_count": 1, "correct_texts": ["Configuration score"], "explanation": "<p>The <strong>ServiceNow Security Center</strong> is designed to provide a comprehensive view of your instance's security posture. Within the dashboard, the <strong>Configuration score</strong> is the primary metric used to measure <strong>instance hardening</strong>.</p><ul><li><p><code><strong>Instance Hardening</strong></code><strong>:</strong> This refers to the process of securing the platform by configuring settings (system properties, plugins, and access controls) to minimize vulnerabilities.</p></li><li><p><code><strong>The Metric</strong></code><strong>:</strong> The Configuration score is calculated based on how many of your instance's settings align with <strong>ServiceNow’s Hardening Guidelines</strong>. For example, it checks if high-security plugins are active, if session timeouts are appropriate, and if administrative access is properly restricted.</p></li><li><p><code><strong>Actionable Data</strong></code><strong>:</strong> If your score is low, the Security Center provides a list of specific \"Hardening\" configurations that are non-compliant, allowing you to remediate them directly.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/platform-security/security-center/homepage.html\"><strong>Security configuration console (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 19, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator is creating technical documentation for stakeholders, which includes a list of attributes, Identification and Reconciliation Engine (IRE) rules, and suggested relationships for several classes.</p><p>Which central location does the CMDB Administrator use to collect this information?</p>", "question_plain": "A CMDB Administrator is creating technical documentation for stakeholders, which includes a list of attributes, Identification and Reconciliation Engine (IRE) rules, and suggested relationships for several classes.Which central location does the CMDB Administrator use to collect this information?", "answers": [{"id": "a0", "text": "CI Class Manager", "text_plain": "CI Class Manager", "correct": true}, {"id": "a1", "text": "CMDB Data Manager", "text_plain": "CMDB Data Manager", "correct": false}, {"id": "a2", "text": "CI Identifiers", "text_plain": "CI Identifiers", "correct": false}, {"id": "a3", "text": "CMDB Workspace", "text_plain": "CMDB Workspace", "correct": false}], "correct_count": 1, "correct_texts": ["CI Class Manager"], "explanation": "<p>The <strong>CI Class Manager</strong> is the \"single pane of glass\" for everything related to the definition and configuration of a CI class. It is the definitive source for technical documentation because it provides a centralized, hierarchical view of:</p><ul><li><p><strong>Attributes:</strong> Lists all fields (columns) inherited from parent classes as well as those unique to the specific class.</p></li><li><p><strong>Identification (IRE) Rules:</strong> Displays the Identification Rules and Identifier Entries that the Identification and Reconciliation Engine uses to prevent duplicate CIs.</p></li><li><p><strong>Suggested Relationships:</strong> Shows the predefined relationship types (e.g., \"Runs on,\" \"Depends on\") that ServiceNow recommends for that specific class to ensure consistent mapping.</p></li><li><p><strong>Health and Reconciliation:</strong> Also contains settings for completeness, correctness, and data source priorities.</p></li></ul><p>Reference: <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/ci-class-manager-landing-page.html\" target=\"_blank\" rel=\"noopener\">CI Class Manager (ServiceNow Docs)</a></p>", "corrected": false}, {"num": 20, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>Where can a CMDB 360/Multisource CMDB Saved Query be viewed and created in the CMDB Workspace?</p>", "question_plain": "Where can a CMDB 360/Multisource CMDB Saved Query be viewed and created in the CMDB Workspace?", "answers": [{"id": "a0", "text": "CMDB Query Builder", "text_plain": "CMDB Query Builder", "correct": false}, {"id": "a1", "text": "Coverage window on the CMDB 360 tab", "text_plain": "Coverage window on the CMDB 360 tab", "correct": false}, {"id": "a2", "text": "Saved queries window on the CMDB 360 tab", "text_plain": "Saved queries window on the CMDB 360 tab", "correct": true}, {"id": "a3", "text": "Saved queries window on the Insights tab", "text_plain": "Saved queries window on the Insights tab", "correct": false}], "correct_count": 1, "correct_texts": ["Saved queries window on the CMDB 360 tab"], "explanation": "<p>The <strong>CMDB 360</strong> (formerly Multisource CMDB) feature in the CMDB Workspace is specifically designed to provide visibility into how different data sources (Discovery, SCCM, Service Graph Connectors, etc.) populate your CI attributes.</p><p>To manage these specific types of queries:</p><ul><li><p><strong>Location:</strong> Navigate to the <strong>CMDB 360</strong> tab within the CMDB Workspace.</p></li><li><p><strong>Creation/Viewing:</strong> This tab contains a dedicated <strong>Saved queries</strong> window (or side panel) where you can access existing multisource queries or launch the <strong>CMDB 360 Query Builder</strong>.</p></li></ul><p>Unlike the standard CMDB Query Builder, which focuses on CI relationships and service topology, the <strong>CMDB 360 Query Builder</strong> focuses on data source comparisons, such as:</p><ul><li><p><code><strong>Get Records</strong></code><strong>:</strong> Finding CIs reported by specific sources.</p></li><li><p><code><strong>Find Gap</strong></code><strong>:</strong> Identifying CIs reported by one source but missing from another.</p></li><li><p><code><strong>Compare Attribute Values</strong></code><strong>:</strong> Finding discrepancies where two sources report different values for the same field (e.g., RAM or CPU count).</p></li></ul><p>Reference:</p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/cmdb-workspace-cmdb360-view.html\" target=\"_blank\" rel=\"noopener\">CMDB 360 view in CMDB Workspace (ServiceNow Docs)</a></p>", "corrected": false}, {"num": 21, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>A CMDB Configuration Manager sets up the following data filter for a certification policy using CMDB Data Manager.</p><p>• Table: Server [cmdb_ci_server]</p><p>• Filter: Operating System | contains | Server OR Operating System | contains | Linux</p><p>Which operating systems are affected by this policy? (Choose two)</p>", "question_plain": "A CMDB Configuration Manager sets up the following data filter for a certification policy using CMDB Data Manager.• Table: Server [cmdb_ci_server]• Filter: Operating System | contains | Server OR Operating System | contains | LinuxWhich operating systems are affected by this policy? (Choose two)", "answers": [{"id": "a0", "text": "AIX", "text_plain": "AIX", "correct": false}, {"id": "a1", "text": "Windows Server 2022 Datacenter", "text_plain": "Windows Server 2022 Datacenter", "correct": true}, {"id": "a2", "text": "Linux CentOS", "text_plain": "Linux CentOS", "correct": true}, {"id": "a3", "text": "Windows 2019 Datacenter", "text_plain": "Windows 2019 Datacenter", "correct": false}], "correct_count": 2, "correct_texts": ["Windows Server 2022 Datacenter", "Linux CentOS"], "explanation": "<p>The data filter uses an <code><strong>OR</strong></code> operator between two conditions:</p><ol><li><p><code><strong>Operating System | contains | Server</strong></code></p></li><li><p><code><strong>Operating System | contains | Linux</strong></code></p></li></ol><p>Because this is an \"OR\" logic, any record that matches <em>either</em> condition will be included in the policy.</p><ul><li><p><strong>B. Windows Server 2022 Datacenter:</strong> This matches the first condition because the string contains the word \"<strong>Server</strong>\".</p></li><li><p><strong>C. Linux Centos:</strong> This matches the second condition because the string contains the word \"<strong>Linux</strong>\".</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/data-manager-create-policy-wrkspc.html\"><strong>Create a CMDB Data Manager policy (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 22, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A Configuration Manager needs to restrict the number of classes available in a Configuration Item reference field on an incident form. How does the Manager set Principal Classes?</p>", "question_plain": "A Configuration Manager needs to restrict the number of classes available in a Configuration Item reference field on an incident form. How does the Manager set Principal Classes?", "answers": [{"id": "a0", "text": "By using the Principal Class check box on the CI Class Manager's 'Attributes' tab for a Class", "text_plain": "By using the Principal Class check box on the CI Class Manager's 'Attributes' tab for a Class", "correct": false}, {"id": "a1", "text": "By using the Principal Class check box on the CMDB Workspace", "text_plain": "By using the Principal Class check box on the CMDB Workspace", "correct": false}, {"id": "a2", "text": "By using the Principal Class attribute on the CI", "text_plain": "By using the Principal Class attribute on the CI", "correct": false}, {"id": "a3", "text": "By using the Principal Class check box on the CI Class Manager's 'Basic Info' tab for a Class", "text_plain": "By using the Principal Class check box on the CI Class Manager's 'Basic Info' tab for a Class", "correct": true}], "correct_count": 1, "correct_texts": ["By using the Principal Class check box on the CI Class Manager's 'Basic Info' tab for a Class"], "explanation": "<p>To refine the <strong>Configuration Item</strong> lookup on forms like Incident, Problem, and Change, ServiceNow uses the concept of <strong>Principal Classes</strong>. This allows administrators to filter out the thousands of low-level or \"tedious\" CIs (like network interfaces or clusters) and only show the major classes that are relevant to ITIL processes.</p><ul><li><p><code><strong>Navigation</strong></code><strong>:</strong> You set this by navigating to <strong>Configuration &gt; CI Class Manager</strong>.</p></li><li><p><code><strong>Configuration</strong></code><strong>:</strong> Once you select a class from the hierarchy (Server or Linux Server), you navigate to the <strong>Basic Info</strong> section in the right-hand pane.</p></li><li><p><code><strong>The Checkbox</strong></code><strong>:</strong> You will find a checkbox labeled <strong>Principal Class</strong>. When checked, CIs from this specific class will appear in reference fields that use the standard Principal Class reference qualifier.</p></li><li><p><code><strong>Inheritance Note</strong></code><strong>:</strong> It is important to remember that marking a parent class as a Principal Class <strong>does not</strong> automatically include its children.</p></li></ul><p>Reference: <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/cmdb-ci-class-models/cmdb-ci-class-models.html\" target=\"_blank\" rel=\"noopener\">CMDB CI Class Models (ServiceNow Docs)</a></p>", "corrected": false}, {"num": 23, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>A CMDB Administrator is comparing the Unified Map to the Service Mapping map.</p><p>What are additional capabilities of the Unified Map? (Choose two)</p>", "question_plain": "A CMDB Administrator is comparing the Unified Map to the Service Mapping map.What are additional capabilities of the Unified Map? (Choose two)", "answers": [{"id": "a0", "text": "Visibility to an application and the host it is installed on", "text_plain": "Visibility to an application and the host it is installed on", "correct": false}, {"id": "a1", "text": "Number of levels displayed on a map can be modified", "text_plain": "Number of levels displayed on a map can be modified", "correct": true}, {"id": "a2", "text": "Map nodes can be filtered based on user preferences", "text_plain": "Map nodes can be filtered based on user preferences", "correct": true}, {"id": "a3", "text": "Map can be zoomed in and out", "text_plain": "Map can be zoomed in and out", "correct": false}], "correct_count": 2, "correct_texts": ["Number of levels displayed on a map can be modified", "Map nodes can be filtered based on user preferences"], "explanation": "<p>The <strong>Unified Map</strong> (available i
