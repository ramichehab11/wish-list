 cycle compliancy in a Business Application context.", "text_plain": "The Asset Management team wants to understand the asset life cycle compliancy in a Business Application context.", "correct": false}, {"id": "a1", "text": "The SecOps team wants to understand the operational risk in the Business Application context.", "text_plain": "The SecOps team wants to understand the operational risk in the Business Application context.", "correct": true}, {"id": "a2", "text": "The Business Service Management team wants to understand the operational impact for their consumer parties.", "text_plain": "The Business Service Management team wants to understand the operational impact for their consumer parties.", "correct": false}, {"id": "a3", "text": "The Event Operations team wants to automate their events into incident for operational actions.", "text_plain": "The Event Operations team wants to automate their events into incident for operational actions.", "correct": false}, {"id": "a4", "text": "The Customer Service team wants to onboard pro-active case management.", "text_plain": "The Customer Service team wants to onboard pro-active case management.", "correct": false}], "correct_count": 1, "correct_texts": ["The SecOps team wants to understand the operational risk in the Business Application context."], "explanation": "", "corrected": true}, {"num": 83, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A customer wants recently imported server records to be automatically reclassified into more specific CMDB classes after being discovered using ServiceNow Discovery.</p><p>During the discovery process, if existing Server [cmdb_ci_server] records are reclassified into the Linux [cmdb_ci_linux_server] and Windows Server [cmdb_ci_win_server] classes, which reclassification operation occurred?</p>", "question_plain": "A customer wants recently imported server records to be automatically reclassified into more specific CMDB classes after being discovered using ServiceNow Discovery.During the discovery process, if existing Server [cmdb_ci_server] records are reclassified into the Linux [cmdb_ci_linux_server] and Windows Server [cmdb_ci_win_server] classes, which reclassification operation occurred?", "answers": [{"id": "a0", "text": "Class Switch", "text_plain": "Class Switch", "correct": false}, {"id": "a1", "text": "Class Downgrade", "text_plain": "Class Downgrade", "correct": false}, {"id": "a2", "text": "Class Upgrade", "text_plain": "Class Upgrade", "correct": true}], "correct_count": 1, "correct_texts": ["Class Upgrade"], "explanation": "", "corrected": false}, {"num": 84, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Administrator is reviewing the health of the CMDB and notices a large percentage of the Hardware Cls are missing serial numbers. The Administrator is concerned this may cause duplicate Cls and would like to resolve the issue in a timely manner.</p><p>What structured guidelines provided by ServiceNow are available to troubleshoot and resolve the issue?</p>", "question_plain": "A CMDB Administrator is reviewing the health of the CMDB and notices a large percentage of the Hardware Cls are missing serial numbers. The Administrator is concerned this may cause duplicate Cls and would like to resolve the issue in a timely manner.What structured guidelines provided by ServiceNow are available to troubleshoot and resolve the issue?", "answers": [{"id": "a0", "text": "CSDM Now Create Playbooks", "text_plain": "CSDM Now Create Playbooks", "correct": false}, {"id": "a1", "text": "CMDB Data Foundations Dashboard Playbooks", "text_plain": "CMDB Data Foundations Dashboard Playbooks", "correct": false}, {"id": "a2", "text": "CMDB Health Dashboard Playbooks", "text_plain": "CMDB Health Dashboard Playbooks", "correct": true}, {"id": "a3", "text": "CSDM Data Foundations Dashboard Playbooks", "text_plain": "CSDM Data Foundations Dashboard Playbooks", "correct": false}], "correct_count": 1, "correct_texts": ["CMDB Health Dashboard Playbooks"], "explanation": "", "corrected": false}, {"num": 85, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A Platform Owner is collaborating with stakeholders in the manufacturing industry to align their Cls with the CSDM 5 framework. They need to map production line monitoring systems to the appropriate CSDM domain.</p><p>Which CSDM 5 domain does the Platform Owner use?</p>", "question_plain": "A Platform Owner is collaborating with stakeholders in the manufacturing industry to align their Cls with the CSDM 5 framework. They need to map production line monitoring systems to the appropriate CSDM domain.Which CSDM 5 domain does the Platform Owner use?", "answers": [{"id": "a0", "text": "Service Delivery (Manage Technical)", "text_plain": "Service Delivery (Manage Technical)", "correct": true}, {"id": "a1", "text": "Foundation", "text_plain": "Foundation", "correct": false}, {"id": "a2", "text": "Build and Integration (Build)", "text_plain": "Build and Integration (Build)", "correct": false}, {"id": "a3", "text": "Service Consumption (Sell/Consume)", "text_plain": "Service Consumption (Sell/Consume)", "correct": false}, {"id": "a4", "text": "Design and Planning (Design)", "text_plain": "Design and Planning (Design)", "correct": false}], "correct_count": 1, "correct_texts": ["Service Delivery (Manage Technical)"], "explanation": "", "corrected": false}, {"num": 86, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>The Configuration Manager is preparing the justification to utilize the CMDB Data Foundations Dashboard. Which benefits align with the usage of this dashboard? (Choose two)</p>", "question_plain": "The Configuration Manager is preparing the justification to utilize the CMDB Data Foundations Dashboard. Which benefits align with the usage of this dashboard? (Choose two)", "answers": [{"id": "a0", "text": "It provides actionable insights to improve data quality and completeness.", "text_plain": "It provides actionable insights to improve data quality and completeness.", "correct": true}, {"id": "a1", "text": "It enables monitoring and tracking of CMDB health over time.", "text_plain": "It enables monitoring and tracking of CMDB health over time.", "correct": true}, {"id": "a2", "text": "It automates the approval process for change management.", "text_plain": "It automates the approval process for change management.", "correct": false}, {"id": "a3", "text": "It helps detect and eliminate duplicate records in the CMDB.", "text_plain": "It helps detect and eliminate duplicate records in the CMDB.", "correct": false}], "correct_count": 2, "correct_texts": ["It provides actionable insights to improve data quality and completeness.", "It enables monitoring and tracking of CMDB health over time."], "explanation": "", "corrected": false}, {"num": 87, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A Configuration Manager is planning the implementation of the CMDB.</p><p>Which is the prescribed CSDM rollout order?</p>", "question_plain": "A Configuration Manager is planning the implementation of the CMDB.Which is the prescribed CSDM rollout order?", "answers": [{"id": "a0", "text": "Initiate, Plan, Execute, Deliver, Close", "text_plain": "Initiate, Plan, Execute, Deliver, Close", "correct": false}, {"id": "a1", "text": "Architecture, Business, Technical, Governance", "text_plain": "Architecture, Business, Technical, Governance", "correct": false}, {"id": "a2", "text": "Foundation, Crawl, Walk, Run, Fly", "text_plain": "Foundation, Crawl, Walk, Run, Fly", "correct": true}, {"id": "a3", "text": "Initial, Developing, Defined, Managed", "text_plain": "Initial, Developing, Defined, Managed", "correct": false}], "correct_count": 1, "correct_texts": ["Foundation, Crawl, Walk, Run, Fly"], "explanation": "", "corrected": false}, {"num": 88, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Administrator needs to import external data into the CMDB. As the CMDB Administrator wants to reduce the risk for creating duplicates and to update information from unauthorized sources, it has to be ensured that the Identification and Reconciliation API will not be bypassed.</p><p>What is the recommended method to import data into the CMDB utilizing the Identification and Reconciliation API?</p>", "question_plain": "A CMDB Administrator needs to import external data into the CMDB. As the CMDB Administrator wants to reduce the risk for creating duplicates and to update information from unauthorized sources, it has to be ensured that the Identification and Reconciliation API will not be bypassed.What is the recommended method to import data into the CMDB utilizing the Identification and Reconciliation API?", "answers": [{"id": "a0", "text": "Import Sets and Transform Maps", "text_plain": "Import Sets and Transform Maps", "correct": false}, {"id": "a1", "text": "IntegrationHub ETL", "text_plain": "IntegrationHub ETL", "correct": true}, {"id": "a2", "text": "Table API (REST API or SOAP API)", "text_plain": "Table API (REST API or SOAP API)", "correct": false}], "correct_count": 1, "correct_texts": ["IntegrationHub ETL"], "explanation": "", "corrected": false}, {"num": 89, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>Which is a purpose or requirement of CMDB Data Manager in ServiceNow?</p>", "question_plain": "Which is a purpose or requirement of CMDB Data Manager in ServiceNow?", "answers": [{"id": "a0", "text": "Automates the enforcement of relationship rules between Cls in the CMDB", "text_plain": "Automates the enforcement of relationship rules between Cls in the CMDB", "correct": false}, {"id": "a1", "text": "Automates the archival and deletion of records based on retention policies", "text_plain": "Automates the archival and deletion of records based on retention policies", "correct": true}, {"id": "a2", "text": "Encrypts archived records for enhanced security", "text_plain": "Encrypts archived records for enhanced security", "correct": false}], "correct_count": 1, "correct_texts": ["Automates the archival and deletion of records based on retention policies"], "explanation": "<p>The <strong>CMDB Data Manager</strong> is a policy-driven framework used to automate the <strong>lifecycle management</strong> of CIs. </p><p>As a CMDB grows, it inevitably accumulates \"stale\" or \"retired\" data that can clutter the database and impact performance. This tool allows Configuration Managers to define specific policies that trigger automated tasks for records that meet certain criteria </p><p><strong>Core Capabilities of Data Manager</strong></p><ul><li><p><code><strong>Lifecycle Automation</strong></code><strong>:</strong> It handles the transition of CIs through stages like Attestation, Archive, and Deletion without manual oversight for every record.</p></li><li><p><code><strong>Policy-Driven</strong></code><strong>:</strong> You create <strong>CMDB Data Manager Policies</strong> targeting specific CI classes and conditions.</p></li><li><p><code><strong>Approval Workflows</strong></code><strong>:</strong> Before a CI is deleted or archived, the tool can generate a task for the CI owner to approve the action, ensuring governance is maintained.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/cmdb-data-management.html\"><strong>Working with CMDB Data Manager (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/data-manager-create-policy-wrkspc.html\"><strong>Create a CMDB Data Manager policy (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 90, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Manager wants to improve data quality using the CMDB Health Dashboard.</p><p>What needs to happen to generate CMDB health scores?</p>", "question_plain": "A CMDB Manager wants to improve data quality using the CMDB Health Dashboard.What needs to happen to generate CMDB health scores?", "answers": [{"id": "a0", "text": "The scheduled jobs for the CMDB Health Dashboard must be activated", "text_plain": "The scheduled jobs for the CMDB Health Dashboard must be activated", "correct": true}, {"id": "a1", "text": "Nothing, CMDB health scores are calculated by default", "text_plain": "Nothing, CMDB health scores are calculated by default", "correct": false}, {"id": "a2", "text": "The plugin, CMDB health calculation, needs to be installed", "text_plain": "The plugin, CMDB health calculation, needs to be installed", "correct": false}], "correct_count": 1, "correct_texts": ["The scheduled jobs for the CMDB Health Dashboard must be activated"], "explanation": "<p>CMDB health scores are not calculated in real-time to prevent system performance issues. Instead, the platform uses <strong>Scheduled Jobs</strong> to process data and generate metrics for the dashboard. While the rules (Completeness, Compliance, Correctness) are built into the platform, they remain dormant until these jobs are triggered.</p><p><strong>The Role of Scheduled Jobs</strong></p><p>These background processes audit the CMDB and populate the dashboard:</p><ul><li><p><strong>CMDB Health Monitor:</strong> The primary job that orchestrates the overall health evaluation.</p></li><li><p><strong>Metric-Specific Jobs:</strong> Individual jobs (like Correctness or Stale CI) that target specific data quality issues.</p></li><li><p><strong>Frequency:</strong> These typically run daily during off-peak hours to ensure that management sees an updated \"Scorecard\" every morning.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/exploring-cmdb-health-parent-d72599e27060.html\"><strong>Explore CMDB Health (ServiceNow Docs)</strong></a></p><p><strong>-</strong> <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/cmdb-table-property-descriptions.html\"><strong>Configuration Item [cmdb_ci] class (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 91, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A manufacturing organization has implemented Incident Management in ServicaNow and wants to integrate additional products to enhance its functionality.</p><p>Drag each ServiceNow product to the value it brings to supporting Incident Management:</p><p>A. Discovery</p><p>B. Hardware Asset Management</p><p>C. Risk Management</p><p>D. Service Portfolio Management</p><p>1. Delivers asset actions and events for the management and maintenance of assets during incidents</p><p>2. Supplies critical IT and financial risk data, enabling the team to assess the broader impact of incidents on business operations</p><p>3. Offers detailed operational-level data on hardware and application to improve incident resolution</p><p>4. Provides life cycle information about services, helping to align Incidents with the status and history of services</p>", "question_plain": "A manufacturing organization has implemented Incident Management in ServicaNow and wants to integrate additional products to enhance its functionality.Drag each ServiceNow product to the value it brings to supporting Incident Management:A. DiscoveryB. Hardware Asset ManagementC. Risk ManagementD. Service Portfolio Management1. Delivers asset actions and events for the management and maintenance of assets during incidents2. Supplies critical IT and financial risk data, enabling the team to assess the broader impact of incidents on business operations3. Offers detailed operational-level data on hardware and application to improve incident resolution4. Provides life cycle information about services, helping to align Incidents with the status and history of services", "answers": [{"id": "a0", "text": "A-3, B-4, C-2, D-1", "text_plain": "A-3, B-4, C-2, D-1", "correct": false}, {"id": "a1", "text": "A-2, B-1, C-3, D-4", "text_plain": "A-2, B-1, C-3, D-4", "correct": false}, {"id": "a2", "text": "A-3, B-1, C-2, D-4", "text_plain": "A-3, B-1, C-2, D-4", "correct": true}, {"id": "a3", "text": "A-4, B-1, C-2, D-3", "text_plain": "A-4, B-1, C-2, D-3", "correct": false}], "correct_count": 1, "correct_texts": ["A-3, B-1, C-2, D-4"], "explanation": "<p><strong>B. </strong><code><strong>Hardware Asset Management</strong></code><strong> (1)</strong></p><p>HAM goes beyond the CMDB by tracking the <strong>Financial and Contractual</strong> lifecycle. During an incident, HAM provides data on whether a device is under warranty or if a \"Swap\" action is available, ensuring the technician knows if they should repair the item or trigger an asset replacement.</p><p><strong>C. R</strong><code><strong>isk Management</strong></code><strong> (2)</strong></p><p>This integration allows the Incident team to see if a specific CI is tied to a <strong>High-Risk</strong> business process. If an incident occurs on a server hosting a regulated financial application, the Risk Management data flags the potential for non-compliance or significant financial loss, often elevating the priority of the incident.</p><p><strong>A. </strong><code><strong>Discovery</strong></code><strong> (3)</strong></p><p>Discovery is the \"engine\" that populates the CMDB with real-time configuration data. For an Incident agent, this means having access to the <strong>exact</strong> OS version, CPU count, and installed software of a failing CI, which eliminates the need to manually ask the user for technical specifications.</p><p><strong>D. </strong><code><strong>Service Portfolio Management</strong></code><strong> (4)</strong></p><p>SPM defines the \"Health\" and \"History\" of a service. By integrating with Incident, it helps administrators see if a service is currently in a <strong>\"Retired\"</strong> or <strong>\"Pipeline\"</strong> status, preventing incidents from being logged against services that are no longer supported or not yet live.</p><p><strong>Main Takeaway:</strong></p><ul><li><p><strong>Discovery</strong> provides the technical \"What,\" <strong>Asset Management</strong> provides the financial \"How,\" <strong>Risk</strong> provides the \"So What\" (impact), and <strong>SPM</strong> provides the \"When\" (lifecycle context).</p></li></ul>", "corrected": false}, {"num": 92, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>A CMDB Administrator wants to run the Services Have Owners Identified playbook to remediate the issues shown in the CMDB Data Foundations Dashboard.</p><p>Which remediation plays would be used? (Choose two)</p>", "question_plain": "A CMDB Administrator wants to run the Services Have Owners Identified playbook to remediate the issues shown in the CMDB Data Foundations Dashboard.Which remediation plays would be used? (Choose two)", "answers": [{"id": "a0", "text": "Govern Data", "text_plain": "Govern Data", "correct": true}, {"id": "a1", "text": "Report Data", "text_plain": "Report Data", "correct": false}, {"id": "a2", "text": "Fix Data", "text_plain": "Fix Data", "correct": true}], "correct_count": 2, "correct_texts": ["Govern Data", "Fix Data"], "explanation": "", "corrected": false}, {"num": 93, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>Where can a CMDB 360/Multisource CMDB Saved Query be viewed and created in the CMDB Workspace?</p>", "question_plain": "Where can a CMDB 360/Multisource CMDB Saved Query be viewed and created in the CMDB Workspace?", "answers": [{"id": "a0", "text": "Saved queries window on the Insights tab", "text_plain": "Saved queries window on the Insights tab", "correct": false}, {"id": "a1", "text": "CMDB Query Builder", "text_plain": "CMDB Query Builder", "correct": false}, {"id": "a2", "text": "Saved queries window on the CMDB 360 tab", "text_plain": "Saved queries window on the CMDB 360 tab", "correct": true}, {"id": "a3", "text": "Coverage window on the CMDB 360 tab", "text_plain": "Coverage window on the CMDB 360 tab", "correct": false}], "correct_count": 1, "correct_texts": ["Saved queries window on the CMDB 360 tab"], "explanation": "", "corrected": false}, {"num": 94, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Administrator is implementing a Vulnerability Response or Security Incident Response and needs to ensure customers have enough context to estimate risk and set task priorities.</p><p>Which Get Well Playbook from the CSDM Data Foundations Dashboard helps with this?</p>", "question_plain": "A CMDB Administrator is implementing a Vulnerability Response or Security Incident Response and needs to ensure customers have enough context to estimate risk and set task priorities.Which Get Well Playbook from the CSDM Data Foundations Dashboard helps with this?", "answers": [{"id": "a0", "text": "Percentage of Custom Status Values for CI Life Cycle Stages", "text_plain": "Percentage of Custom Status Values for CI Life Cycle Stages", "correct": false}, {"id": "a1", "text": "Named Product Models without Product Owners", "text_plain": "Named Product Models without Product Owners", "correct": false}, {"id": "a2", "text": "Locations without a Parent Location", "text_plain": "Locations without a Parent Location", "correct": false}, {"id": "a3", "text": "Application Services with Business Application Relationships", "text_plain": "Application Services with Business Application Relationships", "correct": true}], "correct_count": 1, "correct_texts": ["Application Services with Business Application Relationships"], "explanation": "", "corrected": false}, {"num": 95, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A Change Manager aims to streamline ITSM processes by automatically populating fields on the Change form when a CI is selected. The Configuration Management team is working to ensure that the Change Group field is populated for all managed Cls.</p><p>As a result, which base system field on the incident form will be automatically populated after selecting a CI?</p>", "question_plain": "A Change Manager aims to streamline ITSM processes by automatically populating fields on the Change form when a CI is selected. The Configuration Management team is working to ensure that the Change Group field is populated for all managed Cls.As a result, which base system field on the incident form will be automatically populated after selecting a CI?", "answers": [{"id": "a0", "text": "Change group", "text_plain": "Change group", "correct": false}, {"id": "a1", "text": "Assignment group", "text_plain": "Assignment group", "correct": true}, {"id": "a2", "text": "Managed by group", "text_plain": "Managed by group", "correct": false}, {"id": "a3", "text": "Approval group", "text_plain": "Approval group", "correct": false}], "correct_count": 1, "correct_texts": ["Assignment group"], "explanation": "", "corrected": false}, {"num": 96, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>CMDB class owners are receiving tasks under the 'My Work' tab in the CMDB Workspace.</p><p>Which CMDB management tool is generating these tasks?</p>", "question_plain": "CMDB class owners are receiving tasks under the 'My Work' tab in the CMDB Workspace.Which CMDB management tool is generating these tasks?", "answers": [{"id": "a0", "text": "CMDB Health Dashboard", "text_plain": "CMDB Health Dashboard", "correct": false}, {"id": "a1", "text": "De-duplication templates", "text_plain": "De-duplication templates", "correct": false}, {"id": "a2", "text": "CMDB Data Manager", "text_plain": "CMDB Data Manager", "correct": true}], "correct_count": 1, "correct_texts": ["CMDB Data Manager"], "explanation": "", "corrected": false}, {"num": 97, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>Which type of CMDB Data Manager policy creates tasks that allow the assigned individual to update fields on the Cl record?</p>", "question_plain": "Which type of CMDB Data Manager policy creates tasks that allow the assigned individual to update fields on the Cl record?", "answers": [{"id": "a0", "text": "Compliance", "text_plain": "Compliance", "correct": false}, {"id": "a1", "text": "Audit", "text_plain": "Audit", "correct": false}, {"id": "a2", "text": "Attestation", "text_plain": "Attestation", "correct": false}, {"id": "a3", "text": "Certification", "text_plain": "Certification", "correct": true}], "correct_count": 1, "correct_texts": ["Certification"], "explanation": "", "corrected": false}, {"num": 98, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>Configuration Management requires an accurate inventory of devices to be reflected in the CMDB.</p><p>Which are common use cases for using Agent Client Collector (ACC)? (Choose two)</p>", "question_plain": "Configuration Management requires an accurate inventory of devices to be reflected in the CMDB.Which are common use cases for using Agent Client Collector (ACC)? (Choose two)", "answers": [{"id": "a0", "text": "Network devices in the DMZ", "text_plain": "Network devices in the DMZ", "correct": false}, {"id": "a1", "text": "Devices in secure environments", "text_plain": "Devices in secure environments", "correct": true}, {"id": "a2", "text": "Servers in the data center", "text_plain": "Servers in the data center", "correct": false}, {"id": "a3", "text": "Devices that intermittently connect to the network", "text_plain": "Devices that intermittently connect to the network", "correct": true}], "correct_count": 2, "correct_texts": ["Devices in secure environments", "Devices that intermittently connect to the network"], "explanation": "", "corrected": false}, {"num": 99, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>Multiple integrations are permitted to write to the same CI class and attributes in the CMDB. The Configuration Manager wants to ensure that, when conflicting values are detected, <strong>one data source always overrides the others</strong>.</p><p>Which configuration enables this behavior?</p>", "question_plain": "Multiple integrations are permitted to write to the same CI class and attributes in the CMDB. The Configuration Manager wants to ensure that, when conflicting values are detected, one data source always overrides the others.Which configuration enables this behavior?", "answers": [{"id": "a0", "text": "Run order configuration in identification rules", "text_plain": "Run order configuration in identification rules", "correct": false}, {"id": "a1", "text": "Scheduled refresh timing for each data source", "text_plain": "Scheduled refresh timing for each data source", "correct": false}, {"id": "a2", "text": "Priority assignment in reconciliation rules", "text_plain": "Priority assignment in reconciliation rules", "correct": true}, {"id": "a3", "text": "Manual execution of data source imports", "text_plain": "Manual execution of data source imports", "correct": false}], "correct_count": 1, "correct_texts": ["Priority assignment in reconciliation rules"], "explanation": "<p>When multiple authorized data sources update the same CI class and attributes, conflicts are handled by the <strong>Identification and Reconciliation Engine (IRE)</strong>. The way to control which source “wins” is by setting <strong>data source priorities in the reconciliation rules</strong>. During reconciliation, the IRE compares incoming values and applies the value from the <strong>highest-priority data source</strong>, ensuring it consistently overrides others.</p><p>Run order in identification rules affects how CIs are identified, not which attribute values are kept. Scheduled refresh timing only controls when data is updated, not conflict resolution. Manually running imports does not establish authoritative control and is not scalable or reliable.</p><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/r_ReconciliationRulesPrinciples.html\"><strong>Reconciliation rules (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/exploring-ire.html\"><strong>Exploring CMDB Identification and Reconciliation (IRE) (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 100, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>To regularly verify the existence and accuracy of Configuration Items, a Configuration Manager plans to use a policy that <strong>creates review tasks and assigns them to appropriate users</strong>.</p><p>Which policy type supports this functionality?</p>", "question_plain": "To regularly verify the existence and accuracy of Configuration Items, a Configuration Manager plans to use a policy that creates review tasks and assigns them to appropriate users.Which policy type supports this functionality?", "answers": [{"id": "a0", "text": "Delete", "text_plain": "Delete", "correct": false}, {"id": "a1", "text": "Attestation", "text_plain": "Attestation", "correct": true}, {"id": "a2", "text": "Certification", "text_plain": "Certification", "correct": false}, {"id": "a3", "text": "Retire", "text_plain": "Retire", "correct": false}], "correct_count": 1, "correct_texts": ["Attestation"], "explanation": "<p>The <strong>CMDB Data Manager</strong> uses policy types to drive the lifecycle of Configuration Items. When the goal is to <strong>validate the existence</strong> of CIs - essentially asking a human \"Is this server still in the rack?\" or \"Do you still have this laptop?\" - the <strong>Attestation</strong> policy is the correct choice.</p><ul><li><p><code><strong>Automation</strong></code><strong>:</strong> Once the policy conditions are met (e.g., CIs that haven't been discovered in 60 days), the Data Manager automatically creates <strong>Data Management Tasks</strong>.</p></li><li><p><code><strong>Assignment</strong></code><strong>:</strong> These tasks are assigned to the individual listed in the <strong>Managed by</strong> field of the CI.</p></li><li><p><code><strong>Validation</strong></code><strong>:</strong> The assignee must review the list and \"Attest\" that the CIs still exist or mark them as missing.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/data-manager-create-policy-wrkspc.html\"><strong>Create a CMDB Data Manager policy (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 101, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>A CMDB Administrator wants to create a CMDB query to find all databases located in Seattle that are connected to application services. They also want to include incidents related to those databases.</p><p>Which actions does the company take to build this query? (Choose two) </p>", "question_plain": "A CMDB Administrator wants to create a CMDB query to find all databases located in Seattle that are connected to application services. They also want to include incidents related to those databases.Which actions does the company take to build this query? (Choose two)", "answers": [{"id": "a0", "text": "Add a filter to the database node for location = Seattle", "text_plain": "Add a filter to the database node for location = Seattle", "correct": true}, {"id": "a1", "text": "Add to the canvas the Incident table from the Non-CMDB Tables list", "text_plain": "Add to the canvas the Incident table from the Non-CMDB Tables list", "correct": true}, {"id": "a2", "text": "Set the relationship level to 'Up to 2nd level relationships'", "text_plain": "Set the relationship level to 'Up to 2nd level relationships'", "correct": false}, {"id": "a3", "text": "Add property columns to the application service node", "text_plain": "Add property columns to the application service node", "correct": false}], "correct_count": 2, "correct_texts": ["Add a filter to the database node for location = Seattle", "Add to the canvas the Incident table from the Non-CMDB Tables list"], "explanation": "", "corrected": false}, {"num": 102, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Administrator identifies duplicate Cls. One was created by a manual import, and the other one was created by automated discovery. The discovered CI has the latest IP address, while the manually imported CI has an accurate relationship to a critical business application.</p><p>How does the Administrator use the Duplicate CI Remediator to resolve this issue?</p>", "question_plain": "A CMDB Administrator identifies duplicate Cls. One was created by a manual import, and the other one was created by automated discovery. The discovered CI has the latest IP address, while the manually imported CI has an accurate relationship to a critical business application.How does the Administrator use the Duplicate CI Remediator to resolve this issue?", "answers": [{"id": "a0", "text": "Merge the two Cls automatically, retaining all attributes from the discovered Cl", "text_plain": "Merge the two Cls automatically, retaining all attributes from the discovered Cl", "correct": false}, {"id": "a1", "text": "Retain the discovered Cl, and delete the manually imported CI", "text_plain": "Retain the discovered Cl, and delete the manually imported CI", "correct": false}, {"id": "a2", "text": "Retain the discovered CI, but merge the relationship from the manually imported Cl", "text_plain": "Retain the discovered CI, but merge the relationship from the manually imported Cl", "correct": true}, {"id": "a3", "text": "Retain the manually imported Cl, and delete the discovered CI", "text_plain": "Retain the manually imported Cl, and delete the discovered CI", "correct": false}], "correct_count": 1, "correct_texts": ["Retain the discovered CI, but merge the relationship from the manually imported Cl"], "explanation": "", "corrected": false}, {"num": 103, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>The CMDB Configuration Management team wants to manage de-duplication tasks generated from data ingested into the CMDB via the Identification and Reconciliation Engine (IRE).</p><p>In which area of the CMDB Workspace can they locate these de-duplication tasks?</p>", "question_plain": "The CMDB Configuration Management team wants to manage de-duplication tasks generated from data ingested into the CMDB via the Identification and Reconciliation Engine (IRE).In which area of the CMDB Workspace can they locate these de-duplication tasks?", "answers": [{"id": "a0", "text": "Important actions tile under the Home tab", "text_plain": "Important actions tile under the Home tab", "correct": true}, {"id": "a1", "text": "Total status tile under the My Work tab", "text_plain": "Total status tile under the My Work tab", "correct": false}, {"id": "a2", "text": "CMDB feature adoption tile under the Insights tab", "text_plain": "CMDB feature adoption tile under the Insights tab", "correct": false}], "correct_count": 1, "correct_texts": ["Important actions tile under the Home tab"], "explanation": "", "corrected": false}, {"num": 104, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>A Change Manager wants to gain value from CSDM.</p><p>How will the Change Management process benefit from CSDM? (Choose two)</p>", "question_plain": "A Change Manager wants to gain value from CSDM.How will the Change Management process benefit from CSDM? (Choose two)", "answers": [{"id": "a0", "text": "Determine the root cause of the change issue", "text_plain": "Determine the root cause of the change issue", "correct": false}, {"id": "a1", "text": "Identify blackout windows for the change", "text_plain": "Identify blackout windows for the change", "correct": false}, {"id": "a2", "text": "Understand the impact of the change on services", "text_plain": "Understand the impact of the change on services", "correct": true}, {"id": "a3", "text": "Route the change dynamically", "text_plain": "Route the change dynamically", "correct": true}], "correct_count": 2, "correct_texts": ["Understand the impact of the change on services", "Route the change dynamically"], "explanation": "", "corrected": false}, {"num": 105, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A development team is working on a project and an application will be deployed to many servers. There will be several security requirements that must be checked to adhere to lawful regulatory compliance because the application will be holding customer personal data (Pll and PCI).</p><p>Where in the CSDM does the development team look to store the information that will be used to satisfy the audits?</p>", "question_plain": "A development team is working on a project and an application will be deployed to many servers. There will be several security requirements that must be checked to adhere to lawful regulatory compliance because the application will be holding customer personal data (Pll and PCI).Where in the CSDM does the development team look to store the information that will be used to satisfy the audits?", "answers": [{"id": "a0", "text": "Customer Service Offerings and Databases", "text_plain": "Customer Service Offerings and Databases", "correct": false}, {"id": "a1", "text": "Business Applications and Information Objects", "text_plain": "Business Applications and Information Objects", "correct": true}, {"id": "a2", "text": "Technology Management Service Offerings (Technical Service Offerings) and Dynamic Cl Groups", "text_plain": "Technology Management Service Offerings (Technical Service Offerings) and Dynamic Cl Groups", "correct": false}], "correct_count": 1, "correct_texts": ["Business Applications and Information Objects"], "explanation": "", "corrected": false}, {"num": 106, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>A CMDB Administrator is evaluating whether to monitor the metrics provided on the CMDB Data Foundation Dashboard. Which benefits support the decision to continually monitor the results on this dashboard? (Choose two)</p>", "question_plain": "A CMDB Administrator is evaluating whether to monitor the metrics provided on the CMDB Data Foundation Dashboard. Which benefits support the decision to continually monitor the results on this dashboard? (Choose two)", "answers": [{"id": "a0", "text": "Provides metrics for Cls Processed by the IRE", "text_plain": "Provides metrics for Cls Processed by the IRE", "correct": true}, {"id": "a1", "text": "Reports on all orphan Cls in the CMDB", "text_plain": "Reports on all orphan Cls in the CMDB", "correct": false}, {"id": "a2", "text": "Provides metrics on active Cls updated in the last 90 days", "text_plain": "Provides metrics on active Cls updated in the last 90 days", "correct": true}, {"id": "a3", "text": "Provides a list of all Cls that failed health audits", "text_plain": "Provides a list of all Cls that failed health audits", "correct": false}], "correct_count": 2, "correct_texts": ["Provides metrics for Cls Processed by the IRE", "Provides metrics on active Cls updated in the last 90 days"], "explanation": "", "corrected": false}, {"num": 107, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>Drag and drop the application service type to the best description.</p><p>1. Dynamic Cl Group</p><p>2. Service Mapping (Connection Suggestion)</p><p>3. Service Mapping (Top-down)</p><p>4. Tag-Based</p><p>A. Recommended for mission-critical application services requires a precise approach using patterns</p><p>B. Best fit to map cloud-native, container-based, or virtual machine environments</p><p>C. Ideal for custom-built applications and leverages fingerprinting to generate service maps in a timeline</p><p>D. Ideal for small application services that can be easily using filters and CMDB queries</p>", "question_plain": "Drag and drop the application service type to the best description.1. Dynamic Cl Group2. Service Mapping (Connection Suggestion)3. Service Mapping (Top-down)4. Tag-BasedA. Recommended for mission-critical application services requires a precise approach using patternsB. Best fit to map cloud-native, container-based, or virtual machine environmentsC. Ideal for custom-built applications and leverages fingerprinting to generate service maps in a timelineD. Ideal for small application services that can be easily using filters and CMDB queries", "answers": [{"id": "a0", "text": "1-D, 2-C, 3-A, 4-B", "text_plain": "1-D, 2-C, 3-A, 4-B", "correct": false}, {"id": "a1", "text": "1-D, 2-C, 3-A, 4-B", "text_plain": "1-D, 2-C, 3-A, 4-B", "correct": true}, {"id": "a2", "text": "1-D, 2-C, 3-A, 4-B", "text_plain": "1-D, 2-C, 3-A, 4-B", "correct": false}, {"id": "a3", "text": "1-D, 2-C, 3-A, 4-B", "text_plain": "1-D, 2-C, 3-A, 4-B", "correct": false}], "correct_count": 1, "correct_texts": ["1-D, 2-C, 3-A, 4-B"], "explanation": "<p><strong>3. </strong><code><strong>Service Mapping (Top-down)</strong></code><strong> (A)</strong></p><p>This is the most rigorous method. It uses <strong>Patterns</strong> to follow traffic from an entry point (like a URL) through the load balancer, web server, and down to the database. It is the gold standard for high-visibility services where you need to know exactly which CI impacts the service.</p><p><strong>4. </strong><code><strong>Tag-Based</strong></code><strong> (B)</strong></p><p>In modern, ephemeral environments (AWS, Azure, Kubernetes), infrastructure changes too fast for traditional patterns. <strong>Tag-based mapping</strong> groups CIs together based on specific key-value pairs (e.g., <code>App: Webstore</code>, <code>Env: Prod</code>) found on the resources.</p><p><strong>2. </strong><code><strong>Service Mapping (Connection Suggestion)</strong></code><strong> (C)</strong></p><p>This leverages <strong>Machine Learning</strong> and <strong>Fingerprinting</strong>. It looks at traffic patterns and suggests connections between CIs. It is excellent for mapping applications where you don't have a pre-defined pattern but have active traffic data to analyze.</p><p><strong>1. </strong><code><strong>Dynamic CI Group</strong></code><strong> (D)</strong></p><p>This is the simplest form. It doesn't actually \"map\" connections; instead, it uses a <strong>CMDB Query</strong> or filter to group CIs (e.g., \"All Linux Servers in the Boston Data Center\"). It is ideal for \"micro-services\" or managing groups of similar infrastructure items.</p><p>Reference:&nbsp;<a href=\"https://www.servicenow.com/docs/r/field-service-management/field-service-scheduling/c_UseAutoAssignment.html\" target=\"_blank\" rel=\"noopener\">Configuring Auto Assignment scheduling (ServiceNow Docs)</a></p>", "corrected": false}, {"num": 108, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A Platform Data Owner wants to improve data quality with a few reconciliation rules across the five discovery sources that are being used. The Data Owner knows the best option is to include CMDB 360/Multisource CMDB to manage and monitor discovery sources, but the company currently does not have a license for ITOM Discovery that is required for CMDB 360/Multisource CMDB.</p><p>What can the Data Owner do in this case?</p>", "question_plain": "A Platform Data Owner wants to improve data quality with a few reconciliation rules across the five discovery sources that are being used. The Data Owner knows the best option is to include CMDB 360/Multisource CMDB to manage and monitor discovery sources, but the company currently does not have a license for ITOM Discovery that is required for CMDB 360/Multisource CMDB.What can the Data Owner do in this case?", "answers": [{"id": "a0", "text": "CMBD 360/Multisource is a platform product that can be used immediately.", "text_plain": "CMBD 360/Multisource is a platform product that can be used immediately.", "correct": false}, {"id": "a1", "text": "ITOM Discovery needs to be purchased to take advantage of the multisource IRE Rules.", "text_plain": "ITOM Discovery needs to be purchased to take advantage of the multisource IRE Rules.", "correct": false}, {"id": "a2", "text": "The IRE reconciliation rules can use discovery sources regardless of CMDB 360 being enabled.", "text_plain": "The IRE reconciliation rules can use discovery sources regardless of CMDB 360 being enabled.", "correct": true}], "correct_count": 1, "correct_texts": ["The IRE reconciliation rules can use discovery sources regardless of CMDB 360 being enabled."], "explanation": "", "corrected": false}, {"num": 109, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>The following identification rule for a Cl class has been defined:</p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question/2026-02-02_17-06-36-2ed52e5ff72a2f73f9835bfe71e943da.png\"><p>Two new CI records are imported into the hardware class of the CMDB:</p><p>Cl1: The name of this Cl record matches the name of an existing Cl record in the CMDB.</p><p>CI2: The IP address of this Cl record matches the IP address of an existing Cl record in the CMDB.</p><p>Which is correct based on the identification rule and the imported Cl records?</p>", "question_plain": "The following identification rule for a Cl class has been defined:\nTwo new CI records are imported into the hardware class of the CMDB:Cl1: The name of this Cl record matches the name of an existing Cl record in the CMDB.CI2: The IP address of this Cl record matches the IP address of an existing Cl record in the CMDB.Which is correct based on the identification rule and the imported Cl records?", "answers": [{"id": "a0", "text": "Cl1 and CI2 both will be updated with matching records.", "text_plain": "Cl1 and CI2 both will be updated with matching records.", "correct": false}, {"id": "a1", "text": "Cl1 will be updated with matching record and CI2 will be inserted as new record.", "text_plain": "Cl1 will be updated with matching record and CI2 will be inserted as new record.", "correct": false}, {"id": "a2", "text": "CI1 will be inserted as new record and CI2 will be updated with matching record.", "text_plain": "CI1 will be inserted as new record and CI2 will be updated with matching record.", "correct": true}, {"id": "a3", "text": "Cl1 and CI2 both will be inserted as new records.", "text_plain": "Cl1 and CI2 both will be inserted as new records.", "correct": false}], "correct_count": 1, "correct_texts": ["CI1 will be inserted as new record and CI2 will be updated with matching record."], "explanation": "<p>In CMDB identification, a CI is matched and updated <strong>only if it satisfies the complete identification rule</strong> for that class. Identification rules typically rely on <strong>strong identifiers</strong> (such as IP address, serial number, or other unique attributes), not just a name.</p><ul><li><p><code><strong>CI1</strong></code>: Matching only on <strong>name</strong> is generally insufficient to meet an identification rule. As a result, the Identification and Reconciliation Engine (IRE) does not find a valid match, so <strong>CI1 is inserted as a new record</strong>.</p></li><li><p><code><strong>CI2</strong></code>: Matching on <strong>IP address</strong>, which is commonly part of identification rules for hardware CIs, satisfies the rule. Therefore, <strong>CI2 is matched to the existing CI and updated</strong>, not inserted.</p></li></ul><p>Hence, CI1 is inserted, and CI2 is updated.</p><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/class-hardware.html\"><strong>Hardware [cmdb_ci_hardware] class (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/c_IdentificationRules.html\"><strong>Identification rules (ServiceNow Docs)</strong></a></p>", "corrected": true}, {"num": 110, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Administrator wants to improve data quality related to the CSDM.</p><p>Which action should the Administrator take to meet this goal?</p>", "question_plain": "A CMDB Administrator wants to improve data quality related to the CSDM.Which action should the Administrator take to meet this goal?", "answers": [{"id": "a0", "text": "Use the CSDM Data Foundations Dashboard", "text_plain": "Use the CSDM Data Foundations Dashboard", "correct": true}, {"id": "a1", "text": "Use the default configured CMDB Health Dashboard", "text_plain": "Use the default configured CMDB Health Dashboard", "correct": false}, {"id": "a2", "text": "Start the ServiceNow Health Scan", "text_plain": "Start the ServiceNow Health Scan", "correct": false}], "correct_count": 1, "correct_texts": ["Use the CSDM Data Foundations Dashboard"], "explanation": "", "corrected": false}, {"num": 111, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Administrator seeks to understand the available tools for preventing, addressing, and remediating duplicate Cls.</p><p>Drag and drop the option to the correct description:</p><p>1. Certification Tasks</p><p>2. CMDB Health Dashboard</p><p>3. De-Duplication Tasks</p><p>4. De-Duplication Templates</p><p>5. Duplicate CI&nbsp;Remediator</p><p>A. Can be assigned to groups for resolving duplicate CIs</p><p>B. Offers insight into duplicate CIs within the CMDB</p><p>C. Offers a solution to resolve de-duplication tasks in bulk</p><p>D. Provides a wizard to resolve de-duplication tasks individually</p>", "question_plain": "A CMDB Administrator seeks to understand the available tools for preventing, addressing, and remediating duplicate Cls.Drag and drop the option to the correct description:1. Certification Tasks2. CMDB Health Dashboard3. De-Duplication Tasks4. De-Duplication Templates5. Duplicate CI RemediatorA. Can be assigned to groups for resolving duplicate CIsB. Offers insight into duplicate CIs within the CMDBC. Offers a solution to resolve de-duplication tasks in bulkD. Provides a wizard to resolve de-duplication tasks individually", "answers": [{"id": "a0", "text": "3-A, 2-B, 4-C, 5-D", "text_plain": "3-A, 2-B, 4-C, 5-D", "correct": false}, {"id": "a1", "text": "1-A, 2-B, 3-C, 4-D", "text_plain": "1-A, 2-B, 3-C, 4-D", "correct": false}, {"id": "a2", "text": "1-A, 4-B, 3-C, 2-D", "text_plain": "1-A, 4-B, 3-C, 2-D", "correct": false}, {"id": "a3", "text": "1-A, 2-B, 4-C, 5-D", "text_plain": "1-A, 2-B, 4-C, 5-D", "correct": true}, {"id": "a4", "text": "3-A, 5-B, 4-C, 2-D", "text_plain": "3-A, 5-B, 4-C, 2-D", "correct": false}, {"id": "a5", "text": "4-A, 2-B, 1-C, 3-D", "text_plain": "4-A, 2-B, 1-C, 3-D", "correct": false}], "correct_count": 1, "correct_texts": ["1-A, 2-B, 4-C, 5-D"], "explanation": "<p>1. <code><strong>Certification Tasks</strong></code><br>Certification tasks are governance-driven tasks created by Data Manager policies. They are <strong>assigned to users or groups</strong> to review, validate, or take action on CI data issues (including duplicates).</p><p><strong>2. </strong><code><strong>CMDB Health Dashboard</strong></code></p><p>This is your \"command center\" for data quality. Under the <strong>Correctness</strong> KPI, the dashboard displays the total count of duplicate CIs across your classes. It provides high-level visibility so you can see if your duplication issues are trending up or down.</p><p><strong>4. </strong><code><strong>De-Duplication Templates</strong></code></p><p>Available in the <strong>CMDB Workspace</strong>, templates allow you to define rules for how duplicates should be handled for a specific class (e.g., \"always keep the CI with the most recent discovery date\"). Once a template is created, you can run it to <strong>remediate hundreds of tasks at once</strong>, saving significant manual effort.</p><p><strong>5. </strong><code><strong>Duplicate CI Remediator</strong></code></p><p>This is a user-friendly <strong>wizard</strong> that guides an administrator through a 3-step process for a <strong>single task</strong>:</p><ol><li><p><strong>Select Main CI:</strong> Choose which record to keep.</p></li><li><p><strong>Merge Data:</strong> Decide which attributes and relationships to move from the duplicates to the main CI.</p></li><li><p><strong>Clean up:</strong> Choose whether to delete, deactivate, or simply mark the remaining records as \"duplicate.\"</p></li></ol><p>Reference:</p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/now-assist-for-configuration-management-database-cmdb/now-assist-cmdb-mng-dupe-cis-skill.html\"><strong>Let Now Assist help you to manage duplicate CIs (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/c_CertificationTasks.html\"><strong>Certification tasks (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/de-duplication-tasks.html\"><strong>Duplicate CIs remediation (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/manual-create-dedup-task.html\"><strong>Manually create a de-duplication task (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 112, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>According to the Common Service Data Model (CSDM), a server team is requesting a catalog item be created for infrastructure upgrade requests. Which role is involved in initiating the request and defining requirements?</p>", "question_plain": "According to the Common Service Data Model (CSDM), a server team is requesting a catalog item be created for infrastructure upgrade requests. Which role is involved in initiating the request and defining requirements?", "answers": [{"id": "a0", "text": "Enterprise Architect", "text_plain": "Enterprise Architect", "correct": false}, {"id": "a1", "text": "Application Service Owners", "text_plain": "Application Service Owners", "correct": false}, {"id": "a2", "text": "Technology Service Owners", "text_plain": "Technology Service Owners", "correct": true}], "correct_count": 1, "correct_texts": ["Technology Service Owners"], "explanation": "", "corrected": false}, {"num": 113, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A customer's CMDB is aligned to the CSDM Walk stage.</p><p>What benefit is provided by the CMDB?</p>", "question_plain": "A customer's CMDB is aligned to the CSDM Walk stage.What benefit is provided by the CMDB?", "answers": [{"id": "a0", "text": "Allows for additional stratification of Technical team's support structure along the lines of OLAs and commitments", "text_plain": "Allows for additional stratification of Technical team's support structure along the lines of OLAs and commitments", "correct": false}, {"id": "a1", "text": "Improves the implementation velocity of APM Foundation for future business application rationalization", "text_plain": "Improves the implementation velocity of APM Foundation for future business application rationalization", "correct": false}, {"id": "a2", "text": "Enables impact assessments for incident, problem, and change on Business Services", "text_plain": "Enables impact assessments for incident, problem, and change on Business Services", "correct": true}], "correct_count": 1, "correct_texts": ["Enables impact assessments for incident, problem, and change on Business Services"], "explanation": "", "corrected": false}, {"num": 114, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Administrator would like to minimize stale Cls in the CMDB.</p><p>Which CMDB Health Dashboard scorecard displays this information?</p>", "question_plain": "A CMDB Administrator would like to minimize stale Cls in the CMDB.Which CMDB Health Dashboard scorecard displays this information?", "answers": [{"id": "a0", "text": "Completeness", "text_plain": "Completeness", "correct": false}, {"id": "a1", "text": "Correctness", "text_plain": "Correctness", "correct": true}, {"id": "a2", "text": "Compliance", "text_plain": "Compliance", "correct": false}], "correct_count": 1, "correct_texts": ["Correctness"], "explanation": "", "corrected": false}, {"num": 115, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>The CMDB Configuration Management team has successfully developed a healthy and trusted CMDB. They have integrated discovered infrastructure data, accurately referenced non-discoverable data (such as change and support group information), and made the CMDB service-aware using Service Mapping.</p><p>Which field on a Incident form is automatically populated after a Cl is selected that references an appropriate support group?</p>", "question_plain": "The CMDB Configuration Management team has successfully developed a healthy and trusted CMDB. They have integrated discovered infrastructure data, accurately referenced non-discoverable data (such as change and support group information), and made the CMDB service-aware using Service Mapping.Which field on a Incident form is automatically populated after a Cl is selected that references an appropriate support group?", "answers": [{"id": "a0", "text": "Assignment Group", "text_plain": "Assignment Group", "correct": true}, {"id": "a1", "text": "Support Group", "text_plain": "Support Group", "correct": false}, {"id": "a2", "text": "Approval Group", "text_plain": "Approval Group", "correct": false}, {"id": "a3", "text": "Managed by Group", "text_plain": "Managed by Group", "correct": false}, {"id": "a4", "text": "Change Group", "text_plain": "Change Group", "correct": false}], "correct_count": 1, "correct_texts": ["Assignment Group"], "explanation": "", "corrected": false}, {"num": 116, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Administrator needs to identify which attributes have been created specifically for the Windows Server class. Which tab in the Attributes section is used?</p>", "question_plain": "A CMDB Administrator needs to identify which attributes have been created specifically for the Windows Server class. Which tab in the Attributes section is used?", "answers": [{"id": "a0", "text": "All", "text_plain": "All", "correct": false}, {"id": "a1", "text": "Child", "text_plain": "Child", "correct": false}, {"id": "a2", "text": "Added", "text_plain": "Added", "correct": true}, {"id": "a3", "text": "Derived", "text_plain": "Derived", "correct": false}], "correct_count": 1, "correct_texts": ["Added"], "explanation": "", "corrected": false}, {"num": 117, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Configuration Manager is reviewing the metrics on the CMDB Health Dashboard's Correctness Scorecard for the Server class which consists of a total of 60,000 servers in the CMDB.</p><ul><li><p>For the Duplicate metric, it shows Healthy Cls/Evaluated as 59,000/60,000.</p></li><li><p>For the Orphan metric, it shows Healthy Cls/Evaluated as 45,000/50,000.</p></li></ul><p>Which configuration explains the difference in the scope of Server Cls (60,000 vs. 50,000) evaluated between the two metrics?</p>", "question_plain": "A CMDB Configuration Manager is reviewing the metrics on the CMDB Health Dashboard's Correctness Scorecard for the Server class which consists of a total of 60,000 servers in the CMDB.For the Duplicate metric, it shows Healthy Cls/Evaluated as 59,000/60,000.For the Orphan metric, it shows Healthy Cls/Evaluated as 45,000/50,000.Which configuration explains the difference in the scope of Server Cls (60,000 vs. 50,000) evaluated between the two metrics?", "answers": [{"id": "a0", "text": "The Orphan metric has a CMDB Group configured for the Server class.", "text_plain": "The Orphan metric has a CMDB Group configured for the Server class.", "correct": false}, {"id": "a1", "text": "The Duplicate metric has a Health Inclusion rule configured for the Server class.", "text_plain": "The Duplicate metric has a Health Inclusion rule configured for the Server class.", "correct": false}, {"id": "a2", "text": "The Orphan metric has a Health Inclusion rule configured for the Server class.", "text_plain": "The Orphan metric has a Health Inclusion rule configured for the Server class.", "correct": true}, {"id": "a3", "text": "The Duplicate metric has a CMDB Group configured for the Server class.", "text_plain": "The Duplicate metric has a CMDB Group configured for the Server class.", "correct": false}], "correct_count": 1, "correct_texts": ["The Orphan metric has a Health Inclusion rule configured for the Server class."], "explanation": "", "corrected": false}, {"num": 118, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A healthcare provider faces a critical incident affecting its patient management system. The provider needs to determine the users impacted to mitigate disruption effectively.</p><p>Which CSDM-related data should they leverage?</p>", "question_plain": "A healthcare provider faces a critical incident affecting its patient management system. The provider needs to determine the users impacted to mitigate disruption effectively.Which CSDM-related data should they leverage?", "answers": [{"id": "a0", "text": "Service Offerings by Department or Location", "text_plain": "Service Offerings by Department or Location", "correct": true}, {"id": "a1", "text": "Affected CI [task_ci] related list", "text_plain": "Affected CI [task_ci] related list", "correct": false}, {"id": "a2", "text": "Application Service environment attribute", "text_plain": "Application Service environment attribute", "correct": false}, {"id": "a3", "text": "Incident history of similar Cls", "text_plain": "Incident history of similar Cls", "correct": false}], "correct_count": 1, "correct_texts": ["Service Offerings by Department or Location"], "explanation": "", "corrected": true}, {"num": 119, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Administrator wants to remove all Linux Servers in the organization that have not been updated in six months.</p><p>Which recommended action does the Administrator take in Data Manager?</p>", "question_plain": "A CMDB Administrator wants to remove all Linux Servers in the organization that have not been updated in six months.Which recommended action does the Administrator take in Data Manager?", "answers": [{"id": "a0", "text": "Create a business rule", "text_plain": "Create a business rule", "correct": false}, {"id": "a1", "text": "Create a scheduled job", "text_plain": "Create a scheduled job", "correct": false}, {"id": "a2", "text": "Create an archive policy", "text_plain": "Create an archive policy", "correct": true}], "correct_count": 1, "correct_texts": ["Create an archive policy"], "explanation": "", "corrected": false}, {"num": 120, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Administrator has installed a Service Graph Connector and customized a script transform.</p><p>What will happen on subsequent upgrades if the default definition of the script transform is updated?</p>", "question_plain": "A CMDB Administrator has installed a Service Graph Connector and customized a script transform.What will happen on subsequent upgrades if the default definition of the script transform is updated?", "answers": [{"id": "a0", "text": "The upgrade stops and reports an error.", "text_plain": "The upgrade stops and reports an error.", "correct": false}, {"id": "a1", "text": "A skipped change is created and no change is made to the script transform definition.", "text_plain": "A skipped change is created and no change is made to the script transform definition.", "correct": true}, {"id": "a2", "text": "The Service Graph Connector upgrade refuses to start.", "text_plain": "The Service Graph Connector upgrade refuses to start.", "correct": false}], "correct_count": 1, "correct_texts": ["A skipped change is created and no change is made to the script transform definition."], "explanation": "", "corrected": false}, {"num": 121, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>With CMDB 360/Multisource CMDB the Dynamic Reconciliation Rules will also be enabled. Based on the request of the management, a CMDB Administrator has to set up multiple Dynamic Reconciliation Rules.</p><p>Which are available 'Dynamic Rule Types' within the 'Create Reconciliation Rule' wizard? (Choose two)</p>", "question_plain": "With CMDB 360/Multisource CMDB the Dynamic Reconciliation Rules will also be enabled. Based on the request of the management, a CMDB Administrator has to set up multiple Dynamic Reconciliation Rules.Which are available 'Dynamic Rule Types' within the 'Create Reconciliation Rule' wizard? (Choose two)", "answers": [{"id": "a0", "text": "Most Reported", "text_plain": "Most Reported", "correct": true}, {"id": "a1", "text": "Last Created", "text_plain": "Last Created", "correct": false}, {"id": "a2", "text": "Last Updated", "text_plain": "Last Updated", "correct": true}, {"id": "a3", "text": "Smallest Value", "text_plain": "Smallest Value", "correct": false}], "correct_count": 2, "correct_texts": ["Most Reported", "Last Updated"], "explanation": "", "corrected": false}, {"num": 122, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>Configuration Management needs to ensure data quality for all Cls in the CMDB.</p><p>What areas of data quality for Cls are in the CMDB Health Dashboard? (Choose two)</p>", "question_plain": "Configuration Management needs to ensure data quality for all Cls in the CMDB.What areas of data quality for Cls are in the CMDB Health Dashboard? (Choose two)", "answers": [{"id": "a0", "text": "Downgraded Cls", "text_plain": "Downgraded Cls", "correct": false}, {"id": "a1", "text": "Duplicate Cls", "text_plain": "Duplicate Cls", "correct": true}, {"id": "a2", "text": "Missing Cls", "text_plain": "Missing Cls", "correct": false}, {"id": "a3", "text": "Stale Cls", "text_plain": "Stale Cls", "correct": true}, {"id": "a4", "text": "Upgraded Cls", "text_plain": "Upgraded Cls", "correct": false}], "correct_count": 2, "correct_texts": ["Duplicate Cls", "Stale Cls"], "explanation": "", "corrected": false}, {"num": 123, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A retail organization needs to ensure that incidents affecting customer-facing services are resolved quickly to reduce potential revenue loss. Which CSDM attribute is used to prioritize these services?</p>", "question_plain": "A retail organization needs to ensure that incidents affecting customer-facing services are resolved quickly to reduce potential revenue loss. Which CSDM attribute is used to prioritize these services?", "answers": [{"id": "a0", "text": "Assignment Group on the Cl record", "text_plain": "Assignment Group on the Cl record", "correct": false}, {"id": "a1", "text": "Affected Cls in the Incident record", "text_plain": "Affected Cls in the Incident record", "correct": false}, {"id": "a2", "text": "Service classification in the Technical Service", "text_plain": "Service classification in the Technical Service", "correct": false}, {"id": "a3", "text": "Business Criticality in the Service Offering", "text_plain": "Business Criticality in the Service Offering", "correct": true}], "correct_count": 1, "correct_texts": ["Business Criticality in the Service Offering"], "explanation": "", "corrected": false}, {"num": 124, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>An organization is changing data centers and needs to know the consequences of the planned changes. How can Application Service mapping be used as part of Change Management?</p>", "question_plain": "An organization is changing data centers and needs to know the consequences of the planned changes. How can Application Service mapping be used as part of Change Management?", "answers": [{"id": "a0", "text": "To understand the business impact of Cls", "text_plain": "To understand the business impact of Cls", "correct": true}, {"id": "a1", "text": "To understand the physical location of Cls", "text_plain": "To understand the physical location of Cls", "correct": false}, {"id": "a2", "text": "To identify which devices will go offline first", "text_plain": "To identify which devices will go offline first", "correct": false}], "correct_count": 1, "correct_texts": ["To understand the business impact of Cls"], "explanation": "", "corrected": false}, {"num": 125, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>A CMDB Administrator has built a number of Technology Management Service Offerings (Technical Service Offerings) based on Dynamic CI Groups to better maintain group alignment for the member Cl.</p><p>Which Groups are synced to Cls from the offering that has a relationship to a Dynamic Cl Group? (Choose two)</p>", "question_plain": "A CMDB Administrator has built a number of Technology Management Service Offerings (Technical Service Offerings) based on Dynamic CI Groups to better maintain group alignment for the member Cl.Which Groups are synced to Cls from the offering that has a relationship to a Dynamic Cl Group? (Choose two)", "answers": [{"id": "a0", "text": "Approval Group", "text_plain": "Approval Group", "correct": false}, {"id": "a1", "text": "Managed by Group", "text_plain": "Managed by Group", "correct": false}, {"id": "a2", "text": "Support Group", "text_plain": "Support Group", "correct": true}, {"id": "a3", "text": "Owned by Group", "text_plain": "Owned by Group", "correct": true}], "correct_count": 2, "correct_texts": ["Support Group", "Owned by Group"], "explanation": "", "corrected": false}, {"num": 126, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>A Configuration Management Process Owner is preparing solution options for presentation to the technical governance board for ingesting custom Cls to the CMDB. The solution needs to align with best practice, minimize the cost of future work (technical debt) and ensure compliance with future upgrades.</p><p>Which solutions accomplish this? (Choose two)</p>", "question_plain": "A Configuration Management Process Owner is preparing solution options for presentation to the technical governance board for ingesting custom Cls to the CMDB. The solution needs to align with best practice, minimize the cost of future work (technical debt) and ensure compliance with future upgrades.Which solutions accomplish this? (Choose two)", "answers": [{"id": "a0", "text": "Repurposing a base CI class and rename attributes, as required", "text_plain": "Repurposing a base CI class and rename attributes, as required", "correct": false}, {"id": "a1", "text": "Extending an existing Asset class table to accommodate the custom Cl class attributes", "text_plain": "Extending an existing Asset class table to accommodate the custom Cl class attributes", "correct": false}, {"id": "a2", "text": "Extending an existing Cl class table to accommodate the custom Cl class attributes", "text_plain": "Extending an existing Cl class table to accommodate the custom Cl class attributes", "correct": true}, {"id": "a3", "text": "Installing or upgrading the 'CMDB CI Class Models' store application to find a suitable existing Cl class accommodating any new attributes", "text_plain": "Installing or upgrading the 'CMDB CI Class Models' store application to find a suitable existing Cl class accommodating any new attributes", "correct": true}], "correct_count": 2, "correct_texts": ["Extending an existing Cl class table to accommodate the custom Cl class attributes", "Installing or upgrading the 'CMDB CI Class Models' store application to find a suitable existing Cl class accommodating any new attributes"], "explanation": "", "corrected": false}, {"num": 127, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Administrator wants only the Cls of Principal Classes to appear in Cl reference fields, for example the CI reference fields accessible from an Incident Form.</p><p>Where does the CMDB Administrator designate Principal Classes?</p>", "question_plain": "A CMDB Administrator wants only the Cls of Principal Classes to appear in Cl reference fields, for example the CI reference fields accessible from an Incident Form.Where does the CMDB Administrator designate Principal Classes?", "answers": [{"id": "a0", "text": "CMDB Data Manager", "text_plain": "CMDB Data Manager", "correct": false}, {"id": "a1", "text": "CI Class Manager", "text_plain": "CI Class Manager", "correct": true}, {"id": "a2", "text": "System Properties", "text_plain": "System Properties", "correct": false}, {"id": "a3", "text": "CMDB Workspace", "text_plain": "CMDB Workspace", "correct": false}], "correct_count": 1, "correct_texts": ["CI Class Manager"], "explanation": "", "corrected": false}, {"num": 128, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A new custom class is needed to reflect a new application being managed in the CMDB.</p><p>Which roles are minimally needed to add this custom Cl class?</p>", "question_plain": "A new custom class is needed to reflect a new application being managed in the CMDB.Which roles are minimally needed to add this custom Cl class?", "answers": [{"id": "a0", "text": "data_classification_admin and personalize_dictionary", "text_plain": "data_classification_admin and personalize_dictionary", "correct": false}, {"id": "a1", "text": "cmdb_inst_admin and personalize_form", "text_plain": "cmdb_inst_admin and personalize_form", "correct": false}, {"id": "a2", "text": "itil_admin and personalize_form", "text_plain": "itil_admin and personalize_form", "correct": false}, {"id": "a3", "text": "sn_cmdb_admin and personalize_dictionary", "text_plain": "sn_cmdb_admin and personalize_dictionary", "correct": true}], "correct_count": 1, "correct_texts": ["sn_cmdb_admin and personalize_dictionary"], "explanation": "", "corrected": false}, {"num": 129, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>User endpoint devices are imported into the CMDB and populate the 'Assigned to' [assigned_to] field on the Computer [cmdb_ci_computer] Cl. The Asset team puts in a request for the Configuration Analysts to populate the 'Assigned to' field on the related Asset.</p><p>What action does a Configuration Analyst take to achieve this in an automated way?</p>", "question_plain": "User endpoint devices are imported into the CMDB and populate the 'Assigned to' [assigned_to] field on the Computer [cmdb_ci_computer] Cl. The Asset team puts in a request for the Configuration Analysts to populate the 'Assigned to' field on the related Asset.What action does a Configuration Analyst take to achieve this in an automated way?", "answers": [{"id": "a0", "text": "Configure a business rule on the computer table to use a script to populate the 'Assigned to' field on the asset based on insert or update in the computer class 'Assigned to' field", "text_plain": "Configure a business rule on the computer table to use a script to populate the 'Assigned to' field on the asset based on insert or update in the computer class 'Assigned to' field", "correct": false}, {"id": "a1", "text": "Use the Asset-CI Field Mapping module to create a new rule to replicate the 'Assigned to' value between the asset and associated CI", "text_plain": "Use the Asset-CI Field Mapping module to create a new rule to replicate the 'Assigned to' value between the asset and associated CI", "correct": true}, {"id": "a2", "text": "Hide the 'Assigned to' field on the asset record and create a new field that dot walks to the related Cl to get the 'Assigned to' value", "text_plain": "Hide the 'Assigned to' field on the asset record and create a new field that dot walks to the related Cl to get the 'Assigned to' value", "correct": false}], "correct_count": 1, "correct_texts": ["Use the Asset-CI Field Mapping module to create a new rule to replicate the 'Assigned to' value between the asset and associated CI"], "explanation": "<p>ServiceNow provides a native, out-of-the-box synchronization engine designed specifically to keep <strong>Assets</strong> and <strong>Configuration Items (CIs)</strong> in sync. Since Assets (financial/contractual) and CIs (technical/operational) are often two sides of the same coin, data like \"Location,\" \"Department,\" and \"Assigned to\" should match on both records.</p><p>The <strong>Asset-CI Field Mapping</strong> module allows an analyst to:</p><ul><li><p>Define which field on the CI table should map to which field on the Asset table.</p></li><li><p>Control the direction of the sync (CI to Asset, Asset to CI, or Both).</p></li><li><p>Ensure that when a user is imported into the <code>cmdb_ci_computer</code> record, the platform automatically updates the corresponding <code>alm_asset</code> record without needing custom code.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/it-asset-management/hardware-asset-management/c_ManagingAssets.html\"><strong>Asset and CI management (ServiceNow Docs)</strong></a></p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_13-53-35-8693fc795613e3f0637739e70ad9a426.png\"></p>", "corrected": false}, {"num": 130, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>An organization is using CMDB Query Builder to find all application services with a database that has incidents and all infrastructure in those application services.</p><p>Which steps does the organization take to build this query? (Choose two)</p>", "question_plain": "An organization is using CMDB Query Builder to find all application services with a database that has incidents and all infrastructure in those application services.Which steps does the organization take to build this query? (Choose two)", "answers": [{"id": "a0", "text": "Add a non-CMDB table to the query", "text_plain": "Add a non-CMDB table to the query", "correct": false}, {"id": "a1", "text": "Use a Service Mapping Query to include non-CMDB tables like the Incident table", "text_plain": "Use a Service Mapping Query to include non-CMDB tables like the Incident table", "correct": true}, {"id": "a2", "text": "Use a Service Mapping Query to find all incidents related to the database", "text_plain": "Use a Service Mapping Query to find all incidents related to the database", "correct": false}, {"id": "a3", "text": "Use a CMDB Query to include application services and their related infrastructure", "text_plain": "Use a CMDB Query to include application services and their related infrastructure", "correct": true}], "correct_count": 2, "correct_texts": ["Use a CMDB Query to include application services and their related infrastructure", "Use a Service Mapping Query to include non-CMDB tables like the Incident table"], "explanation": "", "corrected": true}, {"num": 131, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>The CMDB Configuration Manager is using the CI Class Manager to manage the group ownership of CI classes and needs to leverage the ownership value specified in the CI Class Manager.</p><p>When configuring a CMDB Data Manager policy, which group reference field should be set?</p>", "question_plain": "The CMDB Configuration Manager is using the CI Class Manager to manage the group ownership of CI classes and needs to leverage the ownership value specified in the CI Class Manager.When configuring a CMDB Data Manager policy, which group reference field should be set?", "answers": [{"id": "a0", "text": "Managed By Group", "text_plain": "Managed By Group", "correct": true}, {"id": "a1", "text": "Approval Group", "text_plain": "Approval Group", "correct": false}, {"id": "a2", "text": "Support Group", "text_plain": "Support Group", "correct": false}, {"id": "a3", "text": "Change Group", "text_plain": "Change Group", "correct": false}], "correct_count": 1, "correct_texts": ["Managed By Group"], "explanation": "", "corrected": fal
