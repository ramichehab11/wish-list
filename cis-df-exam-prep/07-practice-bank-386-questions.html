  updateUI();
});

function updateResetButtonTooltip() {
  const btn = document.getElementById('btn-reset');
  const quiz = currentFilter.quiz;
  
  if (currentMode === 'review') {
    btn.title = quiz === 'all' ? 'Clear review-mode answers' : `Clear ${quiz} answers in review mode`;
  } else if (currentMode === 'flagged') {
    btn.title = quiz === 'all' ? 'Clear all flags' : `Clear ${quiz} flags`;
  } else {
    btn.title = quiz === 'all' ? 'Reset everything' : `Reset only ${quiz}`;
  }
}

document.querySelectorAll('[data-status]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-status]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter.status = btn.dataset.status;
    applyFilters();
  });
});

// Search
const searchInput = document.getElementById('search-input');
const searchWrap = document.getElementById('search-wrap');
const searchClear = document.getElementById('search-clear');

searchInput.addEventListener('input', (e) => {
  const val = e.target.value.trim();
  searchWrap.classList.toggle('has-value', val.length > 0);
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    currentSearch = val;
    applyFilters();
    updateUI();
  }, 200);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchWrap.classList.remove('has-value');
  currentSearch = '';
  applyFilters();
  updateUI();
  searchInput.focus();
});

// Raccourci Ctrl+K / Cmd+K pour focus search
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
  if (e.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.blur();
  }
});

document.getElementById('btn-stats').addEventListener('click', showStats);
document.getElementById('btn-submit-attempt').addEventListener('click', submitAttempt);

document.getElementById('btn-shuffle').addEventListener('click', () => {
  questionOrder = shuffle(QUESTIONS.map(q => q.num));
  applyFilters();
});

document.getElementById('btn-export-flagged').addEventListener('click', exportFlagged);

document.getElementById('btn-reset').addEventListener('click', () => {
  const quizSelected = currentFilter.quiz;
  
  // En mode révision, le bouton reset effectue le reset des réponses du mode révision
  if (currentMode === 'review') {
    const targets = QUESTIONS.filter(q => {
      if (!state.reviewPool[q.num]) return false;
      if (quizSelected !== 'all' && q.quiz !== quizSelected) return false;
      return !!state.reviewAnswers[q.num];
    });
    if (targets.length === 0) {
      alert('No review-mode answers to clear.');
      return;
    }
    const scope = quizSelected === 'all' ? 'all review-mode answers' : `the ${quizSelected} answers in review mode`;
    if (confirm(`Clear ${scope} (${targets.length} questions) to retake them?`)) {
      targets.forEach(q => { delete state.reviewAnswers[q.num]; });
      saveState();
      applyFilters();
      updateUI();
    }
    return;
  }
  
  // En mode signalées, reset les signalements du quiz courant
  if (currentMode === 'flagged') {
    const targets = QUESTIONS.filter(q => {
      if (!state.flagged[q.num]) return false;
      if (quizSelected !== 'all' && q.quiz !== quizSelected) return false;
      return true;
    });
    if (targets.length === 0) {
      alert('No flags to clear.');
      return;
    }
    const scope = quizSelected === 'all' ? 'all flags' : `the ${quizSelected} flags`;
    if (confirm(`Clear ${scope} (${targets.length} questions)?`)) {
      targets.forEach(q => { delete state.flagged[q.num]; });
      saveState();
      applyFilters();
      updateUI();
    }
    return;
  }
  
  // Mode "Toutes les questions"
  if (quizSelected === 'all') {
    if (confirm('Reset ALL answers, the review pool and flags? This cannot be undone.')) {
      state = { answers: {}, flagged: {}, reviewPool: {}, reviewAnswers: {} };
      saveState();
      applyFilters();
      updateUI();
    }
  } else {
    const questionsInQuiz = QUESTIONS.filter(q => q.quiz === quizSelected);
    if (confirm(`Reset only the ${questionsInQuiz.length} questions in ${quizSelected}?\nOther quizzes will not be affected.`)) {
      questionsInQuiz.forEach(q => {
        delete state.answers[q.num];
        delete state.flagged[q.num];
        delete state.reviewPool[q.num];
        delete state.reviewAnswers[q.num];
      });
      saveState();
      applyFilters();
      updateUI();
    }
  }
});

document.getElementById('stats-modal').addEventListener('click', (e) => {
  if (e.target.id === 'stats-modal') {
    e.target.classList.remove('open');
  }
});

// Scroll to top button + FAB quick actions
const scrollTopBtn = document.getElementById('scroll-top-btn');
const quickActionsFab = document.getElementById('quick-actions-fab');
const quickActionsPanel = document.getElementById('quick-actions-panel');
const quickActionsBackdrop = document.getElementById('quick-actions-backdrop');
let scrollTimer = null;
window.addEventListener('scroll', () => {
  if (scrollTimer) cancelAnimationFrame(scrollTimer);
  scrollTimer = requestAnimationFrame(() => {
    const scrolled = window.scrollY > 400;
    scrollTopBtn.classList.toggle('visible', scrolled);
    quickActionsFab.classList.toggle('visible', scrolled);
  });
});
scrollTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// === Panel quick actions : ouverture / fermeture ===
function openQuickActionsPanel() {
  quickActionsPanel.classList.add('open');
  quickActionsBackdrop.classList.add('open');
  quickActionsFab.classList.add('panel-open');
  // Sync les valeurs courantes depuis la toolbar du haut
  document.getElementById('qap-search-input').value = document.getElementById('search-input').value;
  document.getElementById('qap-filter-quiz').value = document.getElementById('filter-quiz').value;
  document.getElementById('qap-filter-type').value = document.getElementById('filter-type').value;
  // Sync le statut actif
  const activeStatus = document.querySelector('.toolbar .filter-pill.active[data-status]');
  document.querySelectorAll('.qap-status-pill').forEach(p => {
    p.classList.toggle('active', activeStatus && p.dataset.status === activeStatus.dataset.status);
  });
  // Sync les compteurs
  ['all', 'todo', 'correct', 'incorrect'].forEach(s => {
    const top = document.getElementById('ct-' + s);
    const qap = document.getElementById('qap-ct-' + s);
    if (top && qap) qap.textContent = top.textContent;
  });
}
function closeQuickActionsPanel() {
  quickActionsPanel.classList.remove('open');
  quickActionsBackdrop.classList.remove('open');
  quickActionsFab.classList.remove('panel-open');
}
quickActionsFab.addEventListener('click', () => {
  if (quickActionsPanel.classList.contains('open')) closeQuickActionsPanel();
  else openQuickActionsPanel();
});
document.getElementById('qap-close').addEventListener('click', closeQuickActionsPanel);
quickActionsBackdrop.addEventListener('click', closeQuickActionsPanel);

// === Sync panel → toolbar (le panel pilote la toolbar via change events) ===
document.getElementById('qap-search-input').addEventListener('input', (e) => {
  const topInput = document.getElementById('search-input');
  topInput.value = e.target.value;
  topInput.dispatchEvent(new Event('input', { bubbles: true }));
});
document.getElementById('qap-filter-quiz').addEventListener('change', (e) => {
  const top = document.getElementById('filter-quiz');
  top.value = e.target.value;
  top.dispatchEvent(new Event('change', { bubbles: true }));
});
document.getElementById('qap-filter-type').addEventListener('change', (e) => {
  const top = document.getElementById('filter-type');
  top.value = e.target.value;
  top.dispatchEvent(new Event('change', { bubbles: true }));
});
document.querySelectorAll('.qap-status-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    const status = btn.dataset.status;
    const topBtn = document.querySelector('.toolbar .filter-pill[data-status="' + status + '"]');
    if (topBtn) topBtn.click();
    document.querySelectorAll('.qap-status-pill').forEach(p => p.classList.toggle('active', p === btn));
  });
});

  closeQuickActionsPanel();

});
document.getElementById('qap-btn-stats').addEventListener('click', () => {
  closeQuickActionsPanel();
  document.getElementById('btn-stats').click();
});

  document.getElementById('btn-shuffle').click();
});
document.getElementById('qap-btn-export').addEventListener('click', () => {
  closeQuickActionsPanel();

});
