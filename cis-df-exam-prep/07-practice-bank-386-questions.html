n the CMDB Workspace) is the modern replacement for legacy Dependency Views and the traditional Service Mapping interface. It is designed to be highly interactive and customizable for the user viewing it.</p><ul><li><p><strong>B. Number of Levels (Depth Control):</strong> In the Unified Map, you have a specific control to adjust the depth of the relationships shown. You can set it to show only 1 level (direct neighbors) or expand it significantly (up to 25 levels) to see far-reaching dependencies. Traditional Service Maps are often restricted to the specific components defined within the service boundary.</p></li><li><p><strong>C. Filtering and User Preferences:</strong> The Unified Map allows users to apply \"Layer Filters.\" These filters can be saved as <strong>User Presets</strong>, allowing different stakeholders to see the same map differently based on their specific needs.</p></li></ul><p>Reference:</p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/unified-map/cmdb-workspace-unified-map.html\"><strong>Unified Map (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/unified-map-manage-preset-filter.html\"><strong>Manage filter presets (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 24, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>Which default user groups are available when setting up a CMDB Data Manager policy and specifying the task assignment with the Assignment type set to 'User Group Field'? (Choose two)</p>", "question_plain": "Which default user groups are available when setting up a CMDB Data Manager policy and specifying the task assignment with the Assignment type set to 'User Group Field'? (Choose two)", "answers": [{"id": "a0", "text": "Managed By Group", "text_plain": "Managed By Group", "correct": true}, {"id": "a1", "text": "Support Group", "text_plain": "Support Group", "correct": true}, {"id": "a2", "text": "Assignment Group", "text_plain": "Assignment Group", "correct": false}, {"id": "a3", "text": "Owned by Group", "text_plain": "Owned by Group", "correct": false}], "correct_count": 2, "correct_texts": ["Managed By Group", "Support Group"], "explanation": "<p>When you use the <strong>CMDB Data Manager</strong> to automate lifecycle tasks (like Attestation, Archiving, or Deletion), the system needs to know which group should receive the resulting <strong>Data Management Task</strong>.</p><p>By setting the <strong>Assignment type</strong> to <strong>User Group Field</strong>, the Data Manager dynamically looks at the CI being processed and assigns the task based on the groups defined in specific fields on that CI record. The two default, out-of-the-box fields available for this dynamic assignment are:</p><ul><li><p><code><strong>Managed By Group</strong></code><strong>:</strong> This is the primary field recommended by the Common Service Data Model (CSDM) for managing the \"technical\" ownership and lifecycle of a CI.</p></li><li><p><code><strong>Support Group</strong></code><strong>:</strong> This is the group responsible for the day-to-day maintenance and troubleshooting of the CI.</p></li></ul><p>Reference: <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/create-data-manager-policy.html\" target=\"_blank\" rel=\"noopener\">Create a CMDB Data Manager policy (ServiceNow Docs)</a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-29_18-01-47-11d97d5dc68fdf9cd003da45de2358a2.png\">\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-29_18-01-47-0982f6dff3b016a7f129c7cc3369e3b0.png\">", "corrected": false}, {"num": 25, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator aims to utilize CSDM life cycle field mappings to better align with CSDM best practices.</p><p>What is the next step to take after selecting the Enable Life Cycle Sync button?</p>", "question_plain": "A CMDB Administrator aims to utilize CSDM life cycle field mappings to better align with CSDM best practices.What is the next step to take after selecting the Enable Life Cycle Sync button?", "answers": [{"id": "a0", "text": "Fix the incorrect values in the Life Cycle Stage to match legacy values", "text_plain": "Fix the incorrect values in the Life Cycle Stage to match legacy values", "correct": false}, {"id": "a1", "text": "Activate the CSDM Life Cycle field mappings", "text_plain": "Activate the CSDM Life Cycle field mappings", "correct": false}, {"id": "a2", "text": "Resolve any incomplete field mappings identified in the Discrepancy Report", "text_plain": "Resolve any incomplete field mappings identified in the Discrepancy Report", "correct": true}], "correct_count": 1, "correct_texts": ["Resolve any incomplete field mappings identified in the Discrepancy Report"], "explanation": "<p>When a CMDB Administrator initiates the transition to the CSDM Life Cycle standard, simply clicking \"Enable Life Cycle Sync\" is not enough. The system must ensure that the existing data can move into the new structure without loss of meaning.</p><ol><li><p><strong>The Sync Engine:</strong> Once the sync is enabled, ServiceNow compares your current legacy status values (like <code>install_status</code>) with the CSDM standard values.</p></li><li><p><strong>The Discrepancy Report:</strong> The platform automatically generates a <strong>Discrepancy Report</strong>. This report highlights any legacy values that do not have a clear \"destination\" in the Life Cycle Stage or Status fields.</p></li><li><p><strong>The Action:</strong> The Administrator must review these discrepancies and manually map any custom or ambiguous legacy values to the appropriate CSDM Life Cycle Stage. If these are not resolved, the data synchronization will fail or lead to inconsistent records.</p></li></ol><p>Reference: <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/common-service-data-model-csdm/csdm-life-cycle-standard-values.html\" target=\"_blank\" rel=\"noopener\">Enabling life-cycle sync from legacy-to-asset (ServiceNow Docs)</a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-29_18-08-59-139ad4cbb7c0b1746d58ee1771687729.png\">", "corrected": false}, {"num": 26, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>The Configuration Management team finds value in the reports from CMDB 360/Multisource CMDB and wants to use it for all Cl data.</p><p>Which must be true in order for CMDB 360/Multisource CMDB to be able to report on and analyze that data?</p>", "question_plain": "The Configuration Management team finds value in the reports from CMDB 360/Multisource CMDB and wants to use it for all Cl data.Which must be true in order for CMDB 360/Multisource CMDB to be able to report on and analyze that data?", "answers": [{"id": "a0", "text": "ServiceNow Discovery must be used to populate the Cl data.", "text_plain": "ServiceNow Discovery must be used to populate the Cl data.", "correct": false}, {"id": "a1", "text": "Reconciliation rules with priorities must be configured.", "text_plain": "Reconciliation rules with priorities must be configured.", "correct": false}, {"id": "a2", "text": "The CI data must go through the IRE.", "text_plain": "The CI data must go through the IRE.", "correct": true}, {"id": "a3", "text": "The Cl data must be from an authorized Service Graph Connector.", "text_plain": "The Cl data must be from an authorized Service Graph Connector.", "correct": false}], "correct_count": 1, "correct_texts": ["The CI data must go through the IRE."], "explanation": "<p><strong>CMDB 360</strong> (formerly known as Multisource CMDB) relies entirely on data stored in the <strong>Multisource Data </strong><code><strong>[cmdb_multisource_data]</strong></code> table. This table acts as a secondary \"staging\" area that tracks what <em>every</em> data source said about a CI, even if that data didn't \"win\" the reconciliation to be placed on the actual CI record.</p><p>The critical requirement for this table to be populated is the <strong>Identification and Reconciliation Engine (IRE)</strong>:</p><ul><li><p><strong>The Trigger:</strong> Multisource data is only captured when a CI payload is processed through the IRE (via the <code>createOrUpdateCi</code> API).</p></li><li><p><strong>The Function:</strong> When the IRE receives data, it simultaneously updates the main CMDB and writes the source-specific details to the Multisource table.</p></li><li><p><strong>The Gap:</strong> If you import data using a standard Transform Map (bypassing the IRE) or a manual script that writes directly to <code>cmdb_ci</code>, the Multisource table remains empty. Without that raw source data, CMDB 360 cannot perform comparisons, identify gaps, or show you which source provided which attribute.</p></li></ul><p>Reference: <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/multisource-cmdb.html\" target=\"_blank\" rel=\"noopener\">CMDB 360/Multisource CMDB (ServiceNow Docs)</a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-29_18-12-10-fc917dc410e6f1ec3a541e4062665bc1.png\">", "corrected": false}, {"num": 27, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator wants to ensure that only relevant Cls from managed classes will be shown on Incident, Problem, and Change records.</p><p>Which checkbox needs to be checked in the CI Class Manager for the CMDB Administrator to achieve the requested result?</p>", "question_plain": "A CMDB Administrator wants to ensure that only relevant Cls from managed classes will be shown on Incident, Problem, and Change records.Which checkbox needs to be checked in the CI Class Manager for the CMDB Administrator to achieve the requested result?", "answers": [{"id": "a0", "text": "Principal Class", "text_plain": "Principal Class", "correct": true}, {"id": "a1", "text": "Independent", "text_plain": "Independent", "correct": false}, {"id": "a2", "text": "Extensible", "text_plain": "Extensible", "correct": false}, {"id": "a3", "text": "Main Record", "text_plain": "Main Record", "correct": false}], "correct_count": 1, "correct_texts": ["Principal Class"], "explanation": "<p>To prevent users from being overwhelmed by thousands of low-level CIs (like network interfaces, disks, or fans) when filling out a task, ServiceNow uses the <code><strong>Principal Class</strong></code> filter.</p><ul><li><p><strong>Function:</strong> When a class is marked as a \"Principal Class,\" it tells the system that this class is a primary focus for IT Service Management processes (Incident, Problem, and Change).</p></li><li><p><strong>The Filter:</strong> Reference fields for Configuration Items on these task forms use a standard <strong>Reference Qualifier</strong> that typically filters the list to only show CIs belonging to these \"Principal\" classes.</p></li><li><p><strong>Where to find it:</strong> You enable this by navigating to the <strong>CI Class Manager</strong>, selecting the specific class, and checking the <strong>Principal Class</strong> box under the <strong>Basic Info</strong> section.</p></li></ul><p>Reference: <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/update-principal-class-filter.html\" target=\"_blank\" rel=\"noopener\">Update class list in the Principal Class filter (ServiceNow Docs)</a></p>", "corrected": false}, {"num": 28, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>Where can an administrator perform Natural Language Queries (NLQ)?</p>", "question_plain": "Where can an administrator perform Natural Language Queries (NLQ)?", "answers": [{"id": "a0", "text": "CMDB Health Dashboard", "text_plain": "CMDB Health Dashboard", "correct": false}, {"id": "a1", "text": "CMDB Workspace", "text_plain": "CMDB Workspace", "correct": true}, {"id": "a2", "text": "CMDB Data Manager", "text_plain": "CMDB Data Manager", "correct": false}, {"id": "a3", "text": "CI Class Manager", "text_plain": "CI Class Manager", "correct": false}], "correct_count": 1, "correct_texts": ["CMDB Workspace"], "explanation": "<p>ServiceNow introduced <strong>Natural Language Query (NLQ)</strong> capabilities within the <strong>CMDB Workspace</strong> to allow administrators and managers to search for CI data using plain English instead of complex encoded queries or scripts.</p><ul><li><p><strong>How it works:</strong> In the CMDB Workspace, there is a search interface where you can type phrases like <em>\"show me Linux servers in London\"</em> or <em>\"retired databases updated this month.\"</em> * <strong>The Engine:</strong> The system uses NLQ to parse the intent, identify the correct tables and fields, and instantly generate the corresponding list of CIs</p></li><li><p><strong>The Benefit:</strong> This lowers the barrier to entry for non-technical stakeholders who need to pull quick reports or verify data without knowing the underlying CMDB schema.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/intelligent-experiences/natural-language-query/explore-natural-language-query.html\"><strong>Exploring Natural Language Query (ServiceNow Docs)</strong></a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-29_18-21-56-8cecfe68db186fcee2b17a2886859379.png\">", "corrected": false}, {"num": 29, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A Windows server is reclassified from the Server table [cmdb_ci_server] to the Windows Server table [cmdb_ci_win_server] when processed through the Identification and Reconciliation Engine (IRE).</p><p>Which process occurred?</p>", "question_plain": "A Windows server is reclassified from the Server table [cmdb_ci_server] to the Windows Server table [cmdb_ci_win_server] when processed through the Identification and Reconciliation Engine (IRE).Which process occurred?", "answers": [{"id": "a0", "text": "Class Switch", "text_plain": "Class Switch", "correct": false}, {"id": "a1", "text": "Class Change", "text_plain": "Class Change", "correct": false}, {"id": "a2", "text": "Class Upgrade", "text_plain": "Class Upgrade", "correct": true}, {"id": "a3", "text": "Class Downgrade", "text_plain": "Class Downgrade", "correct": false}], "correct_count": 1, "correct_texts": ["Class Upgrade"], "explanation": "<p>In the ServiceNow CMDB, reclassification occurs whenever the <strong>Identification and Reconciliation Engine (IRE)</strong> determines that a CI belongs in a different class than its current one. These movements are categorized based on the CI's position in the table hierarchy:</p><ul><li><p><code><strong>Class Upgrade</strong></code><strong>:</strong> This occurs when a CI moves from a <strong>generic parent table</strong> to a <strong>more specific child table</strong>.</p><ul><li><p>In your example, the CI is moving from <strong>Server</strong> (Parent) to <strong>Windows Server</strong> (Child). Because <strong>Windows Server</strong> is more specialized and inherits from the <strong>Server</strong> table, it is considered an upgrade.</p></li></ul></li></ul><p>Reference:</p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/c_CIReclassification.html\"><strong>Configure CI reclassification during IRE processing (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/community/cmdb-articles/understanding-ci-reclassification-what-you-need-to-know/ta-p/3001253\"><strong>Understanding CI Reclassification: What You Need to Know</strong></a></p>", "corrected": false}, {"num": 30, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>How do CMDB management tools and features within the CMDB governance pillar help organizations manage Cls and improve service delivery? (Choose two)</p>", "question_plain": "How do CMDB management tools and features within the CMDB governance pillar help organizations manage Cls and improve service delivery? (Choose two)", "answers": [{"id": "a0", "text": "Assist integration choices", "text_plain": "Assist integration choices", "correct": false}, {"id": "a1", "text": "Gain visibility and control", "text_plain": "Gain visibility and control", "correct": true}, {"id": "a2", "text": "Enhanced Service Management operations", "text_plain": "Enhanced Service Management operations", "correct": true}, {"id": "a3", "text": "Reduced hardware costs", "text_plain": "Reduced hardware costs", "correct": false}], "correct_count": 2, "correct_texts": ["Gain visibility and control", "Enhanced Service Management operations"], "explanation": "<p>The <strong>CMDB Governance Pillar</strong> is designed to move a CMDB from a \"passive list of assets\" to an \"active engine for IT decisions.\" Here is how these two benefits manifest:</p><p><code><strong>B. Gain Visibility and Control</strong></code></p><p>Governance tools like the <strong>CMDB Health Dashboard</strong>, <strong>CMDB 360 (Multisource)</strong>, and <strong>CI Class Manager</strong> provide a \"Single Source of Truth.\"</p><ul><li><p><strong>Visibility:</strong> Tools like <strong>Unified Map</strong> show exactly how infrastructure supports services.</p></li><li><p><strong>Control:</strong> The <strong>IRE (Identification and Reconciliation Engine)</strong> acts as a gatekeeper, preventing duplicate CIs and ensuring only authorized data sources can update critical attributes.</p></li></ul><p><code><strong>C. Enhanced Service Management Operations</strong></code></p><p>A well-governed CMDB is the foundation for all ITIL processes (Incident, Problem, Change).</p><ul><li><p><strong>Incident/Problem:</strong> Accurate relationships allow for rapid <strong>Root Cause Analysis</strong> by showing which components are failing.</p></li><li><p><strong>Change:</strong> Use <strong>Conflict Detection</strong> to see if a planned change will crash a dependent business service, significantly reducing failed changes and outages.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/now-assist-for-configuration-management-database-cmdb/na-cmdb-awf-governance.html?contentId=dnH31zAIoNQn6cw_gqebpw\"><strong>Getting advice from Now Assist on CMDB governance (ServiceNow Docs)</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/community/s/cgfwn76974/attachments/cgfwn76974/cmdb-events/3/3/2.%20MM%20DF%20-%20Data%20Governance,%20Resources.pdf\"><strong>Data Foundations –Data Governance (ServiceNow Documentation PDF)</strong></a></p>", "corrected": false}, {"num": 31, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>A Configuration Manager wants to manage manually maintained data attributes of Cls.</p><p>Which group values are automatically synchronized on Cls using Technology Management Offerings (Technical Service Offerings) and dynamic Cl groups? (Choose two) </p>", "question_plain": "A Configuration Manager wants to manage manually maintained data attributes of Cls.Which group values are automatically synchronized on Cls using Technology Management Offerings (Technical Service Offerings) and dynamic Cl groups? (Choose two)", "answers": [{"id": "a0", "text": "Change group", "text_plain": "Change group", "correct": true}, {"id": "a1", "text": "CMDB group", "text_plain": "CMDB group", "correct": false}, {"id": "a2", "text": "Approval group", "text_plain": "Approval group", "correct": false}, {"id": "a3", "text": "Support group", "text_plain": "Support group", "correct": true}], "correct_count": 2, "correct_texts": ["Change group", "Support group"], "explanation": "<p>Within the <strong>Common Service Data Model (CSDM)</strong>, the <strong>Technical Service Offering</strong> acts as the \"management layer\" for its related CIs. When you link a <strong>Dynamic CI Group</strong> (which is a group of CIs defined by a filter) to a Technical Service Offering, ServiceNow can automatically push critical management attributes down to all CIs in that group.</p><ul><li><p><strong>A. Change group:</strong> This field on the CI identifies which team must be notified or provide technical review for changes.</p></li><li><p><strong>D. Support group:</strong> This field identifies the \"L2/L3\" team responsible for troubleshooting the CI.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/common-service-data-model-csdm/csdm-dynamic-ci-groups-by-service.html\"><strong>Matching the usage of dynamic CI groups to service type (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 32, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CSDM Data Manager needs metrics on the alignment of Technology Management Services (Technical Services) and Technology Management Offerings (Technical Service Offerings) with best practices.</p><p>Which tab in the CSDM Data Foundation Dashboard provides this information?</p>", "question_plain": "A CSDM Data Manager needs metrics on the alignment of Technology Management Services (Technical Services) and Technology Management Offerings (Technical Service Offerings) with best practices.Which tab in the CSDM Data Foundation Dashboard provides this information?", "answers": [{"id": "a0", "text": "Crawl", "text_plain": "Crawl", "correct": false}, {"id": "a1", "text": "Walk", "text_plain": "Walk", "correct": true}, {"id": "a2", "text": "Fly", "text_plain": "Fly", "correct": false}, {"id": "a3", "text": "Run", "text_plain": "Run", "correct": false}], "correct_count": 1, "correct_texts": ["Walk"], "explanation": "<p>The <strong>CSDM Data Foundation Dashboard</strong> is organized into tabs that align with the ServiceNow <strong>\"Crawl, Walk, Run, Fly\"</strong> implementation framework. Each tab focuses on the maturity level of your CSDM data.</p><ul><li><p><code><strong>The Walk Stage</strong></code><strong>:</strong> This phase is specifically focused on the <strong>Technical Service</strong> layer of the CSDM. Once you have your basic CIs (Crawl), the \"Walk\" phase requires you to define how those CIs are managed via <strong>Technical Service Offerings</strong>.</p></li><li><p><code><strong>Metrics Provided</strong></code><strong>:</strong> The Walk tab contains reports that check if your <strong>Technical Service Offerings</strong> have been properly related to <strong>Dynamic CI Groups</strong> or <strong>Application Services</strong>, and if critical fields (like Support Group or Managed by Group) are populated.</p></li></ul><p>Reference:</p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/csdm-data-foundations-dashboard.html?contentId=ebhangbkjyTTZHN4EWrNKg\" target=\"_blank\" rel=\"noopener\">CSDM Data Foundations dashboard(ServiceNow Docs)</a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/common-service-data-model-csdm/csdm-datafdn-dash-walk-tab.html\" target=\"_blank\" rel=\"noopener\">'Walk' stage reports on the CSDM Data Foundations dashboard (ServiceNow Docs)</a>.</p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-29_19-02-51-c849359c5d2ecdb5d630bc4cb705ffea.png\">\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-29_19-02-51-aaf3d12b5b0ccfcdc91b49d26c50edc4.png\">", "corrected": false}, {"num": 33, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator is tasked with managing the CMDB and needs to define a new Cl class to track a new type of equipment that has not been seen before.</p><p>Which action adds a new CI class and ensures it integrates properly with the existing CMDB structure?</p>", "question_plain": "A CMDB Administrator is tasked with managing the CMDB and needs to define a new Cl class to track a new type of equipment that has not been seen before.Which action adds a new CI class and ensures it integrates properly with the existing CMDB structure?", "answers": [{"id": "a0", "text": "Use Service Catalog to define the new Cl class, as the CI Class Manager is only for service-related records and not for hardware Cls", "text_plain": "Use Service Catalog to define the new Cl class, as the CI Class Manager is only for service-related records and not for hardware Cls", "correct": false}, {"id": "a1", "text": "Create a new Cl class directly in the CI Class Manager and configure the table inheritance to ensure it inherits from a relevant parent class", "text_plain": "Create a new Cl class directly in the CI Class Manager and configure the table inheritance to ensure it inherits from a relevant parent class", "correct": true}, {"id": "a2", "text": "Edit an existing CI class under CI Class Manager and add new fields specific to the new equipment type", "text_plain": "Edit an existing CI class under CI Class Manager and add new fields specific to the new equipment type", "correct": false}, {"id": "a3", "text": "Use the CI Class Manager to create a new Cl class but avoid setting up any inheritance, as Cl classes should be independent of one another to maintain clarity", "text_plain": "Use the CI Class Manager to create a new Cl class but avoid setting up any inheritance, as Cl classes should be independent of one another to maintain clarity", "correct": false}], "correct_count": 1, "correct_texts": ["Create a new Cl class directly in the CI Class Manager and configure the table inheritance to ensure it inherits from a relevant parent class"], "explanation": "<p>The <strong>CI Class Manager</strong> is the centralized hub for all CMDB structural changes. To ensure the new equipment integrates properly, you must follow the principle of <strong>Inheritance</strong>.</p><ul><li><p><strong>Centralized Management:</strong> The CI Class Manager is the only tool that allows you to manage the entire lifecycle of a class from its table definition and identification rules to its health KPIs.</p></li><li><p><strong>Table Inheritance:</strong> By selecting a relevant parent (e.g., inheriting from <strong>Hardware </strong><code><strong>[cmdb_ci_hardware]</strong></code> or <strong>IoT </strong><code><strong>[cmdb_ci_iot]</strong></code>), the new class automatically gains all the standard fields (like Serial Number, Asset Tag, and Install Status) and identification rules of that parent. This maintains a clean, logical hierarchy and ensures global reports still \"see\" the new equipment as part of the broader infrastructure.</p></li></ul><p><strong>Reference: (ServiceNow Docs)</strong></p>", "corrected": false}, {"num": 34, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>What are the characteristics or functions of ServiceNow IntegrationHub ETL? (Choose two) </p>", "question_plain": "What are the characteristics or functions of ServiceNow IntegrationHub ETL? (Choose two)", "answers": [{"id": "a0", "text": "Integrates third-party data into the CMDB or into non-CMDB tables", "text_plain": "Integrates third-party data into the CMDB or into non-CMDB tables", "correct": true}, {"id": "a1", "text": "Performs discovery data collection and updates the CMDB", "text_plain": "Performs discovery data collection and updates the CMDB", "correct": false}, {"id": "a2", "text": "Uses the IRE to process and integrate data", "text_plain": "Uses the IRE to process and integrate data", "correct": true}, {"id": "a3", "text": "Imports Microsoft SCCM/Intune data into the CMDB", "text_plain": "Imports Microsoft SCCM/Intune data into the CMDB", "correct": false}], "correct_count": 2, "correct_texts": ["Integrates third-party data into the CMDB or into non-CMDB tables", "Uses the IRE to process and integrate data"], "explanation": "", "corrected": false}, {"num": 35, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator needs to ingest relevant data from Microsoft SCCM into the CMDB.</p><p>Which ingestion method brings the fastest time to value?</p>", "question_plain": "A CMDB Administrator needs to ingest relevant data from Microsoft SCCM into the CMDB.Which ingestion method brings the fastest time to value?", "answers": [{"id": "a0", "text": "Import Sets", "text_plain": "Import Sets", "correct": false}, {"id": "a1", "text": "Agent Client Collector", "text_plain": "Agent Client Collector", "correct": false}, {"id": "a2", "text": "Service Graph Connectors", "text_plain": "Service Graph Connectors", "correct": true}, {"id": "a3", "text": "IntegrationHub ETL", "text_plain": "IntegrationHub ETL", "correct": false}], "correct_count": 1, "correct_texts": ["Service Graph Connectors"], "explanation": "", "corrected": false}, {"num": 36, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator would like to minimize stale Cls in the CMDB.</p><p>Which CMDB Health Dashboard scorecard displays this information?</p>", "question_plain": "A CMDB Administrator would like to minimize stale Cls in the CMDB.Which CMDB Health Dashboard scorecard displays this information?", "answers": [{"id": "a0", "text": "Completeness", "text_plain": "Completeness", "correct": false}, {"id": "a1", "text": "Correctness", "text_plain": "Correctness", "correct": true}, {"id": "a2", "text": "Compliance", "text_plain": "Compliance", "correct": false}], "correct_count": 1, "correct_texts": ["Correctness"], "explanation": "", "corrected": false}, {"num": 37, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>A CMDB Administrator utilizing the CMDB Data Foundations Dashboard sees an issue and wants to run a playbook. Which types of documentation can they expect to be provided in a playbook? (Choose two)</p>", "question_plain": "A CMDB Administrator utilizing the CMDB Data Foundations Dashboard sees an issue and wants to run a playbook. Which types of documentation can they expect to be provided in a playbook? (Choose two)", "answers": [{"id": "a0", "text": "Problem Analysis", "text_plain": "Problem Analysis", "correct": true}, {"id": "a1", "text": "Root Cause", "text_plain": "Root Cause", "correct": false}, {"id": "a2", "text": "Problem Overview", "text_plain": "Problem Overview", "correct": true}, {"id": "a3", "text": "Automated Remediations", "text_plain": "Automated Remediations", "correct": false}], "correct_count": 2, "correct_texts": ["Problem Analysis", "Problem Overview"], "explanation": "", "corrected": false}, {"num": 38, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator knows that the CMDB Data Foundation Dashboard is a resource to monitor and improve data quality. What is a benefit of this dashboard?</p>", "question_plain": "A CMDB Administrator knows that the CMDB Data Foundation Dashboard is a resource to monitor and improve data quality. What is a benefit of this dashboard?", "answers": [{"id": "a0", "text": "Provides the ability to configure health-related metrics", "text_plain": "Provides the ability to configure health-related metrics", "correct": false}, {"id": "a1", "text": "Provides key health-related metrics to make decisions", "text_plain": "Provides key health-related metrics to make decisions", "correct": true}, {"id": "a2", "text": "Provides the ability to resolve certification policy tasks", "text_plain": "Provides the ability to resolve certification policy tasks", "correct": false}], "correct_count": 1, "correct_texts": ["Provides key health-related metrics to make decisions"], "explanation": "", "corrected": false}, {"num": 39, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>The CMDB Administrator has set-up two Dynamic Reconciliation Rules within the ServiceNow Production Instance. The 'Server' class has a Dynamic Reconciliation Rule of largest value for the RAM field. The Windows Server' class has a Dynamic Reconciliation Rule of most reported for the RAM field.</p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question/2026-02-05_15-31-47-049ea3777a4a421f63f19353a5689fca.png\"><p>Given the above data in the Multisource CMDB, which value would be added to the CMDB for RAM for a 'Server' CI?</p>", "question_plain": "The CMDB Administrator has set-up two Dynamic Reconciliation Rules within the ServiceNow Production Instance. The 'Server' class has a Dynamic Reconciliation Rule of largest value for the RAM field. The Windows Server' class has a Dynamic Reconciliation Rule of most reported for the RAM field.\nGiven the above data in the Multisource CMDB, which value would be added to the CMDB for RAM for a 'Server' CI?", "answers": [{"id": "a0", "text": "2.048 MB", "text_plain": "2.048 MB", "correct": false}, {"id": "a1", "text": "4.096 MB", "text_plain": "4.096 MB", "correct": false}, {"id": "a2", "text": "8.192 MB", "text_plain": "8.192 MB", "correct": true}], "correct_count": 1, "correct_texts": ["8.192 MB"], "explanation": "<p>Dynamic Reconciliation Rules (part of Multisource CMDB or CMDB 360) allow the system to choose a field value based on the data provided by all discovery sources, rather than just relying on a fixed priority list.</p><p>In this scenario, the rule for the <strong>Server</strong> class is set to <strong>\"Largest Value.\"</strong> When the IRE processes the data for a CI identified at the Server level, it evaluates all available inputs in the Multisource data:</p><ul><li><p>Tivoli: 4,096 MB</p></li><li><p>ServiceNow: 4,096 MB</p></li><li><p>LAN Desk: 2,048 MB</p></li><li><p><strong>Altiris: 8,192 MB</strong></p></li></ul><p>Since 8,192 is the highest numerical value among all reporting sources, the system selects this value to populate the RAM field in the CMDB.</p><p><code><strong>The Role of Class Hierarchy</strong></code></p><p>It is important to note that even though there is a \"Most Reported\" rule for the <strong>Windows Server</strong> class, it does not apply here.</p><ul><li><p><strong>The Question specifies a 'Server' CI:</strong> The IRE looks for the rule tied to the specific class of the CI. If the CI is classified as a generic Server (cmdb_ci_server), it uses the <strong>Largest Value</strong> logic.</p></li><li><p><strong>Inheritance:</strong> In ServiceNow, child classes (like Windows Server) can have different rules than parent classes. The \"Most Reported\" logic (which would have resulted in 4,096 MB) only triggers if the CI is specifically identified as a Windows Server.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/r_ReconciliationRulesPrinciples.html\"><strong>Reconciliation rules (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/ire.html\"><strong>Identification and Reconciliation engine (IRE) (ServiceNow Docs)</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/multisource-cmdb.html\"><strong>CMDB 360/Multisource CMDB (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 40, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Manager uses CMDB 360/Multisource CMDB to maintain and improve CMDB quality. Why would the Manager use CMDB 360/Multisource CMDB?</p>", "question_plain": "A CMDB Manager uses CMDB 360/Multisource CMDB to maintain and improve CMDB quality. Why would the Manager use CMDB 360/Multisource CMDB?", "answers": [{"id": "a0", "text": "To identify Cl attributes from multiple data sources", "text_plain": "To identify Cl attributes from multiple data sources", "correct": true}, {"id": "a1", "text": "To ingest data from multiple data sources using Service Graph Connector(s)", "text_plain": "To ingest data from multiple data sources using Service Graph Connector(s)", "correct": false}, {"id": "a2", "text": "To ingest data from multiple data sources using Import Set(s)", "text_plain": "To ingest data from multiple data sources using Import Set(s)", "correct": false}, {"id": "a3", "text": "To populate the CMDB from multiple data sources", "text_plain": "To populate the CMDB from multiple data sources", "correct": false}], "correct_count": 1, "correct_texts": ["To identify Cl attributes from multiple data sources"], "explanation": "", "corrected": false}, {"num": 41, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>The Configuration Management team wants to confirm that all servers in the CMDB actually exist in the data center.</p><p>Which CMDB Data Manager policy type would the team create?</p>", "question_plain": "The Configuration Management team wants to confirm that all servers in the CMDB actually exist in the data center.Which CMDB Data Manager policy type would the team create?", "answers": [{"id": "a0", "text": "Attestation", "text_plain": "Attestation", "correct": true}, {"id": "a1", "text": "Delete", "text_plain": "Delete", "correct": false}, {"id": "a2", "text": "Retire", "text_plain": "Retire", "correct": false}, {"id": "a3", "text": "Archive", "text_plain": "Archive", "correct": false}, {"id": "a4", "text": "Certification", "text_plain": "Certification", "correct": false}], "correct_count": 1, "correct_texts": ["Attestation"], "explanation": "", "corrected": false}, {"num": 42, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator has a number of similar de-duplication tasks that need to be remediated in bulk. How does the Administrator achieve this?</p>", "question_plain": "A CMDB Administrator has a number of similar de-duplication tasks that need to be remediated in bulk. How does the Administrator achieve this?", "answers": [{"id": "a0", "text": "Configure and run a custom de-duplication background script", "text_plain": "Configure and run a custom de-duplication background script", "correct": false}, {"id": "a1", "text": "Create and run a de-duplication template", "text_plain": "Create and run a de-duplication template", "correct": true}, {"id": "a2", "text": "Create de-duplication tasks manually and remediate each", "text_plain": "Create de-duplication tasks manually and remediate each", "correct": false}, {"id": "a3", "text": "Utilize the Duplicate CI Remediator Wizard", "text_plain": "Utilize the Duplicate CI Remediator Wizard", "correct": false}], "correct_count": 1, "correct_texts": ["Create and run a de-duplication template"], "explanation": "", "corrected": false}, {"num": 43, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>The CMDB Configuration Management team wants to manage de-duplication tasks generated from data ingested into the CMDB via the Identification and Reconciliation Engine (IRE).</p><p>In which area of the CMDB Workspace can they locate these de-duplication tasks?</p>", "question_plain": "The CMDB Configuration Management team wants to manage de-duplication tasks generated from data ingested into the CMDB via the Identification and Reconciliation Engine (IRE).In which area of the CMDB Workspace can they locate these de-duplication tasks?", "answers": [{"id": "a0", "text": "Important actions tile under the Home tab", "text_plain": "Important actions tile under the Home tab", "correct": true}, {"id": "a1", "text": "Total status tile under the My Work tab", "text_plain": "Total status tile under the My Work tab", "correct": false}, {"id": "a2", "text": "CMDB feature adoption tile under the Insights tab", "text_plain": "CMDB feature adoption tile under the Insights tab", "correct": false}], "correct_count": 1, "correct_texts": ["Important actions tile under the Home tab"], "explanation": "", "corrected": false}, {"num": 44, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A Configura trics", "Offers remediation options to address and improve poorly performing metrics"], "explanation": "", "corrected": false}, {"num": 48, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator is managing group data from both the CI Class Manager and a Technical Service Offering for a specific class.</p><p><code><strong>CI Class Manager:</strong></code></p><p>- Managed by Group = Enterprise IT Services</p><p><code><strong>Technical Service Offering:</strong></code></p><p>- Managed by Group = Windows Support</p><p>- Change Group = Change Management Team</p><p>What would be the Managed By Group for Cls from this class based on the configured values?</p>", "question_plain": "A CMDB Administrator is managing group data from both the CI Class Manager and a Technical Service Offering for a specific class.CI Class Manager:- Managed by Group = Enterprise IT ServicesTechnical Service Offering:- Managed by Group = Windows Support- Change Group = Change Management TeamWhat would be the Managed By Group for Cls from this class based on the configured values?", "answers": [{"id": "a0", "text": "Enterprise IT Services", "text_plain": "Enterprise IT Services", "correct": false}, {"id": "a1", "text": "Change Management Team", "text_plain": "Change Management Team", "correct": false}, {"id": "a2", "text": "Windows Support", "text_plain": "Windows Support", "correct": true}], "correct_count": 1, "correct_texts": ["Windows Support"], "explanation": "", "corrected": false}, {"num": 49, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator, viewing the CMDB Data Foundations Dashboard, notices the Unique Locations Result percentage low.</p><p>What is the recommended process from the associated playbook to correct this issue?</p>", "question_plain": "A CMDB Administrator, viewing the CMDB Data Foundations Dashboard, notices the Unique Locations Result percentage low.What is the recommended process from the associated playbook to correct this issue?", "answers": [{"id": "a0", "text": "Retain the location that matches the organization's standard naming convention, and delete the duplicate without further validation", "text_plain": "Retain the location that matches the organization's standard naming convention, and delete the duplicate without further validation", "correct": false}, {"id": "a1", "text": "Review both locations, update Cls with the correct location and delete the duplicate location", "text_plain": "Review both locations, update Cls with the correct location and delete the duplicate location", "correct": true}, {"id": "a2", "text": "Keep both locations as either can be used as a valid alternate location", "text_plain": "Keep both locations as either can be used as a valid alternate location", "correct": false}, {"id": "a3", "text": "Use the Duplicate CI Remediator to merge the duplicate location records", "text_plain": "Use the Duplicate CI Remediator to merge the duplicate location records", "correct": false}], "correct_count": 1, "correct_texts": ["Review both locations, update Cls with the correct location and delete the duplicate location"], "explanation": "", "corrected": false}, {"num": 50, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>An Asset Manager wants to ensure that Asset records and Cl records are kept synchronized automatically. How does the Manager do this? (Choose two) </p>", "question_plain": "An Asset Manager wants to ensure that Asset records and Cl records are kept synchronized automatically. How does the Manager do this? (Choose two)", "answers": [{"id": "a0", "text": "Ensure that the business rule to update Asset fields on change on the Cl table is active", "text_plain": "Ensure that the business rule to update Asset fields on change on the Cl table is active", "correct": true}, {"id": "a1", "text": "Ensure that scheduled jobs are run during off-business hours to ensure that sync happens", "text_plain": "Ensure that scheduled jobs are run during off-business hours to ensure that sync happens", "correct": false}, {"id": "a2", "text": "Ensure that the business rule to update Cl fields on change on the asset table is active", "text_plain": "Ensure that the business rule to update Cl fields on change on the asset table is active", "correct": true}, {"id": "a3", "text": "Ensure one-to-one physical mapping between Asset and CI", "text_plain": "Ensure one-to-one physical mapping between Asset and CI", "correct": false}], "correct_count": 2, "correct_texts": ["Ensure that the business rule to update Asset fields on change on the Cl table is active", "Ensure that the business rule to update Cl fields on change on the asset table is active"], "explanation": "<p>ServiceNow maintains synchronization between the <strong>Asset [alm_asset]</strong> and <strong>Configuration Item [cmdb_ci]</strong> tables through specialized, out-of-the-box (OOTB) business rules. These rules act as a bridge, ensuring that if a technician updates a field on one side (like the \"Assigned to\" or \"State\"), the change is reflected on the other.</p><ul><li><p><code><strong>Sync from Asset to CI</strong></code><strong> (A):</strong> The business rule <strong>\"Update CI fields on change\"</strong> (found on the Asset table) triggers whenever an asset record is updated. It pushes the new values to the linked CI.</p></li><li><p><code><strong>Sync from CI to Asset</strong></code><strong> (C):</strong> The business rule <strong>\"Update Asset fields on change\"</strong> (found on the Configuration Item table) triggers when a CI is modified. It pushes those values back to the corresponding Asset record.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/it-asset-management/asset-management/t_CreateAssetandCIFieldsMapping.html\"><strong>Map asset and CI fields (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/it-service-management/c_ManagingAssets.html\"><st should be involved in decisions regarding population of the CMDB using the CSDM Crawl Stage?", "answers": [{"id": "a0", "text": "Business Service Manager, Technology Service Owner", "text_plain": "Business Service Manager, Technology Service Owner", "correct": false}, {"id": "a1", "text": "Application Owner, Application Service Owner", "text_plain": "Application Owner, Application Service Owner", "correct": true}, {"id": "a2", "text": "Customer Service Manager, Infrastructure Manager", "text_plain": "Customer Service Manager, Infrastructure Manager", "correct": false}], "correct_count": 1, "correct_texts": ["Application Owner, Application Service Owner"], "explanation": "", "corrected": true}, {"num": 63, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator has taken over management of a ServiceNow instance and has determined there are multiple deficiencies in the CMDB. During review of the CMDB Data Foundations Dashboard, the Administrator sees that ServiceNow offers Remediation Playbooks.</p><p>How can Playbooks assist the Administrator in resolving these issues?</p>", "question_plain": "A CMDB Administrator has taken over management of a ServiceNow instance and has determined there are multiple deficiencies in the CMDB. During review of the CMDB Data Foundations Dashboard, the Administrator sees that ServiceNow offers Remediation Playbooks.How can Playbooks assist the Administrator in resolving these issues?", "answers": [{"id": "a0", "text": "Playbooks can automatically track common CMDB issues and output metrics.", "text_plain": "Playbooks can automatically track common CMDB issues and output metrics.", "correct": false}, {"id": "a1", "text": "Playbooks can be installed in the instance to automatically fix issues.", "text_plain": "Playbooks can be installed in the instance to automatically fix issues.", "correct": false}, {"id": "a2", "text": "Playbooks can help analyze and fix issues.", "text_plain": "Playbooks can help analyze and fix issues.", "correct": true}], "correct_count": 1, "correct_texts": ["Playbooks can help analyze and fix issues."], "explanation": "", "corrected": false}, {"num": 64, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>What is the relationship between an application and a server?</p>", "question_plain": "What is the relationship between an application and a server?", "answers": [{"id": "a0", "text": "Application &gt; Uses::Used by &gt; Server", "text_plain": "Application > Uses::Used by > Server", "correct": false}, {"id": "a1", "text": "Application &gt; Runs::Runs On &gt; Server", "text_plain": "Application > Runs::Runs On > Server", "correct": false}, {"id": "a2", "text": "Application &gt; Runs on::Runs &gt; Server", "text_plain": "Application > Runs on::Runs > Server", "correct": true}, {"id": "a3", "text": "Application &gt; Used by::Uses &gt; Server", "text_plain": "Application > Used by::Uses > Server", "correct": false}], "correct_count": 1, "correct_texts": ["Application > Runs on::Runs > Server"], "explanation": "", "corrected": true}, {"num": 65, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>An organization needs to maintain non-discoverable attributes, such as warranty expiration dates, for hardware Cls. These attributes are not updated by automated discovery tools.</p><p>What method ensures these attributes are accurately maintained for all Cls?</p>", "question_plain": "An organization needs to maintain non-discoverable attributes, such as warranty expiration dates, for hardware Cls. These attributes are not updated by automated discovery tools.What method ensures these attributes are accurately maintained for all Cls?", "answers": [{"id": "a0", "text": "Create a new Cl class specifically for non-discoverable attributes", "text_plain": "Create a new Cl class specifically for non-discoverable attributes", "correct": false}, {"id": "a1", "text": "Use the CMDB Reconciliation Engine to update the attributes", "text_plain": "Use the CMDB Reconciliation Engine to update the attributes", "correct": false}, {"id": "a2", "text": "Use a scheduled data import to update the attributes from an external source", "text_plain": "Use a scheduled data import to update the attributes from an external source", "correct": true}], "correct_count": 1, "correct_texts": ["Use a scheduled data import to update the attributes from an external source"], "explanation": "", "corrected": false}, {"num": 66, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A Service Desk Manager wants to leverage the Unified Map to find active incidents or problems for a selected Cl. Which panel will give the manager visibility and details?</p>", "question_plain": "A Service Desk Manager wants to leverage the Unified Map to find active incidents or problems for a selected Cl. Which panel will give the manager visibility and details?", "answers": [{"id": "a0", "text": "Overview", "text_plain": "Overview", "correct": false}, {"id": "a1", "text": "Application services", "text_plain": "Application services", "correct": false}, {"id": "a2", "text": "Related items", "text_plain": "Related items", "correct": true}, {"id": "a3", "text": "Attributes", "text_plain": "Attributes", "correct": false}], "correct_count": 1, "correct_texts": ["Related items"], "explanation": "", "corrected": false}, {"num": 67, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A Service Portfolio Manager wants to know what Application Services their Business Service Offerings depend on. What stage of CSDM would map this relationship?</p>", "question_plain": "A Service Portfolio Manager wants to know what Application Services their Business Service Offerings depend on. What stage of CSDM would map this relationship?", "answers": [{"id": "a0", "text": "Fly", "text_plain": "Fly", "correct": false}, {"id": "a1", "text": "Crawl", "text_plain": "Crawl", "correct": false}, {"id": "a2", "text": "Foundation", "text_plain": "Foundation", "correct": false}, {"id": "a3", "text": "Run", "text_plain": "Run", "correct": false}, {"id": "a4", "text": "Walk", "text_plain": "Walk", "correct": true}], "correct_count": 1, "correct_texts": ["Walk"], "explanation": "", "corrected": false}, {"num": 68, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator needs to track which Cls and Cl classes are missing key data. Which CMDB Health Dashboard scorecard supports tracking this requirement?</p>", "question_plain": "A CMDB Administrator needs to track which Cls and Cl classes are missing key data. Which CMDB Health Dashboard scorecard supports tracking this requirement?", "answers": [{"id": "a0", "text": "Compliance", "text_plain": "Compliance", "correct": false}, {"id": "a1", "text": "Correctness", "text_plain": "Correctness", "correct": false}, {"id": "a2", "text": "Completeness", "text_plain": "Completeness", "correct": true}], "correct_count": 1, "correct_texts": ["Completeness"], "explanation": "", "corrected": false}, {"num": 69, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>During a CMDB implementation, a team member is tasked with ensuring the accuracy and completeness of CI data. This person is also responsible for maintaining data quality and resolving discrepancies.</p><p>Which role is responsible for these tasks?</p>", "question_plain": "During a CMDB implementation, a team member is tasked with ensuring the accuracy and completeness of CI data. This person is also responsible for maintaining data quality and resolving discrepancies.Which role is responsible for these tasks?", "answers": [{"id": "a0", "text": "Service Owner", "text_plain": "Service Owner", "correct": false}, {"id": "a1", "text": "CMDB Architect", "text_plain": "CMDB Architect", "correct": false}, {"id": "a2", "text": "Configuration Manager", "text_plain": "Configuration Manager", "correct": true}, {"id": "a3", "text": "IT Asset Manager", "text_plain": "IT Asset Manager", "correct": false}], "correct_count": 1, "correct_texts": ["Configuration Manager"], "explanation": "", "corrected": false}, {"num": 70, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Administrator needs insights into how their CMDB is configured according to ServiceNow recommended practice. Which should be used?</p>", "question_plain": "A CMDB Administrator needs insights into how their CMDB is configured according to ServiceNow recommended practice. Which should be used?", "answers": [{"id": "a0", "text": "CMDB Data Foundation Dashboard", "text_plain": "CMDB Data Foundation Dashboard", "correct": true}, {"id": "a1", "text": "CMDB Workspace", "text_plain": "CMDB Workspace", "correct": false}, {"id": "a2", "text": "CMDB Health Dashboard", "text_plain": "CMDB Health Dashboard", "correct": false}, {"id": "a3", "text": "CMDB Data Manager", "text_plain": "CMDB Data Manager", "correct": false}], "correct_count": 1, "correct_texts": ["CMDB Data Foundation Dashboard"], "explanation": "", "corrected": false}, {"num": 71, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>ServiceNow provides a suite of CMDB management tools designed to effectively ingest, manage, and maintain Cis and relationships.</p><p>Drag and drop the design architecture to its management tool:</p><p>1. Agent Client Collector</p><p>2. Import Sets</p><p>3. Service Graph Connector</p><p>4. ServiceNow Discovery</p><p>A. Organization-built solution using transform maps</p><p>B. Automated agent-based solution running patterns</p><p>C. Automated agentless solution running patterns</p><p>D. Third-party integrations from other vendors</p><p>E. Pre-built store integration solutions that require minimal customization</p>", "question_plain": "ServiceNow provides a suite of CMDB management tools designed to effectively ingest, manage, and maintain Cis and relationships.Drag and drop the design architecture to its management tool:1. Agent Client Collector2. Import Sets3. Service Graph Connector4. ServiceNow DiscoveryA. Organization-built solution using transform mapsB. Automated agent-based solution running patternsC. Automated agentless solution running patternsD. Third-party integrations from other vendorsE. Pre-built store integration solutions that require minimal customization", "answers": [{"id": "a0", "text": "1-B ,2-A ,3-E ,4-D", "text_plain": "1-B ,2-A ,3-E ,4-D", "correct": false}, {"id": "a1", "text": "1-C ,2-A ,3-B ,4-E", "text_plain": "1-C ,2-A ,3-B ,4-E", "correct": false}, {"id": "a2", "text": "1-C ,2-A ,3-E ,4-D", "text_plain": "1-C ,2-A ,3-E ,4-D", "correct": false}, {"id": "a3", "text": "1-A ,2-A ,3-E ,4-C", "text_plain": "1-A ,2-A ,3-E ,4-C", "correct": false}, {"id": "a4", "text": "1-A ,2-D ,3-B ,4-E", "text_plain": "1-A ,2-D ,3-B ,4-E", "correct": false}, {"id": "a5", "text": "1-B ,2-A ,3-D ,4-C", "text_plain": "1-B ,2-A ,3-D ,4-C", "correct": true}], "correct_count": 1, "correct_texts": ["1-B ,2-A ,3-D ,4-C"], "explanation": "<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_17-32-50-be14a18ce6e1f5bea4a39378e8b697a9.png\"><ol><li><p><code><strong>Agent Client Collector</strong></code><strong> (ACC):</strong> This is ServiceNow's <strong>agent-based</strong> approach. It requires a small piece of software to be installed on the target server or endpoint. It uses the same <strong>Discovery Patterns</strong> as the agentless version but triggers them locally, making it ideal for devices that are often offline or behind strict firewalls.</p></li><li><p><code><strong>Import Sets</strong></code><strong>:</strong> This is the \"classic\" way to bring data into ServiceNow. It is a manual or <strong>organization-built</strong> process where admins load raw data (Excel, CSV, XML) and build <strong>Transform Maps</strong> to tell the system which columns match which fields in the CMDB.</p></li><li><p><code><strong>Service Graph Connector</strong></code><strong>:</strong> These are high-fidelity, ServiceNow-engineered <strong>third-party integrations</strong>. They are built to \"speak\" the language of specific vendors (like SCCM, Jamf, or Dynatrace) and map that data directly into the CMDB following CSDM best practices.</p></li><li><p><code><strong>ServiceNow Discovery</strong></code><strong>:</strong> This is the <strong>agentless</strong> solution. It uses a MID Server to scan the network via protocols like SNMP, SSH, or WMI. It runs <strong>Patterns</strong> to identify the hardware and software without requiring any software to be installed on the target devices.</p></li></ol><p>Reference:&nbsp;</p><p>- <a href=\"https://www.servicenow.com/docs/r/it-operations-management/agent-client-collector/acc-landing-page.html\" target=\"_blank\" rel=\"noopener\">Agent Client Collector (ServiceNow Docs)</a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/installed-with-cmdb-workspace.html\" target=\"_blank\" rel=\"noopener\">Components installed with CMDB Workspace (ServiceNow Docs)</a></p><p><strong>*Notice:</strong></p><p>The drag-and-drop question format used in the real exam cannot be reproduced here. Please note that in the actual exam, you will be required to drag option cards (word-based only, not letters or numbers) from one column to correctly match them with the corresponding items in another column — a format often described in official documentation.</p><p>For this reason, it’s important to fully understand and remember the definition and intent of each option rather than relying on the visual layout shown here.</p>", "corrected": false}, {"num": 72, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>A CMDB Administrator needs to create a new Cl class for the Internet of Things (IoT) Sensor in ServiceNow. What are the recommended practices for this specific activity? (Choose two)</p>", "question_plain": "A CMDB Administrator needs to create a new Cl class for the Internet of Things (IoT) Sensor in ServiceNow. What are the recommended practices for this specific activity? (Choose two)", "answers": [{"id": "a0", "text": "Install or update the CMDB CI Class Models store application, and verify the class does not already exist", "text_plain": "Install or update the CMDB CI Class Models store application, and verify the class does not already exist", "correct": true}, {"id": "a1", "text": "Modify an existing class", "text_plain": "Modify an existing class", "correct": false}, {"id": "a2", "text": "Add a new class under an appropriate parent class", "text_plain": "Add a new class under an appropriate parent class", "correct": true}, {"id": "a3", "text": "Delete an unused class, and replace it with the new one", "text_plain": "Delete an unused class, and replace it with the new one", "correct": false}], "correct_count": 2, "correct_texts": ["Install or update the CMDB CI Class Models store application, and verify the class does not already exist", "Add a new class under an appropriate parent class"], "explanation": "", "corrected": false}, {"num": 73, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>A CMDB Data Manager needs to access the ServiceNow platform to create, publish, and manage policies that automate and govern Cl lifecycle operations, ensuring the CMDB remains healthy and efficient.</p><p>Where can the Data Manager do this?</p>", "question_plain": "A CMDB Data Manager needs to access the ServiceNow platform to create, publish, and manage policies that automate and govern Cl lifecycle operations, ensuring the CMDB remains healthy and efficient.Where can the Data Manager do this?", "answers": [{"id": "a0", "text": "CMDB Workspace CMDB 360 tab", "text_plain": "CMDB Workspace CMDB 360 tab", "correct": false}, {"id": "a1", "text": "Service Operations Workspace", "text_plain": "Service Operations Workspace", "correct": false}, {"id": "a2", "text": "CI Class Manager", "text_plain": "CI Class Manager", "correct": false}, {"id": "a3", "text": "CMDB Workspace Management tab", "text_plain": "CMDB Workspace Management tab", "correct": true}], "correct_count": 1, "correct_texts": ["CMDB Workspace Management tab"], "explanation": "", "corrected": false}, {"num": 74, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>Given a list of Service types in the platform. Drag the appropriate service to its definition.</p><p>1. Application Service</p><p>2. Business Service</p><p>3. Technology Management Service (Technical Service)</p><p>A. Logical representation of a deploy system or application stack.</p><p>B. Published to Service Owners and underpins one or more business or application Services.</p><p>C. Published to Business Users and underpins one or more business capabilities.</p>", "question_plain": "Given a list of Service types in the platform. Drag the appropriate service to its definition.1. Application Service2. Business Service3. Technology Management Service (Technical Service)A. Logical representation of a deploy system or application stack.B. Published to Service Owners and underpins one or more business or application Services.C. Published to Business Users and underpins one or more business capabilities.", "answers": [{"id": "a0", "text": "1-A, 2-B, 3-C", "text_plain": "1-A, 2-B, 3-C", "correct": false}, {"id": "a1", "text": "1-C, 2-A, 3-B", "text_plain": "1-C, 2-A, 3-B", "correct": false}, {"id": "a2", "text": "1-A, 2-C, 3-B", "text_plain": "1-A, 2-C, 3-B", "correct": true}, {"id": "a3", "text": "1-B, 2-A, 3-C", "text_plain": "1-B, 2-A, 3-C", "correct": false}], "correct_count": 1, "correct_texts": ["1-A, 2-C, 3-B"], "explanation": "<p><strong>1. </strong><code><strong>Application Service</strong></code><strong> (A)</strong></p><p>This is a specific <strong>instance</strong> of an application. It represents the \"logical\" connection between the infrastructure and the service.</p><ul><li><p><strong>Examples:</strong> <em>Production Instance of ERP</em>, <em>Dev Instance of HR Portal</em>.</p></li><li><p><strong>Role:</strong> It is the operational CI that you typically associate with an Incident or Change.</p></li></ul><p><strong>2. </strong><code><strong>Business Service</strong></code><strong> (C)</strong></p><p>These are the services that <strong>Business Users</strong> (the customers) consume to get their jobs done.</p><ul><li><p><strong>Examples:</strong> <em>Employee Onboarding</em>, <em>Payroll Services</em>, <em>Email Service</em>.</p></li><li><p><strong>Role:</strong> These are mapped to <strong>Business Capabilities</strong> and help executives understand how IT supports the revenue-generating parts of the company.</p></li></ul><p><strong>3. </strong><code><strong>Technical Service</strong></code><strong> (B)</strong></p><p>Also known as <strong>Technology Management Services</strong>, these are the \"plumbing\" of the organization. They are typically <strong>internal-facing</strong>.</p><ul><li><p><strong>Examples:</strong> <em>Server Management</em>, <em>Network Support</em>, <em>Database Hosting</em>.</p></li><li><p><strong>Role:</strong> They are published to <strong>Service Owners</strong> (internal IT) and describe the work required to keep Application and Business services running.</p></li></ul><p><strong>Main Takeaway:</strong></p><ul><li><p>Think of the <strong>Business Service</strong> as the \"What\" (the value to the user), the <strong>Application Service</strong> as the \"Where\" (the specific stack), and the <strong>Technical Service</strong> as the \"How\" (the internal maintenance and support).</p></li></ul><p><strong>Reference: </strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/common-service-data-model-csdm/csdm-conceptual-model.html\"><strong>CSDM data domains (ServiceNow Docs)</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/application-services.html\"><strong>Application services (ServiceNow Docs)</strong></a></p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-02-01_17-34-45-72f8b43083cffe3a3d844f767042df4d.png\">\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-02-01_17-34-45-ba4e45aba36a06db7f2a379b1337c3fd.png\"></p>", "corrected": false}, {"num": 75, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>Which are business values of CMDB? (Choose two)</p>", "question_plain": "Which are business values of CMDB? (Choose two)", "answers": [{"id": "a0", "text": "Collecting and managing financial data", "text_plain": "Collecting and managing financial data", "correct": false}, {"id": "a1", "text": "Streamlining incident and change management", "text_plain": "Streamlining incident and change management", "correct": true}, {"id": "a2", "text": "Strengthening operational resiliency", "text_plain": "Strengthening operational resiliency", "correct": true}, {"id": "a3", "text": "Automating maintenance for Cl relationships", "text_plain": "Automating maintenance for Cl relationships", "correct": false}], "correct_count": 2, "correct_texts": ["Streamlining incident and change management", "Strengthening operational resiliency"], "explanation": "", "corrected": false}, {"num": 76, "quiz": "Quiz 1", "type": "multiple-choice", "question": "<p>Which Security Center metric measures the instance hardening level?</p>", "question_plain": "Which Security Center metric measures the instance hardening level?", "answers": [{"id": "a0", "text": "Compliance score", "text_plain": "Compliance score", "correct": false}, {"id": "a1", "text": "Configuration score", "text_plain": "Configuration score", "correct": true}, {"id": "a2", "text": "Monitoring score", "text_plain": "Monitoring score", "correct": false}, {"id": "a3", "text": "Security scanner", "text_plain": "Security scanner", "correct": false}], "correct_count": 1, "correct_texts": ["Configuration score"], "explanation": "<p>The <strong>ServiceNow Security Center</strong> is designed to provide a comprehensive view of your instance's security posture. Within the dashboard, the <strong>Configuration score</strong> is the primary metric used to measure <strong>instance hardening</strong>.</p><ul><li><p><code><strong>Instance Hardening</strong></code><strong>:</strong> This refers to the process of securing the platform by configuring settings (system properties, plugins, and access controls) to minimize vulnerabilities.</p></li><li><p><code><strong>The Metric</strong></code><strong>:</strong> The Configuration score is calculated based on how many of your instance's settings align with <strong>ServiceNow’s Hardening Guidelines</strong>. For example, it checks if high-security plugins are active, if session timeouts are appropriate, and if administrative access is properly restricted.</p></li><li><p><code><strong>Actionable Data</strong></code><strong>:</strong> If your score is low, the Security Center provides a list of specific \"Hardening\" configurations that are non-compliant, allowing you to remediate them directly.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/platform-security/security-center/homepage.html\"><strong>Security configuration console (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 77, "quiz": "Quiz 1", "type": "multi-select", "question": "<p>A Windows administration team wants a grouping of Cls using CMDB groups.</p><p>Which methods can be used? (Choose two.) </p>", "question_plain": "A Windows administration team wants a grouping of Cls using CMDB groups.Which methods can be used? (Choose two.)", "answers": [{"id": "a0", "text": "Tag-based queries", "text_plain": "Tag-based queries", "correct": false}, {"id": "a1", "text": "Encoded queries", "text_plain": "Encoded queries", "correct": true}, {"id": "a2", "text": "Scripted queries", "text_plain": "Scripted queries", "correct": false}, {"id": "a3", "text": "Saved queries", "text_plain": "Saved queries", "correct": true}], "correct_count": 2, "correct_texts": ["Encoded queries", "Saved queries"], "explanation": "<p><strong>CMDB Groups</strong> allow you to create logical collections of CIs for tasks like patching or reporting. The two primary ways to populate these groups dynamically are:</p><ul><li><p><strong>Tag-based queries:</strong> Using metadata (Tags) assigned to CIs to automatically include them in a group.</p></li><li><p><strong>Encoded queries:</strong> Using standard ServiceNow query strings (e.g., <code>os=Windows^version=2022</code>) to group CIs that meet specific technical criteria.</p></li></ul><p><strong>Reference:&nbsp;</strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/cmdb-groups.html\"><strong>CMDB groups (ServiceNow Docs)</strong></a></p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-03-21_13-47-16-08e503196a227800a7d3413d642252e8.png\"></p>", "corrected": true}, {"num": 78, "quiz": "Quiz 2", "type": "multi-select", "question": "<p> Which ServiceNow solution creates automatic relationships? (Choose two)</p>", "question_plain": "Which ServiceNow solution creates automatic relationships? (Choose two)", "answers": [{"id": "a0", "text": "Discovery", "text_plain": "Discovery", "correct": true}, {"id": "a1", "text": "Workflow Studio", "text_plain": "Workflow Studio", "correct": false}, {"id": "a2", "text": "Service Mapping", "text_plain": "Service Mapping", "correct": true}, {"id": "a3", "text": "IntegrationHub ETL", "text_plain": "IntegrationHub ETL", "correct": false}], "correct_count": 2, "correct_texts": ["Discovery", "Service Mapping"], "explanation": "<p>While both tools automate relationship building, they operate at different layers of the CMDB:</p><ul><li><p><code><strong>Discovery</strong></code><strong> (Horizontal Relationships):</strong> This tool uses a MID Server to scan your network and identify how infrastructure components are physically or logically connected. </p><ul><li><p>It creates <strong>Infrastructure Relationships</strong>. It finds these by looking at TCP connections and running processes.</p></li></ul></li><li><p><code><strong>Service Mapping</strong></code><strong> (Vertical Relationships):</strong> This tool sits on top of Discovery. It starts with an entry point (like a URL) and follows the traffic flow downward to map all infrastructure required to support a specific <strong>Application Service</strong>. </p><ul><li><p>It creates <strong>Service-Aware Relationships</strong>, showing exactly which CIs are part of a specific business service.</p></li></ul></li></ul><p>Reference:&nbsp;<a href=\"https://www.servicenow.com/docs/r/it-operations-management/service-mapping/request-info-entry-points.html\" target=\"_blank\" rel=\"noopener\">Request information about entry points for application services (ServiceNow Docs)</a></p>", "corrected": false}, {"num": 79, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>When utilizing the CMDBTransformUtil API to process inbound data through the <strong>IRE</strong> during an import, which Transform Map event script should be used to intercept the record before it hits the target table?</p>", "question_plain": "When utilizing the CMDBTransformUtil API to process inbound data through the IRE during an import, which Transform Map event script should be used to intercept the record before it hits the target table?", "answers": [{"id": "a0", "text": "onComplete", "text_plain": "onComplete", "correct": false}, {"id": "a1", "text": "onBefore", "text_plain": "onBefore", "correct": true}, {"id": "a2", "text": "onStart", "text_plain": "onStart", "correct": false}, {"id": "a3", "text": "onAfter", "text_plain": "onAfter", "correct": false}], "correct_count": 1, "correct_texts": ["onBefore"], "explanation": "<p>When using <strong>Import Sets</strong> and <strong>Transform Maps</strong> to populate the CMDB, the platform's standard \"coalesce\" logic does not automatically use the <strong>Identification and Reconciliation Engine (IRE)</strong>. To ensure data follows the IRE's identification, reconciliation, and precedence rules, you must manually invoke it via a script.</p><p>The <code><strong>onBefore</strong></code> transform script is the recommended location for this for the following reasons:</p><ul><li><p><strong>Timing:</strong> The <code>onBefore</code> event occurs after the source record is read but <strong>before</strong> it is committed to the target table. This allows the IRE to intercept the data, check for duplicates, and apply reconciliation rules.</p></li><li><p><strong>Identification Engine API:</strong> Within the <code>onBefore</code> script, developers typically use the <code>CMDBTransformUtil</code> class or the <code>IdentificationEngineScriptableApi</code>. A common pattern is to call <code>cmdbUtil.identifyAndReconcile(source, map, log);</code>.</p></li><li><p><strong>Preventing Default Logic:</strong> After the IRE processes the data, the script usually sets <code>ignore = true;</code>. This prevents the standard transform engine from performing its own insert or update, as the IRE has already handled the database operation in accordance with CMDB best practices.</p></li></ul><p>Reference: <a href=\"https://www.servicenow.com/docs/r/api-reference/server-api-reference/c_CMDBTransformUtilAPI.html\" target=\"_blank\" rel=\"noopener\">CMDBTransformUtil - Global (ServiceNow Docs)</a></p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-28_16-17-49-462dcbf820ee08de43921c9ea5706944.png\"></p>", "corrected": false}, {"num": 80, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>A service owner is using Unified Map to understand the composition of a service but wants to filter out irrelevant information. Which options are available to the service owner from the filter panel? (Choose two) </p>", "question_plain": "A service owner is using Unified Map to understand the composition of a service but wants to filter out irrelevant information. Which options are available to the service owner from the filter panel? (Choose two)", "answers": [{"id": "a0", "text": "Discovery source", "text_plain": "Discovery source", "correct": true}, {"id": "a1", "text": "Managed by group", "text_plain": "Managed by group", "correct": false}, {"id": "a2", "text": "Business criticality", "text_plain": "Business criticality", "correct": false}, {"id": "a3", "text": "CI type", "text_plain": "CI type", "correct": true}], "correct_count": 2, "correct_texts": ["Discovery source", "CI type"], "explanation": "", "corrected": false}, {"num": 81, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A Configuration Management Governance team is transitioning from utilizing legacy CMDB status fields to CSDM life cycle status fields. Which table can be modified?</p>", "question_plain": "A Configuration Management Governance team is transitioning from utilizing legacy CMDB status fields to CSDM life cycle status fields. Which table can be modified?", "answers": [{"id": "a0", "text": "Life Cycle Mapping [life_cycle_mapping]", "text_plain": "Life Cycle Mapping [life_cycle_mapping]", "correct": true}, {"id": "a1", "text": "Life Cycle Stages [life_cycle_stage]", "text_plain": "B. Life Cycle Stages [life_cycle_stage]", "correct": false}, {"id": "a2", "text": "Life Cycle Controls [life_cycle_control]", "text_plain": "Life Cycle Controls [life_cycle_control]", "correct": false}, {"id": "a3", "text": "Life Cycle Stage Status [life_cycle_stage_status]", "text_plain": "Life Cycle Stage Status [life_cycle_stage_status]", "correct": false}, {"id": "a4", "text": "Managed By Group [managed_by_group]", "text_plain": "Managed By Group [managed_by_group]", "correct": false}, {"id": "a5", "text": "Life Cycle Workspace [life_cycle_workspace]", "text_plain": "Life Cycle Workspace [life_cycle_workspace]", "correct": false}], "correct_count": 1, "correct_texts": ["Life Cycle Mapping [life_cycle_mapping]"], "explanation": "<p>When transitioning to the <strong>Common Service Data Model (CSDM)</strong> Life Cycle standard, ServiceNow provides a mapping engine to ensure compatibility between legacy fields (like <code>install_status</code> or <code>hardware_status</code>) and the new CSDM fields (<code>life_cycle_stage</code> and <code>life_cycle_stage_status</code>).</p><ul><li><p><strong>The Mapping Table:</strong> The <strong>Life Cycle Mapping [life_cycle_mapping]</strong> table is where the logic lives. It defines how a specific value in a legacy status field translates to a CSDM Stage and Status.</p></li><li><p><strong>Synchronization:</strong> ensures that when a legacy field is updated, the CSDM fields are automatically updated to match, and vice versa.</p></li><li><p><strong>Why it's modified:</strong> Teams modify this table if they have custom legacy statuses or if they want to adjust how \"Retired\" or \"In Use\" states align with their specific organizational governance.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/customer-service-management/synchronizing-install-base-lifecycle-fields-state-field.html\"><strong>Synchronizing the Install base life cycle fields with the state and status fields (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 82, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>In a company there is a need to understand the CSDM maturity level needed. Different stakeholders listed a number of use cases that they expect over time.</p><p>Which use case requires information objects?</p>", "question_plain": "In a company there is a need to understand the CSDM maturity level needed. Different stakeholders listed a number of use cases that they expect over time.Which use case requires information objects?", "answers": [{"id": "a0", "text": "The Asset Management team wants to understand the asset life
