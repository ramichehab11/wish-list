xt_plain": "Manually run the data source updates in the correct order", "correct": false}], "correct_count": 1, "correct_texts": ["Assign a priority to each data source in the reconciliation rules"], "explanation": "<p>The <strong>Reconciliation Engine</strong> is the component of the ServiceNow CMDB that prevents \"data flipping\"—a situation where different data sources (like Discovery, SCCM, and Jamf) constantly overwrite each other's data with different values.</p><p>To manage this, a Configuration Manager creates <strong>Reconciliation Rules</strong>:</p><ul><li><p><strong>Definition:</strong> These rules specify which data source is authorized to update a specific CI Class or even specific attributes (RAM or Operating System).</p></li><li><p><strong>Prioritization:</strong> You assign a <strong>priority order</strong> (integer value) to each data source. The rule of thumb is that the <strong>lower the number, the higher the priority</strong>.</p></li><li><p><strong>Enforcement:</strong> If a data source with priority 100 has already updated an attribute, a data source with priority 200 will be blocked from changing it. However, if a source with priority 50 comes along, the engine will allow the update because it is more \"authoritative.\"</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/r_ReconciliationRulesPrinciples.html\"><strong>Reconciliation rules (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/exploring-ire.html\"><strong>Exploring CMDB Identification and Reconciliation (IRE) (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 163, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>When integrating data into the CMDB using import sets and transform maps, which type of script is added to ensure the data is processed through the IRE?</p>", "question_plain": "When integrating data into the CMDB using import sets and transform maps, which type of script is added to ensure the data is processed through the IRE?", "answers": [{"id": "a0", "text": "onStart", "text_plain": "onStart", "correct": false}, {"id": "a1", "text": "onAfter", "text_plain": "onAfter", "correct": false}, {"id": "a2", "text": "onComplete", "text_plain": "onComplete", "correct": false}, {"id": "a3", "text": "onBefore", "text_plain": "onBefore", "correct": true}], "correct_count": 1, "correct_texts": ["onBefore"], "explanation": "<p>When using <strong>Import Sets</strong> and <strong>Transform Maps</strong> to populate the CMDB, the platform's standard \"coalesce\" logic does not automatically use the <strong>Identification and Reconciliation Engine (IRE)</strong>. To ensure data follows the IRE's identification, reconciliation, and precedence rules, you must manually invoke it via a script.</p><p>The <strong>onBefore</strong> transform script is the recommended location for this for the following reasons:</p><ul><li><p><strong>Timing:</strong> The <code>onBefore</code> event occurs after the source record is read but <strong>before</strong> it is committed to the target table. This allows the IRE to intercept the data, check for duplicates, and apply reconciliation rules.</p></li><li><p><strong>Identification Engine API:</strong> Within the <code>onBefore</code> script, developers typically use the <code>CMDBTransformUtil</code> class or the <code>IdentificationEngineScriptableApi</code>. A common pattern is to call <code>cmdbUtil.identifyAndReconcile(source, map, log);</code>.</p></li><li><p><strong>Preventing Default Logic:</strong> After the IRE processes the data, the script usually sets <code>ignore = true;</code>. This prevents the standard transform engine from performing its own insert or update, as the IRE has already handled the database operation in accordance with CMDB best practices.</p></li></ul><p>Reference: <a href=\"https://www.servicenow.com/docs/r/api-reference/server-api-reference/c_CMDBTransformUtilAPI.html\" target=\"_blank\" rel=\"noopener\">CMDBTransformUtil - Global (ServiceNow Docs)</a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-28_16-17-49-462dcbf820ee08de43921c9ea5706944.png\">", "corrected": false}, {"num": 164, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>Drag and drop the CMDB Health Dashboard metric to the description:</p><p>1. Audit</p><p>2. Duplicate</p><p>3. Orphan</p><p>4. Recommended</p><p>5. Required</p><p>6. Stale</p><p>A. CMDB records that represent the same physical or logical asset multiple times</p><p>B. Fields necessary to create or update a Cl record in the CMDB</p><p>C. CMDB records that no longer maintain their logical or physical relationships with other Cls</p><p>D. CMDB records that are no longer actively updated, but remain stored in the database</p><p>E. Fields that support the accuracy, completeness, and usability of Cl records in the CMDB</p><p>F. Actual values of specified fields are compared to the expected values defined in a template</p>", "question_plain": "Drag and drop the CMDB Health Dashboard metric to the description:1. Audit2. Duplicate3. Orphan4. Recommended5. Required6. StaleA. CMDB records that represent the same physical or logical asset multiple timesB. Fields necessary to create or update a Cl record in the CMDBC. CMDB records that no longer maintain their logical or physical relationships with other ClsD. CMDB records that are no longer actively updated, but remain stored in the databaseE. Fields that support the accuracy, completeness, and usability of Cl records in the CMDBF. Actual values of specified fields are compared to the expected values defined in a template", "answers": [{"id": "a0", "text": "1-F, 2-A, 3-C, 4-D, 5-E, 6-B", "text_plain": "1-F, 2-A, 3-C, 4-D, 5-E, 6-B", "correct": false}, {"id": "a1", "text": "1-F, 2-B, 3-C, 4-E, 5-D, 6-A", "text_plain": "1-F, 2-B, 3-C, 4-E, 5-D, 6-A", "correct": false}, {"id": "a2", "text": "1-A, 2-B, 3-C, 4-D, 5-E, 6-F", "text_plain": "1-A, 2-B, 3-C, 4-D, 5-E, 6-F", "correct": false}, {"id": "a3", "text": "1-D, 2-B, 3-E, 4-C, 5-A, 6-F", "text_plain": "1-D, 2-B, 3-E, 4-C, 5-A, 6-F", "correct": false}, {"id": "a4", "text": "1-F, 2-A, 3-C, 4-E, 5-B, 6-D", "text_plain": "1-F, 2-A, 3-C, 4-E, 5-B, 6-D", "correct": true}, {"id": "a5", "text": "1-A, 2-B, 3-F, 4-E, 5-C, 6-D", "text_plain": "1-A, 2-B, 3-F, 4-E, 5-C, 6-D", "correct": false}], "correct_count": 1, "correct_texts": ["1-F, 2-A, 3-C, 4-E, 5-B, 6-D"], "explanation": "<p><img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_17-01-34-6361ab6c2e872831fa739f932ecb78f1.png\"></p><p>ServiceNow organizes these metrics into three main \"Scorecards\" (The 3 Cs):</p><ul><li><p><strong>Completeness:</strong> Includes <strong>Required</strong> (must have to save) and <strong>Recommended</strong> (should have for better data quality).</p></li><li><p><strong>Correctness:</strong> Includes <strong>Duplicate</strong> (reconciliation issues), <strong>Orphan</strong> (broken relationships), and <strong>Stale</strong> (outdated data).</p></li><li><p><strong>Compliance:</strong> Includes <strong>Audit</strong>, where the actual data in the CMDB is checked against a \"Desired State\" or \"Certification\" template to see if it matches the expected standard.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/c_MonitorCMDBHealth.html\"><strong>View CMDB Health Dashboard (ServiceNow Docs)</strong></a></p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-01-25_17-07-32-64920ef9c528cfbf1a4a3fd8d2987f26.png\"></p><p><strong>*Notice:</strong></p><p>The drag-and-drop question format used in the real exam cannot be reproduced here. Please note that in the actual exam, you will be required to drag option cards (word-based only, not letters or numbers) from one column to correctly match them with the corresponding items in another column — a format often described in official documentation.</p><p>For this reason, it’s important to fully understand and remember the definition and intent of each option rather than relying on the visual layout shown here.</p>", "corrected": false}, {"num": 165, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A customer wants to model their business applications and would like to capture different types of data that includes Personally Identifiable Information (PII) data.</p><p>Based on these requirements, which CMDB class needs to be leveraged to achieve this?</p>", "question_plain": "A customer wants to model their business applications and would like to capture different types of data that includes Personally Identifiable Information (PII) data.Based on these requirements, which CMDB class needs to be leveraged to achieve this?", "answers": [{"id": "a0", "text": "Business Capability", "text_plain": "Business Capability", "correct": false}, {"id": "a1", "text": "API Component", "text_plain": "API Component", "correct": false}, {"id": "a2", "text": "Information Object", "text_plain": "Information Object", "correct": true}, {"id": "a3", "text": "Data Classification", "text_plain": "Data Classification", "correct": false}], "correct_count": 1, "correct_texts": ["Information Object"], "explanation": "<p>According to the <strong>Common Service Data Model (CSDM)</strong> framework, the <strong>Information Object </strong><code><strong>[cmdb_ci_information_object]</strong></code> class is the specific CMDB class used to logically describe and categorize the types of data that an application processes or stores.</p><ul><li><p><code><strong>Role in CSDM</strong></code><strong>:</strong> Information Objects belong to the <strong>Design &amp; Planning</strong> domain. They bridge the gap between business applications and the data they consume.</p></li><li><p><code><strong>Capturing PII</strong></code><strong>:</strong> Information Objects are specifically designed to identify sensitive data categories such as:</p><ul><li><p><strong>Personally Identifiable Information (PII)</strong></p></li><li><p><strong>Payment Card Industry (PCI)</strong> data</p></li><li><p><strong>Health Insurance Portability and Accountability Act (HIPAA)</strong> data</p></li></ul></li><li><p><code><strong>Relationships</strong></code><strong>:</strong> A <strong>Business Application</strong> record is related to an <strong>Information Object</strong> (using the <em>Uses::Used by</em> relationship) to provide visibility into what kind of data the application handles.</p></li></ul><p><strong>Reference: </strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/application-portfolio-management/eaw-information-objects.html\"><strong>Exploring information objects (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/cmdb-tables-details.html\"><strong>CMDB tables descriptions (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 166, "quiz": "Quiz 3", "type": "multi-select", "question": "<p>A CMDB Administrator needs to create a new CI class for the Internet of Things (IoT) Sensor in ServiceNow. What are the recommended practices for this specific activity? (Choose two)</p>", "question_plain": "A CMDB Administrator needs to create a new CI class for the Internet of Things (IoT) Sensor in ServiceNow. What are the recommended practices for this specific activity? (Choose two)", "answers": [{"id": "a0", "text": "Install or update the CMDB CI Class Models store application, and verify the class does not already exist", "text_plain": "Install or update the CMDB CI Class Models store application, and verify the class does not already exist", "correct": true}, {"id": "a1", "text": "Modify an existing class", "text_plain": "Modify an existing class", "correct": false}, {"id": "a2", "text": "Add a new class under an appropriate parent class", "text_plain": "Add a new class under an appropriate parent class", "correct": true}, {"id": "a3", "text": "Delete an unused class, and replace it with the new one", "text_plain": "Delete an unused class, and replace it with the new one", "correct": false}], "correct_count": 2, "correct_texts": ["Install or update the CMDB CI Class Models store application, and verify the class does not already exist", "Add a new class under an appropriate parent class"], "explanation": "", "corrected": false}, {"num": 167, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A Data Center Manager is working with the CMDB CI Class Manager to define the relationship between Application Servers and the Applications they host. The company has multiple Application Servers that host one or more Applications.</p><p>Which describes the relationship between the Application Server table ([cmdb_ci_app_server]) and the Application table ([cmdb_ci_appl])?</p>", "question_plain": "A Data Center Manager is working with the CMDB CI Class Manager to define the relationship between Application Servers and the Applications they host. The company has multiple Application Servers that host one or more Applications.Which describes the relationship between the Application Server table ([cmdb_ci_app_server]) and the Application table ([cmdb_ci_appl])?", "answers": [{"id": "a0", "text": "Many-to-one", "text_plain": "Many-to-one", "correct": false}, {"id": "a1", "text": "One-to-many", "text_plain": "One-to-many", "correct": false}, {"id": "a2", "text": "Many to many", "text_plain": "Many to many", "correct": true}, {"id": "a3", "text": "One-to-one", "text_plain": "One-to-one", "correct": false}], "correct_count": 1, "correct_texts": ["Many to many"], "explanation": "", "corrected": false}, {"num": 168, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>What ensures data volume in the CMDB is manageable?</p>", "question_plain": "What ensures data volume in the CMDB is manageable?", "answers": [{"id": "a0", "text": "Scheduled Jobs", "text_plain": "Scheduled Jobs", "correct": false}, {"id": "a1", "text": "Business Rules", "text_plain": "Business Rules", "correct": false}, {"id": "a2", "text": "Archive Policies", "text_plain": "Archive Policies", "correct": true}], "correct_count": 1, "correct_texts": ["Archive Policies"], "explanation": "", "corrected": false}, {"num": 169, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A Configuration Manager wants to use the Unified Map.</p><p>Where would it be accessed?</p>", "question_plain": "A Configuration Manager wants to use the Unified Map.Where would it be accessed?", "answers": [{"id": "a0", "text": "CMDB Data Manager", "text_plain": "CMDB Data Manager", "correct": false}, {"id": "a1", "text": "CMDB Workspace", "text_plain": "CMDB Workspace", "correct": true}, {"id": "a2", "text": "CI Class Manager", "text_plain": "CI Class Manager", "correct": false}], "correct_count": 1, "correct_texts": ["CMDB Workspace"], "explanation": "", "corrected": false}, {"num": 170, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>The CMDB Administrator group aims to display meaningful results on the CMDB Health Dashboard Compliance Scorecard for server records that are not on the latest patch.</p><p>What must be configured to achieve this goal?</p>", "question_plain": "The CMDB Administrator group aims to display meaningful results on the CMDB Health Dashboard Compliance Scorecard for server records that are not on the latest patch.What must be configured to achieve this goal?", "answers": [{"id": "a0", "text": "Technical Service Offerings, Dynamic Cl Groups, CMDB Groups", "text_plain": "Technical Service Offerings, Dynamic Cl Groups, CMDB Groups", "correct": false}, {"id": "a1", "text": "Certification Filter, Certification Template, Audit", "text_plain": "Certification Filter, Certification Template, Audit", "correct": true}, {"id": "a2", "text": "Certification Policies, Data Filters, Scheduled Jobs", "text_plain": "Certification Policies, Data Filters, Scheduled Jobs", "correct": false}, {"id": "a3", "text": "Stale, Orphan, Duplicate", "text_plain": "Stale, Orphan, Duplicate", "correct": false}], "correct_count": 1, "correct_texts": ["Certification Filter, Certification Template, Audit"], "explanation": "", "corrected": true}, {"num": 171, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A CMDB Administrator has been tasked with gathering information for a presentation to leadership. The Administrator needs to provide Duplicate Cl, Orphan Cl and Stale Cl metrics.</p><p>Which scorecard provides this information on the CMDB Health Dashboard?</p>", "question_plain": "A CMDB Administrator has been tasked with gathering information for a presentation to leadership. The Administrator needs to provide Duplicate Cl, Orphan Cl and Stale Cl metrics.Which scorecard provides this information on the CMDB Health Dashboard?", "answers": [{"id": "a0", "text": "Correctness", "text_plain": "Correctness", "correct": true}, {"id": "a1", "text": "Completeness", "text_plain": "Completeness", "correct": false}, {"id": "a2", "text": "Compliance", "text_plain": "Compliance", "correct": false}], "correct_count": 1, "correct_texts": ["Correctness"], "explanation": "", "corrected": false}, {"num": 172, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>Drag and drop the application service type to the best description.</p><p>1. Dynamic Cl Group</p><p>2. Service Mapping (Connection Suggestion)</p><p>3. Service Mapping (Top-down)</p><p>4. Tag-Based</p><p>A. Recommended for mission-critical application service requires a precise approach using patterns</p><p>B. Best fit to map cloud-native, container-based, machine environments</p>", "question_plain": "Drag and drop the application service type to the best description.1. Dynamic Cl Group2. Service Mapping (Connection Suggestion)3. Service Mapping (Top-down)4. Tag-BasedA. Recommended for mission-critical application service requires a precise approach using patternsB. Best fit to map cloud-native, container-based, machine environments", "answers": [{"id": "a0", "text": "1-A, 2-B", "text_plain": "1-A, 2-B", "correct": false}, {"id": "a1", "text": "2-A, 1-B", "text_plain": "2-A, 1-B", "correct": false}, {"id": "a2", "text": "3-A, 4-B", "text_plain": "3-A, 4-B", "correct": true}, {"id": "a3", "text": "3-A, 1-B", "text_plain": "3-A, 1-B", "correct": false}, {"id": "a4", "text": "3-A, 4-B", "text_plain": "3-A, 4-B", "correct": false}, {"id": "a5", "text": "1-A, 4-B", "text_plain": "1-A, 4-B", "correct": false}], "correct_count": 1, "correct_texts": ["3-A, 4-B"], "explanation": "<ul><li><p><strong>3. Service Mapping (Top-down)</strong> -&gt; <strong>A. Recommended for mission-critical application service requires a precise approach using patterns</strong></p></li></ul><ul><li><p><strong>4. Tag-Based</strong> -&gt; <strong>B. Best fit to map cloud-native, container-based, machine environments</strong></p></li></ul><p>ServiceNow provides various methods to populate Application Services depending on the complexity and visibility required for the application.</p><ul><li><p><strong>Service Mapping (Top-down):</strong> This is the most detailed method. It uses <strong>Patterns</strong> to discover the precise relationships between CIs by following the actual traffic flow from an entry point (like a URL) down to the database. It is the gold standard for mission-critical apps where impact analysis must be exact.</p></li><li><p><strong>Tag-Based Mapping:</strong> This method leverages <strong>Key-Value pairs</strong> (tags) provided by cloud providers like AWS, Azure, or Kubernetes. It is ideal for modern, ephemeral environments where traditional patterns struggle to keep up with rapidly changing containers and virtual machines.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/it-operations-management/prerequisites-service-mapping.html\"><strong>Prerequisites for performing top-down discovery using Service Mapping (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 173, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A CMDB Data Owner has requested better insights on the different data sources that make up the CMDB data set. The Platform Owner knows that the new Service Graph Connector Central plugin is just what is needed.</p><p>After installing the plugin, what workspace will have the new Service Graph Connector Central tab available?</p>", "question_plain": "A CMDB Data Owner has requested better insights on the different data sources that make up the CMDB data set. The Platform Owner knows that the new Service Graph Connector Central plugin is just what is needed.After installing the plugin, what workspace will have the new Service Graph Connector Central tab available?", "answers": [{"id": "a0", "text": "Service Graph Connector Workspace", "text_plain": "Service Graph Connector Workspace", "correct": false}, {"id": "a1", "text": "CMDB Workspace", "text_plain": "CMDB Workspace", "correct": true}, {"id": "a2", "text": "Discovery Admin Workspace", "text_plain": "Discovery Admin Workspace", "correct": false}], "correct_count": 1, "correct_texts": ["CMDB Workspace"], "explanation": "", "corrected": false}, {"num": 174, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A Configuration Manager needs to enable a CMDB Data Manager policy to remove records from a CI Class while retaining the ability to restore them within a specified period.</p><p>Which policy type should the Configuration Manager create?</p>", "question_plain": "A Configuration Manager needs to enable a CMDB Data Manager policy to remove records from a CI Class while retaining the ability to restore them within a specified period.Which policy type should the Configuration Manager create?", "answers": [{"id": "a0", "text": "Certification", "text_plain": "Certification", "correct": false}, {"id": "a1", "text": "Delete", "text_plain": "Delete", "correct": false}, {"id": "a2", "text": "Retire", "text_plain": "Retire", "correct": false}, {"id": "a3", "text": "Archive", "text_plain": "Archive", "correct": true}], "correct_count": 1, "correct_texts": ["Archive"], "explanation": "<p>The <strong>CMDB Data Manager</strong> is a wizard-like tool used to automate the lifecycle of CIs. When the goal is to remove records from the active CMDB tables while maintaining a \"safety net\" for restoration, <strong>Archive</strong> is the specific policy type designed for this purpose.</p><ul><li><p><strong>How it works:</strong> When an Archive policy triggers, the CI is moved from the primary table (e.g., <code>cmdb_ci_server</code>) to a separate <strong>Archive table</strong> (e.g., <code>ar_cmdb_ci_server</code>).</p></li><li><p><strong>The \"Safety Net\":</strong> Because the data is stored in these archive tables rather than being permanently deleted from the database, the Configuration Manager can restore the records if they were archived in error or if they are needed for a specific audit later.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/platform-administration/t_CreateAnArchiveRule.html\"><strong>Create an archive rule (ServiceNow Docs)</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/create-data-manager-policy.html\"><strong>Create a CMDB Data Manager policy (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 175, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A Business Relationship Manager in an organization wants to implement Service Portfolio Management (SPM) and to present offerings to business consumers.</p><p>Which CSDM D  IT infrastructure.</p><p>This domain provides the framework for mapping:</p><ul><li><p><strong>Technical Service Offerings:</strong> These represent the specific \"tiers\" of technology support provided by IT (e.g., \"Standard Support for Windows Servers\").</p></li><li><p><strong>Application Services:</strong> These are the logical instances of an application (e.g., \"Production Instance of SAP\").</p></li><li><p><strong>Infrastructure CIs:</strong> These are the physical or virtual components (Servers, Databases, Load Balancers) that the Technical Service Offering manages to keep the Application Service running.</p></li></ul>", "corrected": false}, {"num": 182, "quiz": "Quiz 3", "type": "multi-select", "question": "<p>A CMDB Administrator uses the CMDB Data Foundations Dashboard to gain insights into the CMDB. The results display low scores for several metrics. Which actions can the CMDB Administrator take to improve the CMDB Health? (Choose two)</p>", "question_plain": "A CMDB Administrator uses the CMDB Data Foundations Dashboard to gain insights into the CMDB. The results display low scores for several metrics. Which actions can the CMDB Administrator take to improve the CMDB Health? (Choose two)", "answers": [{"id": "a0", "text": "Use the Remediation Playbooks linked beside each metric", "text_plain": "Use the Remediation Playbooks linked beside each metric", "correct": true}, {"id": "a1", "text": "Focus on metric(s) with Critical and High priorities", "text_plain": "Focus on metric(s) with Critical and High priorities", "correct": true}, {"id": "a2", "text": "Remove non-operational and retired Cls", "text_plain": "Remove non-operational and retired Cls", "correct": false}, {"id": "a3", "text": "Adjust the metrics using exclusion rules to improve the scores", "text_plain": "Adjust the metrics using exclusion rules to improve the scores", "correct": false}], "correct_count": 2, "correct_texts": ["Use the Remediation Playbooks linked beside each metric", "Focus , {"num": 196, "quiz": "Quiz 3", "type": "multi-select", "question": "<p>A global enterprise integrates data from multiple discovery sources such as ServiceNow Discovery, SCCM, AWS, and manual uploads to populate its CMDB. However, each discovery source categorizes the same Cls differently, leading to duplicate records and inconsistencies across the system. As a result, the CMDB team is struggling with data accuracy and standardization.</p><p>What actions does the CMDB team take to resolve the issue? (Choose two)</p>", "question_plain": "A global enterprise integrates data from multiple discovery sources such as ServiceNow Discovery, SCCM, AWS, and manual uploads to populate its CMDB. However, each discovery source categorizes the same Cls differently, leading to duplicate records and inconsistencies across the system. As a result, the CMDB team is struggling with data accuracy and standardization.What actions does the CMDB team take to resolve the issue? (Choose two)", "answers": [{"id": "a0", "text": "Use CI Class Manager to establish standardized Cl classes and attributes across all discovery sources", "text_plain": "Use CI Class Manager to establish standardized Cl classes and attributes across all discovery sources", "correct": true}, {"id": "a1", "text": "Allow each discovery source to define its own Cl class, even if it results in inconsistencies", "text_plain": "Allow each discovery source to define its own Cl class, even if it results in inconsistencies", "correct": false}, {"id": "a2", "text": "Implement and use identification and reconciliation rules to avoid duplicates and standardize Cl classification", "text_plain": "Implement and use identification and reconciliation rules to avoid duplicates and standardize Cl classification", "correct": true}, {"id": "a3", "text": "Create a custom script to manually adjust incoming data before storing it in the CMDB", "text_plain": "Create a custom script to manually adjust incoming data before storing it in the CMDB", "correct": false}], "correct_count": 2, "correct_texts": ["Use CI Class Manager to establish standardized Cl classes and attributes across all discovery sources", "Implement and use identification and reconciliation rules to avoid duplicates and standardize Cl classification"], "explanation": "", "corrected": false}, {"num": 197, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A Configuration Manager working in the CMDB Workspace wants to see how Cls are connected to each other. Which tool can be used?</p>", "question_plain": "A Configuration Manager working in the CMDB Workspace wants to see how Cls are connected to each other. Which tool can be used?", "answers": [{"id": "a0", "text": "Relationship Map", "text_plain": "Relationship Map", "correct": true}, {"id": "a1", "text": "Unified Map", "text_plain": "Unified Map", "correct": false}, {"id": "a2", "text": "Business Service Map", "text_plain": "Business Service Map", "correct": false}], "correct_count": 1, "correct_texts": ["Relationship Map"], "explanation": "", "corrected": false}, {"num": 198, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A CMDB team has noticed that some hardware Cls are missing the serial number information, making it difficult to maintain data accuracy. The team needs a structured approach to identify and address these gaps.</p><p>Which accomplishes this task?</p>", "question_plain": "A CMDB team has noticed that some hardware Cls are missing the serial number information, making it difficult to maintain data accuracy. The team needs a structured approach to identify and address these gaps.Which accomplishes this task?", "answers": [{"id": "a0", "text": "CMDB Data Foundation Playbook", "text_plain": "CMDB Data Foundation Playbook", "correct": true}, {"id": "a1", "text": "CI Class Manager", "text_plain": "CI Class Manager", "correct": false}, {"id": "a2", "text": "Service Graph Connectors", "text_plain": "Service Graph Connectors", "correct": false}], "correc o", "correct": false}, {"id": "a1", "text": "Independent", "text_plain": "Independent", "correct": false}, {"id": "a2", "text": "Allow fallback to parent's rules", "text_plain": "Allow fallback to parent's rules", "correct": true}, {"id": "a3", "text": "Criterion attributes", "text_plain": "Criterion attributes", "correct": false}], "correct_count": 1, "correct_texts": ["Allow fallback to parent's rules"], "explanation": "", "corrected": false}, {"num": 201, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A Configuration Management team needs to prevent duplicate server records to avoid confusion among users. Server records are identified when they are processed via the Identification and Reconciliation Engine (IRE) using the configured identification rules.</p><p>Where would these rules be configured?</p>", "question_plain": "A Configuration Management team needs to prevent duplicate server records to avoid confusion among users. Server records are identified when they are processed via the Identification and Reconciliation Engine (IRE) using the configured identification rules.Where would these rules be configured?", "answers": [{"id": "a0", "text": "CMDB Health Dashboard", "text_plain": "CMDB Health Dashboard", "correct": false}, {"id": "a1", "text": "CMDB Workspace", "text_plain": "CMDB Workspace", "correct": false}, {"id": "a2", "text": "CMDB CI Class Manager", "text_plain": "CMDB CI Class Manager", "correct": true}, {"id": "a3", "text": "CMDB Data Manager", "text_plain": "CMDB Data Manager", "correct": false}], "correct_count": 1, "correct_texts": ["CMDB CI Class Manager"], "explanation": "", "corrected": false}, {"num": 202, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>The CMDB Administrator has been asked to establish Configuration Management with a functional CMDB. Which factor is most critical for successfully operationalizing the CMDB in ServiceNow?</p>", "question_plain": "The CMDB Administrator has been asked to establish Configuration Management with a functional CMDB. Which factor is most critical for successfully operationalizing the CMDB in ServiceNow?", "answers": [{"id": "a0", "text": "Establishing clear governance and continuously monitoring CMDB health", "text_plain": "Establishing clear governance and continuously monitoring CMDB health", "correct": true}, {"id": "a1", "text": "Relying on automated discovery tools to maintain and update CMDB records", "text_plain": "Relying on automated discovery tools to maintain and update CMDB records", "correct": false}, {"id": "a2", "text": "Populating the CMDB with as much data as possible to ensure a comprehensive inventory of Cls", "text_plain": "Populating the CMDB with as much data as possible to ensure a comprehensive inventory of Cls", "correct": false}, {"id": "a3", "text": "Allowing IT teams to modify CMDB records as needed to promote flexibility in data management", "text_plain": "Allowing IT teams to modify CMDB records as needed to promote flexibility in data management", "correct": false}], "correct_count": 1, "correct_texts": ["Establishing clear governance and continuously monitoring CMDB health"], "explanation": "<p>Operationalizing a CMDB is not a \"one-and-done\" project but a continuous process. While tools and automation are important, they will fail without a framework to manage the data. <strong>Governance</strong> ensures that there are defined roles, responsibilities, and processes for how data enters, moves through, and leaves the CMDB.</p><p><code><strong>The Critical Success Factors</strong></code></p><ul><li><p><strong>Governance:</strong> Defines the \"who, what, and when\" of data management. Without it, the CMDB quickly becomes a \"data swamp\" full of unverified or duplicate records.</p></li><li><p><strong>Health Monitoring:</strong> Utilizing the CMDB Health Dashboard to track <strong>Completeness, Compliance, and Correctness</strong>. This allows the Administrator to identify and fix data quality issues before they impact downstream processes like Incident or Change Management.</p></li><li><p><strong>Process Alignment:</strong> Ensuring the CMDB supports specific business outcomes (like reducing mean time to resolution) rather than just existing as a technical inventory.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/community/cmdb-forum/scoring-in-new-cmdb-health-dashboard/td-p/3091415\"><strong>Scoring in New CMDB Health Dashboard (ServiceNow Community)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/exploring-cmdb-health-parent.html\"><strong>Exploring CMDB Health (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 203, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A Configuration Management Process Owner needs to configure Data Manager for policy tasks to be correctly assigned and aligned with the group attribute assigned to a class in CI Class Manager.</p><p>Which is the recommended field to be used for a policy task assignment?</p>", "question_plain": "A Configuration Management Process Owner needs to configure Data Manager for policy tasks to be correctly assigned and aligned with the group attribute assigned to a class in CI Class Manager.Which is the recommended field to be used for a policy task assignment?", "answers": [{"id": "a0", "text": "Approval group", "text_plain": "Approval group", "correct": false}, {"id": "a1", "text": "Managed by group", "text_plain": "Managed by group", "correct": true}, {"id": "a2", "text": "Change group", "text_plain": "Change group", "correct": false}, {"id": "a3", "text": "Support group", "text_plain": "Support group", "correct": false}], "correct_count": 1, "correct_texts": ["Managed by group"], "explanation": "", "corrected": false}, {"num": 204, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A CMDB CI Class Owner has been asked to change the ico (function applyCorrectionsReset() {
  const correctionsSignature = JSON.stringify(CORRECTED_NUMS.sort());
  const lastApplied = localStorage.getItem(CORRECTIONS_APPLIED_KEY);
  if (lastApplied !== correctionsSignature) {
    let resetCount = 0;
    CORRECTED_NUMS.forEach(num => {
      if (state.answers[num]) {
        delete state.answers[num];
        resetCount++;
      }
      if (state.flagged[num]) {
        delete state.flagged[num];
      }
      if (state.reviewPool[num]) {
        delete state.reviewPool[num];
      }
      if (state.reviewAnswers[num]) {
        delete state.reviewAnswers[num];
      }
    });
    saveState();
    localStorage.setItem(CORRECTIONS_APPLIED_KEY, correctionsSignature);
    if (resetCount > 0) {
      console.log(`Auto-reset of ${resetCount} corrected questions`);
    }
  }
})();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { answers: {}, flagged: {}, reviewPool: {}, reviewAnswers: {}, attempts: {} };
    const parsed = JSON.parse(raw);
    if (!parsed.flagged) parsed.flagged = {};
    if (!parsed.reviewPool) parsed.reviewPool = {};
    if (!parsed.reviewAnswers) parsed.reviewAnswers = {};
    if (!parsed.attempts) parsed.attempts = {};
    
    // S'assurer que TOUTES les questions ratées sont dans le pool de révision
    // (cas où l'utilisateur a répondu avant l'ajout du système de mode révision,
    //  ou après une migration ou un reset partiel)
    Object.entries(parsed.answers).forEach(([num, ans]) => {
      if (ans && !ans.correct) {
        parsed.reviewPool[num] = true;
      }
    });
    
    return parsed;
  } catch(e) { return { answers: {}, flagged: {}, reviewPool: {}, reviewAnswers: {}, attempts: {} }; }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function stripHtml(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.innerHTML = s;
  return div.textContent || div.innerText || '';
}

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlightHtml(html, query) {
  if (!query) return html;
  // Découper le HTML en segments (tags vs texte) pour ne highlight que le texte
  const parts = html.split(/(<[^>]+>)/g);
  const re = new RegExp(`(${escapeRegExp(query)})`, 'gi');
  return parts.map(part => {
    if (part.startsWith('<')) return part;
    return part.replace(re, '<mark class="search-highlight">$1</mark>');
  }).join('');
}

function matchesSearch(q, query) {
  if (!query) return true;
  const lower = query.toLowerCase();
  if (q.question_plain.toLowerCase().includes(lower)) return true;
  for (const ans of q.answers) {
    if (ans.text_plain.toLowerCase().includes(lower)) return true;
  }
  return false;
}

function getQuestionStatus(num) {

function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  const sa = [...a].sort();
  const sb = [...b].sort();
  return sa.every((v, i) => v === sb[i]);
}

function getQuestionType(q) {
  // Détecter drag-and-drop
  const lower = q.question_plain.toLowerCase();
  if (/drag\s+(?:and\s+drop|the|each|appropriate)/i.test(q.question_plain) 
      || lower.includes('drag-and-drop')) {
    // Vérifier que ça contient bien des items numérotés ET lettrés (pas juste une mention)
    const hasItems = /\d[.)]\s*[A-Z]/.test(q.question_plain);
    const hasLetters = /[A-F][.)]\s*[A-Z]/.test(q.question_plain);
    if (hasItems && hasLetters) return 'dnd';
  }
  // Multi-réponses
  if (q.correct_count > 1) return 'multi';
  // Sinon QCM choix unique
  return 'qcm';
}

function parseDragDrop(questionPlain) {
  const isDndText = /drag\s+(?:and\s+drop|the|each|appropriate)/i.test(questionPlain) 
                 || questionPlain.toLowerCase().includes('drag-and-drop');
  if (!isDndText) return null;
  
  // Tente de parser un texte donné (avec ou sans troncature de l'intro)
  function attempt(text) {
    function findAll(t, char) {
      const results = [];
      let pos = 0;
      while (pos < t.length) {
        const idx = t.indexOf(char, pos);
        if (idx === -1) break;
        pos = idx + 1;
        if (idx + 1 >= t.length) continue;
        if (t[idx + 1] !== '.' && t[idx + 1] !== ')') continue;
        const isDigit = /[0-9]/.test(char);
        if (idx > 0) {
          const before = t[idx - 1];
          if (isDigit && /\d/.test(before)) {
            // Précédé d'un chiffre : accepter SEULEMENT si suivi de espace+majuscule
            // (cas "CMDB 3602. Enables" où 2. est un vrai marqueur)
            if (idx + 2 < t.length && t[idx + 2] === ' ' && /[A-Z]/.test(t[idx + 3] || '')) {
              // OK, c'est un nouveau marqueur
            } else continue;
          }
        }
        results.push(idx);
      }
      return results;
    }
    
    const cand = {};
    for (let n = 1; n <= 9; n++) {
      const occ = findAll(text, String(n));
      if (occ.length > 0) cand[String(n)] = occ;
    }
    for (const L of ['A', 'B', 'C', 'D', 'E', 'F']) {
      const occ = findAll(text, L);
      if (occ.length > 0) cand[L] = occ;
    }
    
    function findSeq(chars, startAfter) {
      const r = [];
      let last = startAfter === undefined ? -1 : startAfter;
      for (const c of chars) {
        if (!cand[c]) break;
        const next = cand[c].find(p => p > last);
        if (next === undefined) break;
        r.push({ marker: c, pos: next });
        last = next;
      }
      return r;
    }
    
    // Essai 1 : items chiffres avant descs lettres (cas standard)
    let items = findSeq(['1', '2', '3', '4', '5', '6', '7', '8', '9']);
    let descs = items.length >= 2 
      ? findSeq(['A', 'B', 'C', 'D', 'E', 'F'], items[items.length - 1].pos) 
      : [];
    
    // Essai 2 : descs lettres avant items chiffres (cas inversé, ex Q#91)
    if (items.length < 2 || descs.length < 2) {
      descs = findSeq(['A', 'B', 'C', 'D', 'E', 'F']);
      items = descs.length >= 2 
        ? findSeq(['1', '2', '3', '4', '5', '6', '7', '8', '9'], descs[descs.length - 1].pos) 
        : [];
    }
    
    if (items.length < 2 || descs.length < 2) return null;
    
    const all = [...items, ...descs].sort((a, b) => a.pos - b.pos);
    const parsed = [];
    for (let i = 0; i < all.length; i++) {
      let realStart = all[i].pos + 2;
      while (realStart < text.length && /\s/.test(text[realStart])) realStart++;
      const end = i + 1 < all.length ? all[i + 1].pos : text.length;
      let content = text.substring(realStart, end).trim();
      content = content.replace(/\s+/g, ' ');
      if (content.length > 0) parsed.push({ marker: all[i].marker, text: content });
    }
    
    const itemsOut = parsed.filter(p => /^\d+$/.test(p.marker)).map(p => ({ num: p.marker, text: p.text }));
    const descsOut = parsed.filter(p => /^[A-F]$/.test(p.marker)).map(p => ({ letter: p.marker, text: p.text }));
    
    if (itemsOut.length < 2 || descsOut.length < 2) return null;
    if ([...itemsOut, ...descsOut].some(x => (x.text || '').length < 2)) return null;
    
    return { items: itemsOut, descs: descsOut };
  }
  
  // Essai A : avec troncature de l'intro classique
  const dragMatch = questionPlain.match(/[Dd]rag\s+(?:and\s+drop|the|each|appropriate)[^:.]*[:.]/);
  let truncated = questionPlain;
  if (dragMatch) truncated = questionPlain.substring(dragMatch.index + dragMatch[0].length);
  truncated = truncated.replace(/Some options may not apply/gi, ' ');
  
  let result = attempt(truncated);
  if (result) return result;
  
  // Essai B : sans troncature (cas Q#143 où la regex tronque jusqu'à "description1." en avalant le 1)
  let noTrunc = questionPlain.replace(/Some options may not apply/gi, ' ');
  return attempt(noTrunc);
}

function parseMapping(answerText) {
  // Parse plusieurs formats : "1-D, 2-C", "1 - D, 2 - C", "A - 3, B - 4"
  const map = {};
  // Format X-Y ou X - Y où X et Y peuvent être chiffre ou lettre
  const pairs = answerText.match(/([\dA-F])\s*[-–]\s*([\dA-F])/g) || [];
  pairs.forEach(p => {
    const m = p.match(/([\dA-F])\s*[-–]\s*([\dA-F])/);
    if (!m) return;
    const left = m[1];
    const right = m[2];
    // On normalise : la clé est toujours le chiffre, la valeur la lettre
    if (/^\d$/.test(left) && /^[A-F]$/.test(right)) {
      map[left] = right;
    } else if (/^[A-F]$/.test(left) && /^\d$/.test(right)) {
      map[right] = left;
    }
  });
  return map;
}

  if (dndData) {

    function renderDndState() {
      // Reset pool
      dndPool.innerHTML = `<div class="dnd-pool-label">Available labels</div>`;
      // Reset drop zones (sans toucher au reste de la card)
      dndTargets.querySelectorAll('.dnd-drop-zone').forEach(zone => {
        zone.innerHTML = '<span class="dnd-drop-placeholder">Glisser ici</span>';
        zone.classList.remove('filled');
      });
      dndTargets.querySelectorAll('.dnd-target-row').forEach(row => {
        row.classList.remove('has-correct', 'has-incorrect');
      });
      
      // Lettres placées
      const placed = new Set(Object.values(dndUserMapping));
      
      // Mettre les chips dans le pool ou dans leur drop zone
      dndData.descs.forEach(d => {
        if (placed.has(d.letter)) {
          // Trouver le numéro où il est placé
          let placedNum = null;
          for (const [num, letter] of Object.entries(dndUserMapping)) {
            if (letter === d.letter) { placedNum = num; break; }
          }
          const zone = dndTargets.querySelector(`.dnd-drop-zone[data-num="${placedNum}"]`);
          if (zone) {
            zone.innerHTML = '';
            zone.classList.add('filled');
            const chip = createChip(d.letter, d.text);
            // Si répondu, applique état correct/incorrect
            if (answered) {
              chip.classList.add('locked');
              const isCorrect = dndCorrectMapping[placedNum] === d.letter;
              chip.classList.add(isCorrect ? 'placed-correct' : 'placed-incorrect');
              const row = zone.closest('.dnd-target-row');
              if (row) row.classList.add(isCorrect ? 'has-correct' : 'has-incorrect');
            }
            zone.appendChild(chip);
          }
        } else {
          const chip = createChip(d.letter, d.text);
          if (answered) chip.classList.add('locked');
          dndPool.appendChild(chip);
        }
      });
      
      // Si répondu, marquer les positions attendues non remplies comme incorrectes
      if (answered) {
        Object.keys(dndCorrectMapping).forEach(expectedNum => {
          if (!dndUserMapping[expectedNum]) {
            const row = dndTargets.querySelector(`.dnd-drop-zone[data-num="${expectedNum}"]`);
            if (row) {
              const targetRow = row.closest('.dnd-target-row');
              if (targetRow) targetRow.classList.add('has-incorrect');
            }
          }
        });
      }
      
      // Activer le bouton valider dès qu'au moins une étiquette est placée
      // (les questions DnD asymétriques ont parfois moins d'étiquettes que d'items)
      const validateBtn = card.querySelector('.btn-validate');
      if (validateBtn) {
        validateBtn.disabled = Object.keys(dndUserMapping).length === 0;
      }
    }
    
    // Créer une drop zone (pool ou target)
    function setupDropZone(zoneEl, isPool) {
      zoneEl.addEventListener('dragover', (e) => {
        if (answered) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        zoneEl.classList.add('drag-over');
      });
      zoneEl.addEventListener('dragleave', () => {
        zoneEl.classList.remove('drag-over');
      });
      zoneEl.addEventListener('drop', (e) => {
        if (answered) return;
        e.preventDefault();
        zoneEl.classList.remove('drag-over');
        const letter = e.dataTransfer.getData('text/plain');
        if (!letter) return;
        
        // Retirer cette lettre de son emplacement actuel
        for (const [num, l] of Object.entries(dndUserMapping)) {
          if (l === letter) {
            delete dndUserMapping[num];
            break;
          }
        }
        
        if (isPool) {
          // Drop dans le pool → juste retirer (déjà fait)
        } else {
          // Drop sur une target → remplacer si déjà occupée
          const targetNum = zoneEl.dataset.num;
          // Si une autre lettre était à cet endroit, elle revient au pool (déjà gérée par renderDndState)
          dndUserMapping[targetNum] = letter;
        }
        
        renderDndState();
      });
    }
    
    setupDropZone(dndPool, true);
    
    // Construire les target rows
    dndData.items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'dnd-target-row';
      row.innerHTML = `
        <div class="dnd-target-num">${it.num}</div>
        <div class="dnd-target-text">${it.text}</div>
        <div class="dnd-drop-zone" data-num="${it.num}">
          <span class="dnd-drop-placeholder">Glisser ici</span>
        </div>
      `;
      const zone = row.querySelector('.dnd-drop-zone');
      setupDropZone(zone, false);
      dndTargets.appendChild(row);
    });
    
    dndContainer.appendChild(dndPool);
    dndContainer.appendChild(dndTargets);
    
    // Si répondu, afficher la bonne réponse en bas
    if (answered) {
      const isAllCorrect = dndData.items.every(it => dndUserMapping[it.num] === dndCorrectMapping[it.num]);
      if (!isAllCorrect) {
        const correctDiv = document.createElement('div');
        correctDiv.className = 'dnd-correct-answer';
        const pairs = Object.entries(dndCorrectMapping).map(([n, l]) => 
          `<span class="pair"><strong>${n} → ${l}</strong></span>`
        ).join('');
        correctDiv.innerHTML = `<strong>Correct matching:</strong> ${pairs}`;
        dndContainer.appendChild(correctDiv);
      }
    }
    
    card.appendChild(dndContainer);
    
    // Rendu initial après que tout est dans le DOM
    setTimeout(renderDndState, 0);
    
    // Expose le mapping pour la validation
    card._dndUserMapping = dndUserMapping;
    card._dndCorrectMapping = dndCorrectMapping;
    card._isDnd = true;
  } else {
    qText.innerHTML = currentSearch ? highlightHtml(q.question, currentSearch) : q.question;
    card.appendChild(qText);
  }

  if (isMulti && !answered) {
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = `Select ${q.correct_count} answers, then check`;
    card.appendChild(hint);
  }

  // Answers
  const ansContainer = document.createElement('div');
  ansContainer.className = 'answers';
  let selected = answered ? new Set(userAnswer.selectedIds || []) : new Set();
  
  // Pour les questions DnD, on cache les choix de réponse classiques 
  // (l'utilisateur construit le mapping en glissant les étiquettes)
  if (dndData) {
    ansContainer.style.display = 'none';
  }

  q.answers.forEach((ans, idx) => {
    const div = document.createElement('div');
    div.className = 'answer';
    div.dataset.id = ans.id;

    if (answered) {
      div.classList.add('disabled');
      if (ans.correct) {
        div.classList.add('correct-revealed');
      } else if (selected.has(ans.id)) {
        div.classList.add('incorrect-revealed');
      }
    } else if (selected.has(ans.id)) {
      div.classList.add('selected');
    }

    let markerContent = String(idx + 1);
    if (answered && ans.correct) markerContent = ICONS.check;
    else if (answered && selected.has(ans.id)) markerContent = ICONS.cross;

    let ansText;
    if (dndData) {
      const mapping = parseMapping(ans.text_plain);
      if (Object.keys(mapping).length > 0) {
        ansText = '<div class="dnd-mapping">' + 
          Object.entries(mapping).map(([num, letter]) => 
            `<span class="dnd-pair"><span class="dnd-pair-num">${num}</span><span class="dnd-pair-arrow">→</span><span class="dnd-pair-letter">${letter}</span></span>`
          ).join('') + '</div>';
      } else {
        ansText = currentSearch ? highlightHtml(ans.text, currentSearch) : ans.text;
      }
    } else {
      ansText = currentSearch ? highlightHtml(ans.text, currentSearch) : ans.text;
    }

    let tagHTML = '';
    if (answered) {
      if (ans.correct) {
        tagHTML = `<span class="answer-tag correct">${ICONS.check} Correct answer</span>`;
      } else if (selected.has(ans.id)) {
        tagHTML = `<span class="answer-tag your-wrong">${ICONS.cross} Your answer</span>`;
      }
    }

    div.innerHTML = `
      <div class="answer-marker">${markerContent}</div>
      <div class="answer-text">${ansText}</div>
      ${tagHTML}
    `;

    if (!answered) {
      div.addEventListener('click', () => {
        if (isMulti) {
          if (selected.has(ans.id)) selected.delete(ans.id);
          else selected.add(ans.id);
        } else {
          selected.clear();
          selected.add(ans.id);
        }
        ansContainer.querySelectorAll('.answer').forEach(el => {
          el.classList.toggle('selected', selected.has(el.dataset.id));
        });
        const validateBtn = card.querySelector('.btn-validate');
        if (validateBtn) {
          validateBtn.disabled = selected.size === 0;
        }
      });
    }

    ansContainer.appendChild(div);
  });
  card.appendChild(ansContainer);

  // Actions
  const actions = document.createElement('div');
  actions.className = 'actions';

  if (!answered) {
    const validateBtn = document.createElement('button');
    validateBtn.className = 'btn btn-primary btn-validate';
    validateBtn.innerHTML = `${ICONS.check} Check answer`;
    validateBtn.disabled = true;
    validateBtn.addEventListener('click', () => {
      let correct, answerData;
      
      if (dndData) {
        // Validation DnD : on compare uniquement aux positions du mapping correct
        // (les questions asymétriques ont parfois moins d'étiquettes que d'items, 
        // donc on ne valide que les positions où on attend une réponse)
        const correctNums = Object.keys(dndCorrectMapping);
        if (correctNums.length > 0) {
          // Toutes les positions correctes doivent être remplies avec la bonne lettre
          correct = correctNums.every(num => dndUserMapping[num] === dndCorrectMapping[num]);
        } else {
          // Fallback : comparer avec tous les items
          correct = dndData.items.every(it => dndUserMapping[it.num] === dndCorrectMapping[it.num]);
        }
        answerData = { 
          dndMapping: { ...dndUserMapping }, 
          selectedIds: [],
          correct, 
          ts: Date.now() 
        };
      } else {
        const selectedArr = [...selected];
        correct = arraysEqual(selectedArr, correctIds);
        answerData = { selectedIds: selectedArr, correct, ts: Date.now() };
      }
      
      if (inReviewMode) {
        state.reviewAnswers[q.num] = answerData;
      } else {
        state.answers[q.num] = answerData;
        if (!correct) {
          state.reviewPool[q.num] = true;
        } else {
          if (state.reviewPool[q.num]) {
            delete state.reviewPool[q.num];
            delete state.reviewAnswers[q.num];
          }
        }
      }
      saveState();
      const newCard = renderQuestion(q);
      card.replaceWith(newCard);
      updateUI();
    });
    actions.appendChild(validateBtn);
  } else {
    const retryBtn = document.createElement('button');
    retryBtn.className = 'btn btn-secondary';
    retryBtn.innerHTML = '↻ Retry';
    retryBtn.addEventListener('click', () => {
      if (inReviewMode) {
        delete state.reviewAnswers[q.num];
      } else {
        delete state.answers[q.num];
      }
      saveState();
      const newCard = renderQuestion(q);
      card.replaceWith(newCard);
      updateUI();
    });
    actions.appendChild(retryBtn);

    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn-ghost';
    nextBtn.textContent = 'Next →';
    nextBtn.addEventListener('click', () => {
      const next = card.nextElementSibling;
      if (next) next.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    actions.appendChild(nextBtn);
  }

  // Bouton "Retirer du mode révision" (visible si la question est dans le pool)
  if (inReviewPool) {
    const removeBtn = document.createElement('button');
    removeBtn.className = 'btn btn-sm btn-ghost btn-remove-review';
    removeBtn.innerHTML = `${ICONS.cross} Remove from review`;
    removeBtn.addEventListener('click', () => {
      delete state.reviewPool[q.num];
      delete state.reviewAnswers[q.num];
      saveState();
      // Si on est en mode révision, la carte disparaît
      if (inReviewMode) {
        card.style.transition = 'opacity 0.2s';
        card.style.opacity = '0';
        setTimeout(() => {
          applyFilters();
          updateUI();
        }, 200);
      } else {
        const newCard = renderQuestion(q);
        card.replaceWith(newCard);
        updateUI();
      }
    });
    actions.appendChild(removeBtn);
  }
  
  card.appendChild(actions);

  // Flag comment
  if (flagged) {
    const fc = document.createElement('div');
    fc.className = 'flag-comment';
    fc.innerHTML = `
      <div class="flag-comment-title">${ICONS.alert} Report note</div>
      <textarea placeholder="Write the actual correct answer here…"></textarea>
    `;
    const ta = fc.querySelector('textarea');
    ta.value = state.flagged[q.num].note || '';
    ta.addEventListener('input', () => {
      if (state.flagged[q.num]) {
        state.flagged[q.num].note = ta.value;
        saveState();
      }
    });
    card.appendChild(fc);
  }

  // Explanation
  if (answered && q.explanation) {
    const exp = document.createElement('div');
    exp.className = 'explanation';
    exp.innerHTML = `<div class="explanation-title">${ICONS.book} Explanation</div>${q.explanation}`;
    card.appendChild(exp);
  }

  return card;
}

function getVisibleQuestions() {
  let pool = QUESTIONS;
  if (currentMode === 'review') {
    // Toutes les questions présentes dans reviewPool
    pool = QUESTIONS.filter(q => state.reviewPool[q.num]);
  } else if (currentMode === 'flagged') {
    pool = QUESTIONS.filter(q => state.flagged[q.num]);
  }

  return pool.filter(q => {
    if (currentFilter.quiz !== 'all' && q.quiz !== currentFilter.quiz) return false;
    if (currentFilter.type !== 'all' && getQuestionType(q) !== currentFilter.type) return false;
    if (currentFilter.status !== 'all') {
      let st;
      if (currentMode === 'review') {
        const ra = state.reviewAnswers[q.num];
        if (!ra) st = 'todo';
        else st = ra.correct ? 'correct' : 'incorrect';
      } else {
        st = getQuestionStatus(q.num);
      }
      if (st !== currentFilter.status) return false;
    }
    if (currentSearch && !matchesSearch(q, currentSearch)) return false;
    return true;
  });
}

function applyFilters() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  // Bannière mode révision
  if (currentMode === 'review') {
    const poolCount = Object.keys(state.reviewPool).length;
    const answeredInReview = Object.keys(state.reviewAnswers).length;
    const correctInReview = Object.values(state.reviewAnswers).filter(a => a.correct).length;

    if (poolCount === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-review';
      empty.innerHTML = `
        <div class="icon">${ICONS.trophy}</div>
        <h2>No questions to review</h2>
        <p>When you miss a question in "All questions", it automatically appears here so you can retake it as a new quiz.</p>
      `;
      container.appendChild(empty);
      return;
    }

    const banner = document.createElement('div');
    banner.className = 'review-banner';
    const scorePct = answeredInReview > 0 ? Math.round(correctInReview / answeredInReview * 100) : 0;
    banner.innerHTML = `
      <div class="icon">${ICONS.book}</div>
      <div class="text">
        <h3>Review quiz · ${poolCount} question${poolCount > 1 ? 's' : ''}</h3>
        <p>${answeredInReview > 0
          ? `You have retaken <strong>${answeredInReview}</strong>, of which <strong style="color:var(--green)">${correctInReview} correct</strong> (${scorePct}%). Questions are automatically removed from the pool once you answer them correctly in "All" mode.`
          : `Retake the questions you missed here as a new quiz. Your answers here do not affect the main score.`}</p>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn btn-sm btn-secondary" id="btn-reset-review-answers" title="Set all review-mode questions back to unanswered">↻ Reset answers</button>
        <button class="btn btn-sm btn-danger" id="btn-clear-review-pool" title="Remove all questions from review mode">${ICONS.cross} Empty the pool</button>
      </div>
    `;
    container.appendChild(banner);

    setTimeout(() => {
      const resetAns = document.getElementById('btn-reset-review-answers');
      const clearPool = document.getElementById('btn-clear-review-pool');
      
      if (resetAns) {
        resetAns.addEventListener('click', () => {
          const quizFilter = currentFilter.quiz;
          const targets = QUESTIONS.filter(q => {
            if (!state.reviewPool[q.num]) return false;
            if (quizFilter !== 'all' && q.quiz !== quizFilter) return false;
            return !!state.reviewAnswers[q.num];
          });
          if (targets.length === 0) {
            alert('No answers to clear.');
            return;
          }
          const scope = quizFilter === 'all' ? 'all review-mode answers' : `the ${quizFilter} answers in review mode`;
          if (confirm(`Clear ${scope} (${targets.length} questions) to retake them as a new quiz?`)) {
            targets.forEach(q => { delete state.reviewAnswers[q.num]; });
            saveState();
            applyFilters();
            updateUI();
          }
        });
      }
      
      if (clearPool) {
        clearPool.addEventListener('click', () => {
          const quizFilter = currentFilter.quiz;
          const targets = QUESTIONS.filter(q => {
            if (!state.reviewPool[q.num]) return false;
            if (quizFilter !== 'all' && q.quiz !== quizFilter) return false;
            return true;
          });
          if (targets.length === 0) {
            alert('The pool is already empty for this filter.');
            return;
          }
          const scope = quizFilter === 'all' ? 'all review-mode questions' : `the ${quizFilter} questions in review mode`;
          if (confirm(`Remove ${scope} (${targets.length} questions)?\nThey will only reappear if you miss them again.`)) {
            targets.forEach(q => {
              delete state.reviewPool[q.num];
              delete state.reviewAnswers[q.num];
            });
            saveState();
            applyFilters();
            updateUI();
          }
        });
      }
    }, 0);
  } else if (currentMode === 'flagged') {
    const flaggedCount = Object.keys(state.flagged).length;
    if (flaggedCount > 0) {
      const banner = document.createElement('div');
      banner.className = 'review-banner flagged-banner';
      banner.innerHTML = `
        <div class="icon">${ICONS.flag}</div>
        <div class="text">
          <h3>${flaggedCount} flagged question${flaggedCount > 1 ? 's' : ''}</h3>
          <p>Use the "Export flagged questions" button at the top right to export them and fix them all at once.</p>
        </div>
      `;
      container.appendChild(banner);
    }
  }

  // Search info
  if (currentSearch) {
    const visible = getVisibleQuestions();
    const info = document.createElement('div');
    info.className = 'search-info';
    info.innerHTML = `<strong>${visible.length}</strong> question${visible.length > 1 ? 's' : ''} contenant "<strong>${currentSearch}</strong>"`;
    container.appendChild(info);
  }

  const visible = getVisibleQuestions();
  const orderMap = new Map(questionOrder.map((n, i) => [n, i]));
  visible.sort((a, b) => (orderMap.get(a.num) ?? 0) - (orderMap.get(b.num) ?? 0));

  if (visible.length === 0) {
    if (currentMode === 'flagged') {
      container.innerHTML += `<div class="empty"><h2>No flagged questions</h2><p>Click "Report error" on a question if its correct answer looks wrong to you.</p></div>`;
    } else if (currentSearch) {
      container.innerHTML += `<div class="empty"><h2>No results</h2><p>No question contains "${currentSearch}".</p></div>`;
    } else {
      container.innerHTML += `<div class="empty"><h2>No questions</h2><p>No question matches the active filters.</p></div>`;
    }
    return;
  }

  visible.forEach(q => container.appendChild(renderQuestion(q)));
}

function updateUI() {
  const totalAll = QUESTIONS.length;
  
  // Compteurs globaux pour les stats mini en haut, MAIS contextuels selon filtre quiz et type
  const quizFilter = currentFilter.quiz;
  const typeFilter = currentFilter.type;
  
  let scopeQuestions = QUESTIONS;
  if (quizFilter !== 'all') {
    scopeQuestions = scopeQuestions.filter(q => q.quiz === quizFilter);
  }
  if (typeFilter !== 'all') {
    scopeQuestions = scopeQuestions.filter(q => getQuestionType(q) === typeFilter);
  }
  
  let okAll = 0, koAll = 0;
  scopeQuestions.forEach(q => {
    const a = state.answers[q.num];
    if (a) { if (a.correct) okAll++; else koAll++; }
  });
  const todoAll = scopeQuestions.length - okAll - koAll;
  
  // Signalées dans le scope
  const flaggedScope = scopeQuestions.filter(q => state.flagged[q.num]).length;
  const flaggedTotal = Object.keys(state.flagged).length;

  document.getElementById('count-ok').textContent = okAll;
  document.getElementById('count-ko').textContent = koAll;
  document.getElementById('count-todo').textContent = todoAll;
  document.getElementById('count-flagged').textContent = (quizFilter !== 'all' || typeFilter !== 'all') ? flaggedScope : flaggedTotal;
  
  // Compteur de progression dépend du quiz/type filtrés et du mode
  let scopeForProgress = scopeQuestions;
  let scopeOk = 0, scopeKo = 0;
  if (currentMode === 'review') {
    scopeForProgress = scopeForProgress.filter(q => state.reviewPool[q.num]);
    scopeForProgress.forEach(q => {
      const ra = state.reviewAnswers[q.num];
      if (ra) { if (ra.correct) scopeOk++; else scopeKo++; }
    });
  } else if (currentMode === 'flagged') {
    scopeForProgress = scopeForProgress.filter(q => state.flagged[q.num]);
    scopeForProgress.forEach(q => {
      const a = state.answers[q.num];
      if (a) { if (a.correct) scopeOk++; else scopeKo++; }
    });
  } else {
    scopeForProgress.forEach(q => {
      const a = state.answers[q.num];
      if (a) { if (a.correct) scopeOk++; else scopeKo++; }
    });
  }
  
  const scopeTotal = scopeForProgress.length;
  const scopeAnswered = scopeOk + scopeKo;
  
  let scopeLabel = '';
  const parts = [];
  if (quizFilter !== 'all') parts.push(quizFilter);
  if (typeFilter !== 'all') {
    parts.push(typeFilter === 'qcm' ? 'Single' : typeFilter === 'multi' ? 'Multi' : 'DnD');
  }
  
  if (currentMode === 'review') {
    scopeLabel = parts.length > 0 ? `review · ${parts.join(' · ')}` : 'review';
  } else if (currentMode === 'flagged') {
    scopeLabel = parts.length > 0 ? `flagged · ${parts.join(' · ')}` : 'flagged';
  } else {
    scopeLabel = parts.length > 0 ? parts.join(' · ') : 'answered';
  }
  
  document.getElementById('progress-text').textContent = `${scopeAnswered} / ${scopeTotal} ${scopeLabel}`;
  const pct = scopeTotal ? (scopeAnswered / scopeTotal * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';

  if (scopeAnswered > 0) {
    const scorePct = Math.round(scopeOk / scopeAnswered * 100);
    document.getElementById('score-text').textContent = `${scorePct}% correct`;
  } else {
    document.getElementById('score-text').textContent = '—';
  }

  document.getElementById('tab-count-all').textContent = totalAll;
  document.getElementById('tab-count-review').textContent = Object.keys(state.reviewPool).length;
  document.getElementById('tab-count-flagged').textContent = flaggedTotal;

  // Pills counts (en tenant compte du mode et de la recherche)
  let countAll = 0, countTodo = 0, countCorrect = 0, countIncorrect = 0;
  let pool = QUESTIONS;
  if (currentMode === 'review') {
    pool = QUESTIONS.filter(q => state.reviewPool[q.num]);
  } else if (currentMode === 'flagged') {
    pool = QUESTIONS.filter(q => state.flagged[q.num]);
  }
  pool.forEach(q => {
    if (currentFilter.quiz !== 'all' && q.quiz !== currentFilter.quiz) return;
    if (currentFilter.type !== 'all' && getQuestionType(q) !== currentFilter.type) return;
    if (currentSearch && !matchesSearch(q, currentSearch)) return;
    countAll++;
    let st;
    if (currentMode === 'review') {
      const ra = state.reviewAnswers[q.num];
      if (!ra) st = 'todo';
      else st = ra.correct ? 'correct' : 'incorrect';
    } else {
      st = getQuestionStatus(q.num);
    }
    if (st === 'todo') countTodo++;
    else if (st === 'correct') countCorrect++;
    else if (st === 'incorrect') countIncorrect++;
  });
  document.getElementById('ct-all').textContent = countAll;
  document.getElementById('ct-todo').textContent = countTodo;
  document.getElementById('ct-correct').textContent = countCorrect;
  document.getElementById('ct-incorrect').textContent = countIncorrect;
}

function showStats() {
  const total = QUESTIONS.length;
  let ok = 0, ko = 0;
  Object.values(state.answers).forEach(a => { if (a.correct) ok++; else ko++; });
  const answered = ok + ko;
  const accuracy = answered ? Math.round(ok / answered * 100) : 0;
  const flaggedCount = Object.keys(state.flagged).length;
  const reviewPoolCount = Object.keys(state.reviewPool).length;
  
  // Stats par type de question
  const typeStats = { qcm: { total: 0, ok: 0, ko: 0 }, multi: { total: 0, ok: 0, ko: 0 }, dnd: { total: 0, ok: 0, ko: 0 } };
  QUESTIONS.forEach(q => {
    const t = getQuestionType(q);
    typeStats[t].total++;
    const a = state.answers[q.num];
    if (a) {
      if (a.correct) typeStats[t].ok++;
      else typeStats[t].ko++;
    }
  });

  document.getElementById('global-stats').innerHTML = `
    <div class="stat-card"><div class="value">${total}</div><div class="label">Total questions</div></div>
    <div class="stat-card"><div class="value">${answered}</div><div class="label">Answered</div></div>
    <div class="stat-card"><div class="value" style="color:var(--green)">${ok}</div><div class="label">Correct</div></div>
    <div class="stat-card"><div class="value" style="color:var(--red)">${ko}</div><div class="label">Incorrect</div></div>
    <div class="stat-card"><div class="value" style="color:${accuracy >= 85 ? 'var(--green)' : accuracy >= 70 ? 'var(--salmon-dark)' : 'var(--red)'}">${accuracy}%</div><div class="label">Accuracy</div></div>
    <div class="stat-card"><div class="value" style="color:var(--orange)">${flaggedCount}</div><div class="label">Flagged</div></div>
    <div class="stat-card"><div class="value" style="color:#6366F1">${reviewPoolCount}</div><div class="label">In review</div></div>
  `;

  // Par quiz
  const quizzes = ['Quiz 1', 'Quiz 2', 'Quiz 3', 'Quiz 4', 'Quiz 5'];
  let html = '';
  quizzes.forEach(qn => {
    const qsInQuiz = QUESTIONS.filter(q => q.quiz === qn);
    let qOk = 0, qKo = 0;
    qsInQuiz.forEach(q => {
      const a = state.answers[q.num];
      if (a) { if (a.correct) qOk++; else qKo++; }
    });
    const qAns = qOk + qKo;
    const qPct = qAns ? Math.round(qOk / qAns * 100) : 0;
    
    // Meilleur score historique sur ce quiz
    const attemptsForQuiz = Object.entries(state.attempts).filter(([k, _]) => k.includes(qn));
    let bestPct = null;
    attemptsForQuiz.forEach(([_, atts]) => {
      atts.forEach(a => { if (bestPct === null || a.pct > bestPct) bestPct = a.pct; });
    });
    
    html += `<div class="quiz-stats-row">
      <div class="name">${qn} <span style="color: var(--gray-400); font-weight: 400; font-size: 11px;">(${qsInQuiz.length}q)</span></div>
      <div class="ratio">${qOk}/${qAns}</div>
      <div class="pct" style="color:${qPct >= 85 ? 'var(--green)' : qPct >= 70 ? 'var(--salmon-dark)' : 'var(--red)'}">${qAns ? qPct + '%' : '—'}</div>
      <div class="best" style="font-size: 11px; color: var(--gray-500); text-align: right; font-variant-numeric: tabular-nums;">${bestPct !== null ? 'best: ' + bestPct + '%' : ''}</div>
    </div>`;
  });
  document.getElementById('quiz-stats').innerHTML = html;
  
  // Par type
  const typeNames = { qcm: 'Single choice', multi: 'Multiple answers', dnd: 'Drag-and-drop' };
  let typeHtml = '';
  Object.entries(typeStats).forEach(([type, stats]) => {
    const answered = stats.ok + stats.ko;
    const pct = answered ? Math.round(stats.ok / answered * 100) : 0;
    typeHtml += `<div class="quiz-stats-row">
      <div class="name">${typeNames[type]} <span style="color: var(--gray-400); font-weight: 400; font-size: 11px;">(${stats.total}q)</span></div>
      <div class="ratio">${stats.ok}/${answered}</div>
      <div class="pct" style="color:${pct >= 85 ? 'var(--green)' : pct >= 70 ? 'var(--salmon-dark)' : 'var(--red)'}">${answered ? pct + '%' : '—'}</div>
      <div></div>
    </div>`;
  });
  const typesDiv = document.getElementById('type-stats');
  if (typesDiv) typesDiv.innerHTML = typeHtml;

  // Historique
  const attemptsDiv = document.getElementById('attempts-history');
  const labels = Object.keys(state.attempts).sort();
  if (labels.length === 0) {
    attemptsDiv.innerHTML = `<p style="color: var(--gray-400); font-size: 13px; font-style: italic; text-align: center; padding: 20px;">No attempts saved yet. Use the ✓ button at the top to submit your results.</p>`;
  } else {
    let historyHtml = '';
    labels.forEach(label => {
      const attempts = state.attempts[label];
      historyHtml += `<div style="margin-bottom: 16px;">`;
      historyHtml += `<div style="font-weight: 700; font-size: 13px; color: var(--gray-900); margin-bottom: 8px;">${label}</div>`;
      attempts.forEach((att, idx) => {
        const d = new Date(att.date);
        const dateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        const color = att.pct >= 85 ? 'var(--green)' : att.pct >= 70 ? 'var(--salmon-dark)' : 'var(--red)';
        historyHtml += `<div style="display: grid; grid-template-columns: 1fr 80px 60px 30px; align-items: center; padding: 8px 12px; background: var(--gray-50); border-radius: 8px; margin-bottom: 4px; font-size: 13px;">`;
        historyHtml += `<div style="color: var(--gray-700);">#${idx + 1} · ${dateStr}</div>`;
        historyHtml += `<div style="text-align: right; color: var(--gray-700); font-variant-numeric: tabular-nums;">${att.ok}/${att.answered}</div>`;
        historyHtml += `<div style="text-align: right; font-weight: 700; color: ${color}; font-variant-numeric: tabular-nums;">${att.pct}%</div>`;
        historyHtml += `<button onclick="deleteAttempt('${label.replace(/'/g, "\\'")}', ${idx})" style="background: none; border: none; cursor: pointer; color: var(--gray-400); font-size: 16px; padding: 0;" title="Delete">🗑️</button>`;
        historyHtml += `</div>`;
      });
      historyHtml += `</div>`;
    });
    attemptsDiv.innerHTML = historyHtml;
  }
  
  const clearBtn = document.getElementById('btn-clear-attempts');
  if (clearBtn) {
    clearBtn.onclick = clearAllAttempts;
  }

  document.getElementById('stats-modal').classList.add('open');
}

function submitAttempt() {
  const quizFilter = currentFilter.quiz;
  const typeFilter = currentFilter.type;
  
  let scopeQuestions = QUESTIONS;
  if (quizFilter !== 'all') {
    scopeQuestions = QUESTIONS.filter(q => q.quiz === quizFilter);
  }
  if (typeFilter !== 'all') {
    scopeQuestions = scopeQuestions.filter(q => getQuestionType(q) === typeFilter);
  }
  
  let ok = 0, ko = 0;
  if (currentMode === 'review') {
    scopeQuestions = scopeQuestions.filter(q => state.reviewPool[q.num]);
    scopeQuestions.forEach(q => {
      const ra = state.reviewAnswers[q.num];
      if (ra) { if (ra.correct) ok++; else ko++; }
    });
  } else {
    scopeQuestions.forEach(q => {
      const a = state.answers[q.num];
      if (a) { if (a.correct) ok++; else ko++; }
    });
  }
  
  const total = scopeQuestions.length;
  const answered = ok + ko;
  
  if (answered === 0) {
    alert('No questions answered. Answer some questions before submitting.');
    return;
  }
  
  const pct = Math.round(ok / answered * 100);
  
  // Construire le label avec quiz + type + mode
  const labelParts = [];
  if (currentMode === 'review') labelParts.push('Review');
  if (quizFilter !== 'all') labelParts.push(quizFilter);
  else labelParts.push('All quizzes');
  if (typeFilter !== 'all') {
    const typeLabels = { qcm: 'Single', multi: 'Multi', dnd: 'Drag-and-drop' };
    labelParts.push(typeLabels[typeFilter]);
  }
  const label = labelParts.join(' · ');
  
  if (!confirm(`Save this attempt?\n\n${label}\nScore: ${ok}/${answered} correct (${pct}%)\nScope total: ${total} questions`)) {
    return;
  }
  
  if (!state.attempts[label]) state.attempts[label] = [];
  state.attempts[label].push({
    date: new Date().toISOString(),
    ok: ok,
    ko: ko,
    answered: answered,
    total: total,
    pct: pct,
  });
  
  saveState();
  showStats();
}

function deleteAttempt(label, index) {
  if (!confirm('Delete this attempt?')) return;
  state.attempts[label].splice(index, 1);
  if (state.attempts[label].length === 0) {
    delete state.attempts[label];
  }
  saveState();
  showStats();
}

function clearAllAttempts() {
  if (!confirm('Clear ALL attempt history? This cannot be undone.')) return;
  state.attempts = {};
  saveState();
  showStats();
}

function exportFlagged() {
  const flaggedList = QUESTIONS
    .filter(q => state.flagged[q.num])
    .map(q => ({
      num: q.num,
      quiz: q.quiz,
      question: q.question_plain.substring(0, 200),
      bonne_reponse_actuelle: q.answers.filter(a => a.correct).map(a => a.text_plain),
      toutes_reponses: q.answers.map(a => a.text_plain),
      note_user: state.flagged[q.num].note || '',
    }));

  if (flaggedList.length === 0) {
    alert('No flagged questions.');
    return;
  }

  const blob = new Blob([JSON.stringify(flaggedList, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `flagged_questions_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// === Listeners ===
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;

    applyFilters();
    updateUI();
    window.scrollTo({top: 0, behavior: 'smooth'});
  });
});

document.getElementById('filter-quiz').addEventListener('change', (e) => {
  currentFilter.quiz = e.target.value;
  updateResetButtonTooltip();
  applyFilters();
  updateUI();
});

document.getElementById('filter-type').addEventListener('change', (e) => {
  currentFilter.type = e.target.value;
