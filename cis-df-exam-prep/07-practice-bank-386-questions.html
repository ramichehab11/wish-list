se}, {"num": 132, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Owner starts on the CSDM journey and needs to become familiar with the CSDM domains.</p><p>Drag the CMDB objects to the correct CSDM domains:</p><p>1. Application Service</p><p>2. Business Application</p><p>3. Business Process</p><p>4. Business Service</p><p>A. Design and Planning domain</p><p>B. Foundation domain</p><p>C. Service Delivery domain</p><p>D. Sell / Consume domain</p>", "question_plain": "A CMDB Owner starts on the CSDM journey and needs to become familiar with the CSDM domains.Drag the CMDB objects to the correct CSDM domains:1. Application Service2. Business Application3. Business Process4. Business ServiceA. Design and Planning domainB. Foundation domainC. Service Delivery domainD. Sell / Consume domain", "answers": [{"id": "a0", "text": "1-C, 2-D, 3-B, 4-A", "text_plain": "1-C, 2-D, 3-B, 4-A", "correct": false}, {"id": "a1", "text": "1-D, 2-A, 3-B, 4-C", "text_plain": "1-D, 2-A, 3-B, 4-C", "correct": false}, {"id": "a2", "text": "1-B, 2-A, 3-C, 4-D", "text_plain": "1-B, 2-A, 3-C, 4-D", "correct": false}, {"id": "a3", "text": "1-C, 2-A, 3-B, 4-D", "text_plain": "1-C, 2-A, 3-B, 4-D", "correct": true}], "correct_count": 1, "correct_texts": ["1-C, 2-A, 3-B, 4-D"], "explanation": "<p><strong>A. </strong><code><strong>Design and Planning Domain</strong></code><strong> (Business Application)</strong></p><p>This domain is for conceptual data. A <strong>Business Application</strong> is a \"design\" object—it represents what the software <em>is</em> and the strategy behind it (e.g., \"ServiceNow\" as a platform), not where it is physically installed.</p><p><strong>B. </strong><code><strong>Foundation Domain</strong></code><strong> (Business Process)</strong></p><p>The Foundation domain contains the \"common data\" that is used across all other domains. <strong>Business Processes</strong>, along with Companies, Locations, and Users, provide the organizational context needed to manage Services and CIs.</p><p><strong>C. </strong><code><strong>Service Delivery Domain</strong></code><strong> (Application Service)</strong></p><p>This domain (sometimes referred to as the <strong>Manage Technical Services</strong> area) contains the actual operational deployments. The <strong>Application Service</strong> represents a specific environment (like <em>Production</em> or <em>Development</em>) and connects the conceptual design to the physical infrastructure.</p><p><strong>D. </strong><code><strong>Sell / Consume Domain</strong></code><strong> (Business Service)</strong></p><p>This domain is the customer-facing side of the model. This is where <strong>Business Services</strong> and <strong>Business Service Offerings</strong> live. It focuses on the value delivered to the business user and how they \"consume\" IT.</p><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/common-service-data-model-csdm/csdm-conceptual-model.html\"><strong>Common Service Data Model — conceptual model (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 133, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>The following Reconciliation Rules were configured for ServiceNow, Altiris, and SCCM:</p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question/2026-02-02_17-43-24-b8bb6fc3151f0cebccf55800804eefeb.png\"><p>Which are true? (Choose two)</p>", "question_plain": "The following Reconciliation Rules were configured for ServiceNow, Altiris, and SCCM:\nWhich are true? (Choose two)", "answers": [{"id": "a0", "text": "Data collected with a discovery source of ServiceNow can insert new records into the Windows Server [cmdb_ci_win_server] table, but cannot update records created by Altiris or SCCM.", "text_plain": "Data collected with a discovery source of ServiceNow can insert new records into the Windows Server [cmdb_ci_win_server] table, but cannot update records created by Altiris or SCCM.", "correct": false}, {"id": "a1", "text": "Data collected with a discovery source of Altiris can update records inserted by SCCM into the Windows Server [cmdb_ci_win_server] table.", "text_plain": "Data collected with a discovery source of Altiris can update records inserted by SCCM into the Windows Server [cmdb_ci_win_server] table.", "correct": true}, {"id": "a2", "text": "Data collected with a discovery source of SCCM can be inserted as new records in the Windows Server [cmdb_ci _win_server] table.", "text_plain": "Data collected with a discovery source of SCCM can be inserted as new records in the Windows Server [cmdb_ci _win_server] table.", "correct": true}, {"id": "a3", "text": "Data collected with a discovery source of SCM can update any record in the Windows Server [cmdb_ci_win_server] table because it has the highest priority number.", "text_plain": "Data collected with a discovery source of SCM can update any record in the Windows Server [cmdb_ci_win_server] table because it has the highest priority number.", "correct": false}], "correct_count": 2, "correct_texts": ["Data collected with a discovery source of Altiris can update records inserted by SCCM into the Windows Server [cmdb_ci_win_server] table.", "Data collected with a discovery source of SCCM can be inserted as new records in the Windows Server [cmdb_ci _win_server] table."], "explanation": "<p><code>Data collected with a discovery source of Altiris can update records inserted by SCCM into the Windows Server [cmdb_ci_win_server] table.</code></p><p>In ServiceNow reconciliation, a source with a <strong>lower priority number</strong> has higher authority.</p><ul><li><p><strong>Altiris</strong> has a priority of <strong>200</strong>.</p></li><li><p><strong>SCCM</strong> has a priority of <strong>300</strong>.</p></li><li><p>Because $200 &lt; 300$, Altiris is considered more \"trusted\" than SCCM. Therefore, data from Altiris is allowed to overwrite/update attributes previously set by SCCM.</p></li></ul><p><code>Data collected with a discovery source of SCCM can be inserted as new records in the Windows Server [cmdb_ci _win_server] table.</code></p><p>Reconciliation rules govern the <strong>updating</strong> of existing CI attributes, not the initial <strong>insertion</strong> of a record.</p><ul><li><p>Any authorized data source (ServiceNow, Altiris, or SCCM) can insert a new CI into the <code>cmdb_ci_win_server</code> table if the IRE determines the CI does not already exist.</p></li><li><p>Once the record exists, the priority numbers then dictate which source can update it.</p></li></ul>", "corrected": false}, {"num": 134, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Architect intends to build a CMDB using CSDM guidance.</p><p>Which CMDB tables will the architect use to build the CSDM sell/consume domain?</p>", "question_plain": "A CMDB Architect intends to build a CMDB using CSDM guidance.Which CMDB tables will the architect use to build the CSDM sell/consume domain?", "answers": [{"id": "a0", "text": "Business Service Offering, Business Service", "text_plain": "Business Service Offering, Business Service", "correct": true}, {"id": "a1", "text": "Business Capability, Information Object, Business Application", "text_plain": "Business Capability, Information Object, Business Application", "correct": false}, {"id": "a2", "text": "Application Service, Technology Management Service (Technical Service), Technology Management Offering (Technical Service Offering)", "text_plain": "Application Service, Technology Management Service (Technical Service), Technology Management Offering (Technical Service Offering)", "correct": false}], "correct_count": 1, "correct_texts": ["Business Service Offering, Business Service"], "explanation": "", "corrected": false}, {"num": 135, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>Drag and drop the CMDB Health Dashboard metric to the description.</p><p>1. Audits</p><p>2. Duplicate Cls</p><p>3. Orphan Cis</p><p>4. Recommended fields</p><p>5. Required fields</p><p>6. Stale Cls</p><p>A. Use these to compare actual values with expected values</p><p>B. Use of these should be minimized</p><p>C. Certain attribute values are not set, or relationships are missing</p><p>D. Preferable for them to be populated, as they could be useful in troubleshooting issues</p><p>E. Have not been updated and may be outdated</p><p>F. Detected during identification and reconciliation, and have associated base system remediation tools</p>", "question_plain": "Drag and drop the CMDB Health Dashboard metric to the description.1. Audits2. Duplicate Cls3. Orphan Cis4. Recommended fields5. Required fields6. Stale ClsA. Use these to compare actual values with expected valuesB. Use of these should be minimizedC. Certain attribute values are not set, or relationships are missingD. Preferable for them to be populated, as they could be useful in troubleshooting issuesE. Have not been updated and may be outdatedF. Detected during identification and reconciliation, and have associated base system remediation tools", "answers": [{"id": "a0", "text": "2-A, 6-B, 5-C, 4-D, 3-E, 1-F", "text_plain": "2-A, 6-B, 5-C, 4-D, 3-E, 1-F", "correct": false}, {"id": "a1", "text": "1-A, 3-B, 5-C, 4-D, 6-E, 2-F", "text_plain": "1-A, 3-B, 5-C, 4-D, 6-E, 2-F", "correct": true}, {"id": "a2", "text": "2-A, 3-B, 6-C, 4-D, 5-E, 1-F", "text_plain": "2-A, 3-B, 6-C, 4-D, 5-E, 1-F", "correct": false}, {"id": "a3", "text": "1-A, 2-B, 5-C, 4-D, 6-E, 3-F", "text_plain": "1-A, 2-B, 5-C, 4-D, 6-E, 3-F", "correct": false}, {"id": "a4", "text": "5-A, 3-B, 1-C, 2-D, 6-E, 4-F", "text_plain": "5-A, 3-B, 1-C, 2-D, 6-E, 4-F", "correct": false}, {"id": "a5", "text": "6-A, 3-B, 5-C, 2-D, 1-E, 4-F", "text_plain": "6-A, 3-B, 5-C, 2-D, 1-E, 4-F", "correct": false}], "correct_count": 1, "correct_texts": ["1-A, 3-B, 5-C, 4-D, 6-E, 2-F"], "explanation": "<p>The CMDB Health Dashboard organizes these metrics into three KPIs: <strong>Completeness</strong>, <strong>Compliance</strong>, and <strong>Correctness</strong>.</p><ul><li><p><code><strong>Audits (Compliance)</strong></code><strong>:</strong> These involve Desired State audits where the system compares the actual configuration of a CI against a \"gold standard\" or expected value.</p></li><li><p><code><strong>Orphan CIs (Correctness)</strong></code><strong>:</strong> These are CIs that are missing a required relationship (e.g., a software instance not linked to a server). Their presence should be minimized to maintain a clean relationship map.</p></li><li><p><code><strong>Required vs. Recommended (Completeness)</strong></code><strong>:</strong> <strong>Required</strong> fields are mandatory for the CI to be considered valid, while <strong>Recommended</strong> fields provide \"nice-to-have\" context that aids in troubleshooting or reporting.</p></li><li><p><code><strong>Stale CIs (Correctness)</strong></code><strong>:</strong> These records have not been updated by a discovery source within a set threshold (e.g., 60 days), suggesting the equipment may have been decommissioned.</p></li><li><p><code><strong>Duplicate CIs (Correctness)</strong></code><strong>:</strong> When the IRE identifies multiple records for the same physical asset, it creates a De-Duplication task which can be resolved using the Duplicate CI Remediator.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/r_CMDBHealthMetrics.html\"><strong>CMDB Health KPIs and metrics (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 136, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>Some steps need to be taken to transition from using different status attributes in the CMDB to life cycle objects</p><p>Drag and drop the objects/attributes to the description:</p><p>1. life_cycle_stage_status</p><p>2. life_cycle_object</p><p>3. life_cycle_mapping</p><p>4. life_cycle_stage</p><p>A. This table is pre-populated with mappings for legacy status value based on its table, to the best-fit CSDM life-cycle value pair.</p><p>B. This is a record attribute that reflects a meta-level state of the record life cycle.</p><p>C. This is a record attribute that reflects a sub-level state of the record life cycle.</p><p>D. This table uses the type of CI (hardware, document, logical, etc.) determine which sub-level life cycle state values are available.</p>", "question_plain": "Some steps need to be taken to transition from using different status attributes in the CMDB to life cycle objectsDrag and drop the objects/attributes to the description:1. life_cycle_stage_status2. life_cycle_object3. life_cycle_mapping4. life_cycle_stageA. This table is pre-populated with mappings for legacy status value based on its table, to the best-fit CSDM life-cycle value pair.B. This is a record attribute that reflects a meta-level state of the record life cycle.C. This is a record attribute that reflects a sub-level state of the record life cycle.D. This table uses the type of CI (hardware, document, logical, etc.) determine which sub-level life cycle state values are available.", "answers": [{"id": "a0", "text": "1-B, 2-D, 3-A, 4-C", "text_plain": "1-B, 2-D, 3-A, 4-C", "correct": false}, {"id": "a1", "text": "1-C, 2-A, 3-D, 4-B", "text_plain": "1-C, 2-A, 3-D, 4-B", "correct": false}, {"id": "a2", "text": "1-C, 2-D, 3-A, 4-B", "text_plain": "1-C, 2-D, 3-A, 4-B", "correct": true}, {"id": "a3", "text": "1-D, 2-C, 3-A, 4-B", "text_plain": "1-D, 2-C, 3-A, 4-B", "correct": false}, {"id": "a4", "text": "1-D, 2-C, 3-B, 4-A", "text_plain": "1-D, 2-C, 3-B, 4-A", "correct": false}], "correct_count": 1, "correct_texts": ["1-C, 2-D, 3-A, 4-B"], "explanation": "<p>ServiceNow introduced <strong>Life Cycle Standards</strong> to replace disparate fields like <code>install_status</code>, <code>hardware_status</code>, and <code>operational_status</code> with a unified, CSDM-aligned structure.</p><ul><li><p><strong>Life Cycle Mapping (</strong><code><strong>life_cycle_mapping</strong></code><strong>):</strong> To help organizations transition, ServiceNow provides this table to \"sync\" legacy status fields with the new Life Cycle Stage and Status. If you update an old status field, the mapping table ensures the new CSDM fields update automatically.</p></li><li><p><strong>Life Cycle Stage (</strong><code><strong>life_cycle_stage</strong></code><strong>):</strong> This represents the high-level or \"meta\" phase of a CI (e.g., <strong>End of Life</strong>, <strong>Operational</strong>, or <strong>Pipeline</strong>).</p></li><li><p><strong>Life Cycle Stage Status (</strong><code><strong>life_cycle_stage_status</strong></code><strong>):</strong> This is the more granular \"sub-level\" state within a stage. For example, if the Stage is <strong>End of Life</strong>, the Status could be <strong>Retired</strong> or <strong>Consumed</strong>.</p></li><li><p><strong>Life Cycle Object (</strong><code><strong>life_cycle_object</strong></code><strong>):</strong> This control table defines which statuses are valid for which types of CIs. A \"Hardware\" object might have different status options than a \"Logical\" object.</p></li></ul><p><strong>Reference: </strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/customer-service-management/synchronizing-install-base-lifecycle-fields-state-field.html\"><strong>Synchronizing the Install base life cycle fields with the state and status fields (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/common-service-data-model-csdm/csdm-life-cycle-standard-values.html\"><strong>Enabling life-cycle sync from legacy-to-asset (ServiceNow Docs)</strong></a></p><p><strong>-</strong> <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/common-service-data-model-csdm/csdm-lifecycle-product.html\"><strong>Life cycle of product entities (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 137, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>The Apache Web Server identification Rule is configured with the following Criterion attributes:</p><ul><li><p>Class</p></li><li><p>Configuration file</p></li><li><p>Version</p></li></ul>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question/2026-02-05_15-34-43-5696f462f3e8977ab2dcce3da53bbdd3.png\"><p>Yesterday, an Apache Web Server Cl was discovered as part of Service Mapping. Today, the application owner upgraded Apache to a different version and reran discovery of the service.</p><p>What will happen in the CMDB?</p>", "question_plain": "The Apache Web Server identification Rule is configured with the following Criterion attributes:ClassConfiguration fileVersion\nYesterday, an Apache Web Server Cl was discovered as part of Service Mapping. Today, the application owner upgraded Apache to a different version and reran discovery of the service.What will happen in the CMDB?", "answers": [{"id": "a0", "text": "A new Apache Web Server Cl is created.", "text_plain": "A new Apache Web Server Cl is created.", "correct": false}, {"id": "a1", "text": "The Apache Web Server Cl will be reclassified as a Web Server CI.", "text_plain": "The Apache Web Server Cl will be reclassified as a Web Server CI.", "correct": false}, {"id": "a2", "text": "The existing Apache Web Server Cl will be reconciled and its version will be updated.", "text_plain": "The existing Apache Web Server Cl will be reconciled and its version will be updated.", "correct": true}, {"id": "a3", "text": "A duplication error will occur.", "text_plain": "A duplication error will occur.", "correct": false}], "correct_count": 1, "correct_texts": ["The existing Apache Web Server Cl will be reconciled and its version will be updated."], "explanation": "<p>ServiceNow uses the <strong>Identification and Reconciliation Engine (IRE)</strong> to maintain a single source of truth for each asset. When a discovery source (like Service Mapping) finds a CI that already exists in the CMDB, it compares the incoming data against the existing record using <strong>Identification Rules</strong>.</p><p>In this scenario:</p><ul><li><p><code><strong>Identification</strong></code><strong>:</strong> The IRE recognizes that the physical server and the Apache instance are the same as the ones discovered yesterday based on unique identifiers (such as the Name, Install Path, or Serial Number).</p></li><li><p><code><strong>Reconciliation</strong></code><strong>:</strong> Instead of creating a new record, the IRE \"reconciles\" the differences. It identifies that the <code>version</code> attribute has changed and updates the existing CI record with the new version string provided by the latest discovery scan.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/exploring-ire.html\"><strong>Exploring CMDB Identification and Reconciliation (IRE) (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/it-operations-management/t_CreateDiscoSchedForCITypes.html\"><strong>Schedule a top-down discovery by Service Mapping (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 138, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A new ServiceNow customer is assembling a Configuration Management team to support thair CMDB.</p><p>Drag each role to its corresponding job description:</p><p>1. CI Analyst</p><p>2. CMDB Process Owner</p><p>3. Configuration Manager/CMDB Admin</p><p>4. Service or Product Owner</p><p>A. Has read-only access to CMDB data and to basic user interface such as CMDB reports and dashboards</p><p>B. Accountable for managing all elements that make up a portfolio throughout their entire lifecycle</p><p>C. Manages assigned Cl tables and keeps records updated and resolves tasks related to CMDB records</p><p>D. Obtains highest level role for CMDB privileges</p>", "question_plain": "A new ServiceNow customer is assembling a Configuration Management team to support thair CMDB.Drag each role to its corresponding job description:1. CI Analyst2. CMDB Process Owner3. Configuration Manager/CMDB Admin4. Service or Product OwnerA. Has read-only access to CMDB data and to basic user interface such as CMDB reports and dashboardsB. Accountable for managing all elements that make up a portfolio throughout their entire lifecycleC. Manages assigned Cl tables and keeps records updated and resolves tasks related to CMDB recordsD. Obtains highest level role for CMDB privileges", "answers": [{"id": "a0", "text": "1-B, 2-D, 3-C, 4-A", "text_plain": "1-B, 2-D, 3-C, 4-A", "correct": false}, {"id": "a1", "text": "1-A, 2-C, 3-D, 4-B", "text_plain": "1-A, 2-C, 3-D, 4-B", "correct": false}, {"id": "a2", "text": "1-A, 2-D, 3-C, 4-B", "text_plain": "1-A, 2-D, 3-C, 4-B", "correct": true}, {"id": "a3", "text": "1-C, 2-D, 3-A, 4-B", "text_plain": "1-C, 2-D, 3-A, 4-B", "correct": false}, {"id": "a4", "text": "1-A, 2-B, 3-C, 4-D", "text_plain": "1-A, 2-B, 3-C, 4-D", "correct": false}], "correct_count": 1, "correct_texts": ["1-A, 2-D, 3-C, 4-B"], "explanation": "<p>ServiceNow defines specific roles to ensure a balance between administrative control and data accessibility.</p><ul><li><p><code><strong>CI Analyst</strong></code><strong> (1-A):</strong> This role is typically for consumers of CMDB data. They need to see the state of infrastructure and services to make informed decisions, but do not have the permissions to alter the underlying table structures or identification rules.</p></li><li><p><code><strong>Service or Product Owner</strong></code><strong> (4-B):</strong> Aligned with the CSDM, these individuals are responsible for the business value and lifecycle of a service. They ensure that the services in their portfolio are accurately represented and meet business needs.</p></li><li><p><code><strong>Configuration Manager / CMDB Admin</strong></code><strong> (3-C):</strong> These are the \"power users\" who handle the day-to-day health of the database. They manage CI classes, resolve de-duplication tasks, and ensure that automated discovery data is correctly reconciled into the assigned tables.</p></li><li><p><code><strong>CMDB Process Owner</strong></code><strong> (2-D):</strong> This is a strategic role. They define the \"rules of the road\" for the entire CMDB program, holding the highest authority over the governance, policies, and direction of the Configuration Management practice.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/community/cmdb-forum/cmdb-roles/m-p/248674\"><strong>CMDB Roles (ServiceNow Community)</strong></a></p><p><strong>-</strong> <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/cnfig-mgmt-and-cmdb.html\"><strong>Overview of CMDB (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 139, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A manufacturing organization has implemented Incident Management in ServiceNow and wants to integrate additional products to enhance its functionality.</p><p>Drag each ServiceNov product to the value it brings to supporting Incident Management.</p><p>1. Discovery</p><p>2. Hardware Asset Management</p><p>3. Risk Management</p><p>4. Service Portfolio Management</p><p>A. Delivers asset actions and events for the management and maintenance of assets during incidents</p><p>B. Supplies critical IT and financial risk data, enabling the team to as the broader impact of incidents on business operations</p><p>C. Offers detailed operational-level data on hardware and application to improve incident resolution</p>", "question_plain": "A manufacturing organization has implemented Incident Management in ServiceNow and wants to integrate additional products to enhance its functionality.Drag each ServiceNov product to the value it brings to supporting Incident Management.1. Discovery2. Hardware Asset Management3. Risk Management4. Service Portfolio ManagementA. Delivers asset actions and events for the management and maintenance of assets during incidentsB. Supplies critical IT and financial risk data, enabling the team to as the broader impact of incidents on business operationsC. Offers detailed operational-level data on hardware and application to improve incident resolution", "answers": [{"id": "a0", "text": "4-A, 3-B, 1-C", "text_plain": "4-A, 3-B, 1-C", "correct": false}, {"id": "a1", "text": "1-A, 4-B, 2-C", "text_plain": "1-A, 4-B, 2-C", "correct": false}, {"id": "a2", "text": "2-A, 3-B, 1-C", "text_plain": "2-A, 3-B, 1-C", "correct": true}, {"id": "a3", "text": "4-A, 2-B, 1-C", "text_plain": "4-A, 2-B, 1-C", "correct": false}, {"id": "a4", "text": "3-A, 4-B, 1-C", "text_plain": "3-A, 4-B, 1-C", "correct": false}], "correct_count": 1, "correct_texts": ["2-A, 3-B, 1-C"], "explanation": "<p>ServiceNow products work together to enrich the Incident Management process by providing context that a simple \"broken\" ticket wouldn't have.</p><ul><li><p><code><strong>Hardware Asset Management (HAM)</strong></code><strong>:</strong> When an incident occurs, HAM allows technicians to see if a device is under warranty, its lease end date, or if a \"swap\" is available. It moves the conversation from \"the laptop is broken\" to \"this laptop is under warranty; trigger a replacement.\"</p></li><li><p><code><strong>Risk Management</strong></code><strong>:</strong> This integration helps prioritize incidents based on business impact. If an incident affects a CI linked to a critical financial process, the Risk data flags it as a high-priority threat to the organization’s compliance or financial standing.</p></li><li><p><code><strong>Discovery</strong></code><strong>:</strong> This is the primary engine for \"operational data.\" It populates the CMDB with exact hardware specs (CPU, RAM, Serial Number) and software versions. This allows Incident resolvers to see the exact state of the configuration item without needing to ask the end-user for technical details.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/it-service-management/incident-management/incident-management-process.html\"><strong>Exploring Incident Management (ServiceNow Docs)</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/products/it-asset-management/what-is-hardware-asset-management.html\"><strong>What is Hardware Asset Management? - ServiceNow</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/it-operations-management/discovery/c_GetStartedWithDiscovery.html\"><strong>Exploring Discovery (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 140, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>The Server [amdb_ci_server] class uses a dynamic reconciliation rule of lowest value for the Disk Space (GB) field, while the Windows Server [cmdb_ci_win_server] class uses a dynamic reconciliation rule of most reported for the Disk Space (GB) field.</p><p>Given the following data sources that populate Windows Server data into the CMDB 360/Multiscurce CMDB:</p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question/2026-02-05_15-54-46-2ec80e4b2074d4982f835efc12e7a076.png\"><p>Which value would be added to the CMDB for the Disk Space (GB) field of a Windows Server cmdb_ci_win_server record?</p>", "question_plain": "The Server [amdb_ci_server] class uses a dynamic reconciliation rule of lowest value for the Disk Space (GB) field, while the Windows Server [cmdb_ci_win_server] class uses a dynamic reconciliation rule of most reported for the Disk Space (GB) field.Given the following data sources that populate Windows Server data into the CMDB 360/Multiscurce CMDB:\nWhich value would be added to the CMDB for the Disk Space (GB) field of a Windows Server cmdb_ci_win_server record?", "answers": [{"id": "a0", "text": "80", "text_plain": "80", "correct": false}, {"id": "a1", "text": "75", "text_plain": "75", "correct": true}, {"id": "a2", "text": "50", "text_plain": "50", "correct": false}], "correct_count": 1, "correct_texts": ["75"], "explanation": "<p>In ServiceNow, the <strong>IRE</strong> applies rules based on the specific <strong>Class</strong> of the CI being updated. When a CI is identified as a <strong>Windows Server</strong> (<code>cmdb_ci_win_server</code>), the system looks for a reconciliation rule specifically defined for that class.</p><p>In this scenario:</p><ul><li><p>The <strong>Windows Server</strong> class is configured with a <strong>\"Most Reported\"</strong> rule.</p></li><li><p>The system analyzes all data sources currently stored in the Multisource CMDB (CMDB 360) for that specific record.</p></li></ul><p><code><strong>The Logic of \"Most Reported\"</strong></code></p><p>The IRE performs a frequency analysis on the incoming values from the different discovery sources:</p><ul><li><p><strong>Tivoli:</strong> 75 GB</p></li><li><p><strong>ServiceNow:</strong> 75 GB</p></li><li><p><strong>LANDesk:</strong> 50 GB</p></li><li><p><strong>Altiris:</strong> 80 GB</p></li></ul><p>Because the value <strong>75 GB</strong> is reported by two sources (Tivoli and ServiceNow), while 50 GB and 80 GB are only reported by one source each, <strong>75 GB</strong> is determined to be the \"Most Reported\" value.</p><p><strong>Reference: </strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/r_ReconciliationRulesPrinciples.html\"><strong>Reconciliation rules (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/ire.html\"><strong>Identification and Reconciliation engine (IRE) (ServiceNow Docs)</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/multisource-cmdb.html\"><strong>CMDB 360/Multisource CMDB (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 141, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>The CMDB Health Dashboard is based on three Key Performance Indicators (KIs): Correctness, Compliance, and Completeness. Each KPI includes several sub-metrics.</p><p>Drag the sub-metrics to the KPI.</p><p>Some options may not apply</p><p>1. Audit</p><p>2. Certify</p><p>3. Stability</p><p>4. Suggested</p><p>5. Required</p><p>6. Orphan</p><p>A. Completeness</p><p>B. Compliance</p><p>C. Correctness</p>", "question_plain": "The CMDB Health Dashboard is based on three Key Performance Indicators (KIs): Correctness, Compliance, and Completeness. Each KPI includes several sub-metrics.Drag the sub-metrics to the KPI.Some options may not apply1. Audit2. Certify3. Stability4. Suggested5. Required6. OrphanA. CompletenessB. ComplianceC. Correctness", "answers": [{"id": "a0", "text": "A - 5 , B - 1 , C - 6", "text_plain": "A - 5 , B - 1 , C - 6", "correct": true}, {"id": "a1", "text": "A - 4 , B - 3 , C - 2", "text_plain": "A - 4 , B - 3 , C - 2", "correct": false}, {"id": "a2", "text": "A - 3 , B - 2 , C - 4", "text_plain": "A - 3 , B - 2 , C - 4", "correct": false}, {"id": "a3", "text": "A - 2 , B - 3 , C - 6", "text_plain": "A - 2 , B - 3 , C - 6", "correct": false}, {"id": "a4", "text": "A - 5 , B - 2 , C - 6", "text_plain": "A - 5 , B - 2 , C - 6", "correct": false}, {"id": "a5", "text": "A - 6 , B - 1 , C - 5", "text_plain": "A - 6 , B - 1 , C - 5", "correct": false}], "correct_count": 1, "correct_texts": ["A - 5 , B - 1 , C - 6"], "explanation": "<p>The CMDB Health Dashboard uses these three \"pillars\" to measure the overall health of your configuration data.</p><ul><li><p><code><strong>Completeness</strong></code><strong>:</strong> Measures how well the attributes of a CI are populated.</p><ul><li><p><strong>Required:</strong> Fields that <em>must</em> be filled for the CI to be considered valid (e.g., Name).</p></li><li><p><strong>Suggested (Recommended):</strong> Fields that are helpful for troubleshooting or reporting (e.g., Location), but not strictly mandatory.</p></li></ul></li><li><p><code><strong>Compliance</strong></code><strong>:</strong> Measures the difference between the \"Actual\" state of a CI and its \"Desired\" state.</p><ul><li><p><strong>Audit:</strong> This sub-metric uses <strong>Desired State Audits</strong> to flag CIs that fall out of compliance with defined configuration standards.</p></li></ul></li><li><p><code><strong>Correctness</strong></code><strong>:</strong> Measures the integrity and accuracy of the records.</p><ul><li><p><strong>Orphan:</strong> CIs that should have a relationship to a parent or child but are currently \"disconnected.\"</p></li><li><p><em>Other Correctness metrics include Duplicates and Stale CIs.</em></p></li></ul></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/r_CMDBHealthMetrics.html\"><strong>CMDB Health KPIs and metrics (ServiceNow Docs)</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/t_ConfigureCMDBHealthMetrics.html\"><strong>Configure KPI and metrics preferences (ServiceNow Docs)</strong></a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-02-05_16-04-14-600270ecd0ec6a6a43a6b6ba10ff091e.png\">", "corrected": false}, {"num": 142, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Administrator needs to set up CMDB 360/Multisource CMDB.</p><p>Drag and drop the system property to the functionality.</p><p>Some options may not apply</p><p>1. Enables logging for CMDB 360</p><p>2. Enables capturing CMDB 360 data for C/s from non-CMDB classes</p><p>3. Enables CMDB 360</p><p>4. Enables capturing CMDB 360 data for Cis from CMDB classes</p><p>5. Maximum number of CIs that can be included in a CMDB 360 recompute operation</p><p>A. glide.identification_engine.multisource_enabled</p><p>B. glide.identification_engine.multisource_cmdb_ci_enabled</p><p>C. glide.cmdb.logger.source.cmdb_multisource</p><p>D. glide.identification_engine.multisource.recompute.max.ci.limit</p>", "question_plain": "A CMDB Administrator needs to set up CMDB 360/Multisource CMDB.Drag and drop the system property to the functionality.Some options may not apply1. Enables logging for CMDB 3602. Enables capturing CMDB 360 data for C/s from non-CMDB classes3. Enables CMDB 3604. Enables capturing CMDB 360 data for Cis from CMDB classes5. Maximum number of CIs that can be included in a CMDB 360 recompute operationA. glide.identification_engine.multisource_enabledB. glide.identification_engine.multisource_cmdb_ci_enabledC. glide.cmdb.logger.source.cmdb_multisourceD. glide.identification_engine.multisource.recompute.max.ci.limit", "answers": [{"id": "a0", "text": "A - 5 , B - 4 , C - 2 , D - 3", "text_plain": "A - 5 , B - 4 , C - 2 , D - 3", "correct": false}, {"id": "a1", "text": "A - 3 , B - 4 , C - 1 , D - 5", "text_plain": "A - 3 , B - 4 , C - 1 , D - 5", "correct": true}, {"id": "a2", "text": "A - 2 , B - 4 , C - 3 , D - 5", "text_plain": "A - 2 , B - 4 , C - 3 , D - 5", "correct": false}, {"id": "a3", "text": "A - 2 , B - 4 , C - 1 , D - 5", "text_plain": "A - 2 , B - 4 , C - 1 , D - 5", "correct": false}, {"id": "a4", "text": "A - 4 , B - 5 , C - 1 , D - 2", "text_plain": "A - 4 , B - 5 , C - 1 , D - 2", "correct": false}, {"id": "a5", "text": "A - 3 , B - 4 , C - 2 , D - 1", "text_plain": "A - 3 , B - 4 , C - 2 , D - 1", "correct": false}], "correct_count": 1, "correct_texts": ["A - 3 , B - 4 , C - 1 , D - 5"], "explanation": "<p>System properties are the \"engine room\" settings that dictate how CMDB 360 (Multisource CMDB) behaves and stores data from different discovery sources.</p><ul><li><p><code><strong>multisource_enabled</strong></code><strong> (A):</strong> This is the master switch. Setting this to <code>true</code> allows the Identification and Reconciliation Engine (IRE) to start tracking which discovery source is providing which specific attribute values.</p></li><li><p><code><strong>multisource_cmdb_ci_enabled</strong></code><strong> (B):</strong> This property specifically enables the collection of multisource data for all classes that descend from the base <strong>Configuration Item [cmdb_ci]</strong> table.</p></li><li><p><code><strong>logger.source.cmdb_multisource</strong></code><strong> (C):</strong> This property controls the verbosity of the logs specifically for multisource operations. This is essential for troubleshooting why certain values were or were not reconciled.</p></li><li><p><code><strong>recompute.max.ci.limit</strong></code><strong> (D):</strong> To prevent system performance degradation, this property sets a \"safety ceiling\" on how many records the system will process at once when recalculating the best value based on new reconciliation rules.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/multisource-cmdb.html\"><strong>CMDB 360/Multisource CMDB (ServiceNow Docs)</strong></a></p>\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-02-05_16-24-58-b856d844a4d5cd85c5c5ca702f465b68.png\">\n<img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-02-05_16-24-58-00447392c25b4e309b1e52adec5760d5.png\">", "corrected": false}, {"num": 143, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>Drag and drop the product to its description</p><p>1. Agent Client Collector (ACC)</p><p>2. ServiceNow Discovery</p><p>3. Service Graph Connectors</p><p>4. Service Mapping</p><p>A. Automatically identifies devices and applications in the network, populating the CMDB with accurate and up-to-date information</p><p>B. Facilitates integration between ServiceNow and exteral systems to import and synchronize data</p><p>C. Complete topology of the services and shows how they are supported by underlying infrastructure and applications</p><p>D. Provides real-time visibility into endpoint configurations, populating the CMDB with accurate and up-to-date information</p>", "question_plain": "Drag and drop the product to its description1. Agent Client Collector (ACC)2. ServiceNow Discovery3. Service Graph Connectors4. Service MappingA. Automatically identifies devices and applications in the network, populating the CMDB with accurate and up-to-date informationB. Facilitates integration between ServiceNow and exteral systems to import and synchronize dataC. Complete topology of the services and shows how they are supported by underlying infrastructure and applicationsD. Provides real-time visibility into endpoint configurations, populating the CMDB with accurate and up-to-date information", "answers": [{"id": "a0", "text": "1-D, 2-A, 3-B, 4-C", "text_plain": "1-D, 2-A, 3-B, 4-C", "correct": true}, {"id": "a1", "text": "1-D, 2-C, 3-B, 4-A", "text_plain": "1-D, 2-C, 3-B, 4-A", "correct": false}, {"id": "a2", "text": "1-C, 2-B, 3-A, 4-D", "text_plain": "1-C, 2-B, 3-A, 4-D", "correct": false}, {"id": "a3", "text": "1-C, 2-A, 3-B, 4-D", "text_plain": "1-C, 2-A, 3-B, 4-D", "correct": false}], "correct_count": 1, "correct_texts": ["1-D, 2-A, 3-B, 4-C"], "explanation": "<p>Each of these products serves as a \"Discovery Source,\" but they differ in how they gather data and what they focus on.</p><ul><li><p><code><strong>ServiceNow Discovery (Agentless)</strong></code><strong>:</strong> Scans the network using protocols like SNMP, SSH, and WMI to \"find\" what is out there. It is the standard for infrastructure visibility.</p></li><li><p><code><strong>Service Graph Connectors</strong></code><strong>:</strong> These are specialized, ServiceNow-certified integrations built on the IRE. They pull data from third-party vendors (like SCCM, Jamf, or Dynatrace) into the CMDB using a standardized data model.</p></li><li><p><code><strong>Service Mapping</strong></code><strong>:</strong> Unlike horizontal discovery, this creates a <strong>vertical</strong> view. It connects the dots between a Business Service (like \"Email\") and the specific servers, databases, and load balancers that support it.</p></li><li><p><code><strong>Agent Client Collector (ACC)</strong></code><strong>:</strong> This is an <strong>agent-based</strong> approach. A small piece of software sits on the endpoint (laptop or server) and pushes data back to ServiceNow. It is ideal for devices that aren't always on the corporate network or are behind strict firewalls.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/products/service-graph-connectors.html\"><strong>Service Graph Connectors - ServiceNow</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/it-operations-management/agent-client-collector/acc-landing-page.html\"><strong>Agent Client Collector (ServiceNow Docs)</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/it-operations-management/discovery/c_GetStartedWithDiscovery.html\"><strong>Exploring Discovery (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/it-operations-management/service-mapping/service-mapping-get-started.html\"><strong>Exploring Service Mapping (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 144, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A Platform Owner is building the governance team to support the CSDM.</p><p>Drag the domain to the roles that make up the governance team.</p><p>1. Design Domain</p><p>2. Foundation Domain</p><p>3. Portfolio Domain</p><p>4. Technical Domain</p><p>A. Service Owner(s), Platform Owner</p><p>B. Technology Service Owners), Application Service Owner(s), Platform Owner</p><p>C. Enterprise Architects), Platform Owner</p><p>D. Enterprise Architects), Data Steward(s), Process Owners), Platform Owner</p>", "question_plain": "A Platform Owner is building the governance team to support the CSDM.Drag the domain to the roles that make up the governance team.1. Design Domain2. Foundation Domain3. Portfolio Domain4. Technical DomainA. Service Owner(s), Platform OwnerB. Technology Service Owners), Application Service Owner(s), Platform OwnerC. Enterprise Architects), Platform OwnerD. Enterprise Architects), Data Steward(s), Process Owners), Platform Owner", "answers": [{"id": "a0", "text": "1-C, 2-D, 3-A, 4-B", "text_plain": "1-C, 2-D, 3-A, 4-B", "correct": true}, {"id": "a1", "text": "1-B, 2-A, 3-D, 4-C", "text_plain": "1-B, 2-A, 3-D, 4-C", "correct": false}, {"id": "a2", "text": "1-A, 2-B, 3-C, 4-D", "text_plain": "1-A, 2-B, 3-C, 4-D", "correct": false}, {"id": "a3", "text": "1-C, 2-B, 3-D, 4-A", "text_plain": "1-C, 2-B, 3-D, 4-A", "correct": false}, {"id": "a4", "text": "1-C, 2-D, 3-B, 4-A", "text_plain": "1-C, 2-D, 3-B, 4-A", "correct": false}], "correct_count": 1, "correct_texts": ["1-C, 2-D, 3-A, 4-B"], "explanation": "<p>The <strong>Common Service Data Model (CSDM)</strong> is structured into domains that represent different stages of the service lifecycle. Governance ensures that data in these domains follows standardized rules.</p><ul><li><p><code><strong>Design Domain</strong></code><strong> (1-C):</strong> Focuses on the \"blueprints\" of services. <strong>Enterprise Architects</strong> are key here as they define how business capabilities map to applications before they are even built or bought.</p></li><li><p><code><strong>Foundation Domain</strong></code><strong> (2-D):</strong> Contains the \"referential data\" (Users, Groups, Locations, Companies). Because this data is used across the entire platform, it requires <strong>Data Stewards</strong> and <strong>Process Owners</strong> to ensure high quality and consistency.</p></li><li><p><code><strong>Portfolio Domain</strong></code><strong> (3-A):</strong> Relates to the \"Business\" view of services. <strong>Service Owners</strong> manage the value, cost, and lifecycle of these services within the service portfolio.</p></li><li><p><code><strong>Technical Domain</strong></code><strong> (4-B):</strong> Represents the \"IT\" view of the world (Application Services and technical CIs). <strong>Technology Service Owners</strong> and <strong>Application Service Owners</strong> govern these records to ensure operational health and accurate mapping.</p></li></ul><p><strong>Reference: </strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/security-management/application-vulnerability-response/avr-product-view.html\"><strong>Application Vulnerability Response product view (ServiceNow Docs)</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/products/it-operations-management/what-is-csdm.html\"><strong>What is CSDM (common service data model)? - ServiceNow</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/community/s/cgfwn76974/attachments/cgfwn76974/common-service-data-model-kb/243/1/CSDM%204.0%20Draft%20V2.pdf\"><strong>CSDM 4.0 DRAFT (ServiceNow PDF Document)</strong></a></p>", "corrected": false}, {"num": 145, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>An Enterprise Architect needs to help the CMDB owner understand the benefits of CSDM.</p><p>Drag the CSDM domains to the respective benefits.</p><p>1. Foundation</p><p>2. Design and Planning</p><p>3. Service Consumption</p><p>4. Service Delivery</p><p>A. Understand Cis related to business application and related capability identity redundancies, monitor costs and make better investment around roadmap</p><p>B. Understand technical services, technical service offerings, service support and all relationships to underlying technology CIs</p><p>C. Understand business services and ownership, cost, scope of wha to the business/consumer and request access to the business service</p><p>D. Use the base system tables when implementing the CSDM to de highest value from ServiceNow products and the Now Platform</p>", "question_plain": "An Enterprise Architect needs to help the CMDB owner understand the benefits of CSDM.Drag the CSDM domains to the respective benefits.1. Foundation2. Design and Planning3. Service Consumption4. Service DeliveryA. Understand Cis related to business application and related capability identity redundancies, monitor costs and make better investment around roadmapB. Understand technical services, technical service offerings, service support and all relationships to underlying technology CIsC. Understand business services and ownership, cost, scope of wha to the business/consumer and request access to the business serviceD. Use the base system tables when implementing the CSDM to de highest value from ServiceNow products and the Now Platform", "answers": [{"id": "a0", "text": "1-D, 2-A, 3-C, 4-B", "text_plain": "1-D, 2-A, 3-C, 4-B", "correct": true}, {"id": "a1", "text": "1-D, 2-A, 3-C, 4-B", "text_plain": "1-D, 2-A, 3-C, 4-B", "correct": false}, {"id": "a2", "text": "1-B, 2-A, 3-C, 4-D", "text_plain": "1-B, 2-A, 3-C, 4-D", "correct": false}, {"id": "a3", "text": "1-B, 2-D, 3-C, 4-A", "text_plain": "1-B, 2-D, 3-C, 4-A", "correct": false}], "correct_count": 1, "correct_texts": ["1-D, 2-A, 3-C, 4-B"], "explanation": "<p>The <strong>Common Service Data Model (CSDM)</strong> organizes the CMDB into logical domains to provide specific business outcomes and data clarity.</p><ul><li><p><code><strong>Design and Planning</strong></code><strong>:</strong> This domain is where <strong>Business Capabilities</strong> and <strong>Business Applications</strong> live. It allows architects to see where they have \"redundant\" software (e.g., three different project management tools) and align IT spending with the actual needs of the business roadmap.</p></li><li><p><code><strong>Service Delivery</strong></code><strong>:</strong> This focuses on the <strong>Technical Service</strong> and the infrastructure. It provides visibility into how IT teams manage the \"back-end\" (e.g., a \"Server Hosting\" service) and how those technical pieces support the broader organization.</p></li><li><p><code><strong>Service Consumption</strong></code><strong>:</strong> This is the \"front-end\" or consumer view. It links <strong>Business Services</strong> to the people who use them, allowing for a clear understanding of service catalogs, costs to the business, and how users request access.</p></li><li><p><strong>Foundation:</strong> This domain provides the \"glue\" for the entire platform. By using standard tables for <strong>Locations, Companies, and Groups</strong>, you ensure that every other ServiceNow product (like Incident or HR) is using the same reference data, maximizing the platform's out-of-the-box value.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/products/it-operations-management/what-is-csdm.html\"><strong>What is CSDM (common service data model)? - ServiceNow</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/community/s/cgfwn76974/attachments/cgfwn76974/common-service-data-model-kb/243/1/CSDM%204.0%20Draft%20V2.pdf\"><strong>CSDM 4.0 DRAFT (ServiceNow PDF Document)</strong></a></p>", "corrected": false}, {"num": 146, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>A CMDB Manager wants to start adding CSDM design and planning (design) domain components into the CMDB.</p><p>Who is involved in this exercise? (Choose two)</p>", "question_plain": "A CMDB Manager wants to start adding CSDM design and planning (design) domain components into the CMDB.Who is involved in this exercise? (Choose two)", "answers": [{"id": "a0", "text": "Application Service Owner", "text_plain": "Application Service Owner", "correct": false}, {"id": "a1", "text": "Application Owner", "text_plain": "Application Owner", "correct": true}, {"id": "a2", "text": "Enterprise Architect", "text_plain": "Enterprise Architect", "correct": true}, {"id": "a3", "text": "Business Relationship Manager", "text_plain": "Business Relationship Manager", "correct": false}], "correct_count": 2, "correct_texts": ["Application Owner", "Enterprise Architect"], "explanation": "", "corrected": false}, {"num": 147, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>How is the CMDB aligned to business processes? (Choose two)</p>", "question_plain": "How is the CMDB aligned to business processes? (Choose two)", "answers": [{"id": "a0", "text": "Extends service delivery management to all enterprise departments", "text_plain": "Extends service delivery management to all enterprise departments", "correct": false}, {"id": "a1", "text": "Enhances decision-making and operational efficiency across the organization", "text_plain": "Enhances decision-making and operational efficiency across the organization", "correct": true}, {"id": "a2", "text": "Enables the CFO/CIO to track software licenses", "text_plain": "Enables the CFO/CIO to track software licenses", "correct": false}, {"id": "a3", "text": "Provides a centralized view of configuration items and their relationships", "text_plain": "Provides a centralized view of configuration items and their relationships", "correct": true}], "correct_count": 2, "correct_texts": ["Enhances decision-making and operational efficiency across the organization", "Provides a centralized view of configuration items and their relationships"], "explanation": "", "corrected": false}, {"num": 148, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>An organization is implementing Configuration Management and wants to ensure the CMDB delivers ongoing value and supports IT operations effectively.</p><p>Which approach is <strong>most important</strong> to ensure the CMDB can be successfully used and maintained over time?</p>", "question_plain": "An organization is implementing Configuration Management and wants to ensure the CMDB delivers ongoing value and supports IT operations effectively.Which approach is most important to ensure the CMDB can be successfully used and maintained over time?", "answers": [{"id": "a0", "text": "Define strong CMDB governance practices and regularly measure data quality and health", "text_plain": "Define strong CMDB governance practices and regularly measure data quality and health", "correct": true}, {"id": "a1", "text": "Depend primarily on automated discovery to keep CI records accurate", "text_plain": "Depend primarily on automated discovery to keep CI records accurate", "correct": false}, {"id": "a2", "text": "Load the CMDB with all available CI data to maximize coverage", "text_plain": "Load the CMDB with all available CI data to maximize coverage", "correct": false}, {"id": "a3", "text": "Permit unrestricted updates to CI records to increase operational agility", "text_plain": "Permit unrestricted updates to CI records to increase operational agility", "correct": false}], "correct_count": 1, "correct_texts": ["Define strong CMDB governance practices and regularly measure data quality and health"], "explanation": "<p>A CMDB only becomes operationally useful when there is <strong>clear governance</strong>, <strong>defined ownership</strong>, and <strong>continuous monitoring of data quality and health</strong>. These elements ensure the CMDB remains accurate, trusted, and aligned with business needs over time.</p><p>Why the others are not</p><ul><li><p>Automated discovery helps, but <strong>cannot replace governance</strong></p></li><li><p>More data does not equal better data and often increases noise</p></li><li><p>Uncontrolled updates reduce data trust and consistency</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/community/cmdb-forum/scoring-in-new-cmdb-health-dashboard/td-p/3091415\"><strong>Scoring in New CMDB Health Dashboard (ServiceNow Community)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/exploring-cmdb-health-parent.html\"><strong>Exploring CMDB Health (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 149, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB team has noticed that some hardware CIs are missing the serial number information, making it difficult to maintain data accuracy. The team needs a structured approach to identify and address these gaps.</p><p>Which accomplishes this task?</p>", "question_plain": "A CMDB team has noticed that some hardware CIs are missing the serial number information, making it difficult to maintain data accuracy. The team needs a structured approach to identify and address these gaps.Which accomplishes this task?", "answers": [{"id": "a0", "text": "CMDB Data Foundation Playbook", "text_plain": "CMDB Data Foundation Playbook", "correct": true}, {"id": "a1", "text": "CI Class Manager", "text_plain": "CI Class Manager", "correct": false}], "correct_count": 1, "correct_texts": ["CMDB Data Foundation Playbook"], "explanation": "", "corrected": false}, {"num": 150, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>Given a list of Service types in the platform. Drag the appropriate service to its definition.</p><p>1. Application Service</p><p>2. Technology Management Service (Technical Service)</p><p>A. Logical representation of a deploy system or application stack.</p><p>B. Published to Service Owners and underpins one or more business or application Services.</p>", "question_plain": "Given a list of Service types in the platform. Drag the appropriate service to its definition.1. Application Service2. Technology Management Service (Technical Service)A. Logical representation of a deploy system or application stack.B. Published to Service Owners and underpins one or more business or application Services.", "answers": [{"id": "a0", "text": "1-A, 2-B", "text_plain": "1-A, 2-B", "correct": true}, {"id": "a1", "text": "1-B, 2-A", "text_plain": "1-B, 2-A", "correct": false}, {"id": "a2", "text": "1-A, 2-A", "text_plain": "1-A, 2-A", "correct": false}, {"id": "a3", "text": "1-B, 2-B", "text_plain": "1-B, 2-B", "correct": false}], "correct_count": 1, "correct_texts": ["1-A, 2-B"], "explanation": "<p><strong>1. </strong><code><strong>Application Service</strong></code><strong> (A)</strong></p><p>This is a specific <strong>instance</strong> of an application. It represents the \"logical\" connection between the infrastructure and the service.</p><ul><li><p><strong>Examples:</strong> <em>Production Instance of ERP</em>, <em>Dev Instance of HR Portal</em>.</p></li><li><p><strong>Role:</strong> It is the operational CI that you typically associate with an Incident or Change.</p></li></ul><p><strong>2. </strong><code><strong>Technical Service</strong></code><strong> (B)</strong></p><p>Also known as <strong>Technology Management Services</strong>, these are the \"plumbing\" of the organization. They are typically <strong>internal-facing</strong>.</p><ul><li><p><strong>Examples:</strong> <em>Server Management</em>, <em>Network Support</em>, <em>Database Hosting</em>.</p></li><li><p><strong>Role:</strong> They are published to <strong>Service Owners</strong> (internal IT) and describe the work required to keep Application and Business services running.</p></li></ul><p><strong>Reference: </strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/common-service-data-model-csdm/csdm-conceptual-model.html\"><strong>CSDM data domains (ServiceNow Docs)</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/application-services.html\"><strong>Application services (ServiceNow Docs)</strong></a></p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2026-02-01_17-34-45-72f8b43083cffe3a3d844f767042df4d.png\"> </p>", "corrected": false}, {"num": 151, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A CMDB Administrator wants to configure a CMDB Data Manager policy that removes CI records from an active CI class while allowing those records to be recovered within a defined retention window.</p><p>Which CMDB Data Manager policy type should be used?</p>", "question_plain": "A CMDB Administrator wants to configure a CMDB Data Manager policy that removes CI records from an active CI class while allowing those records to be recovered within a defined retention window.Which CMDB Data Manager policy type should be used?", "answers": [{"id": "a0", "text": "Certification", "text_plain": "Certification", "correct": false}, {"id": "a1", "text": "Delete", "text_plain": "Delete", "correct": false}, {"id": "a2", "text": "Retire", "text_plain": "Retire", "correct": false}, {"id": "a3", "text": "Archive", "text_plain": "Archive", "correct": true}], "correct_count": 1, "correct_texts": ["Archive"], "explanation": "<p>The <strong>CMDB Data Manager</strong> is a wizard-like tool used to automate the lifecycle of CIs. When the goal is to remove records from the active CMDB tables while maintaining a \"safety net\" for restoration, <strong>Archive</strong> is the specific policy type designed for this purpose.</p><ul><li><p><strong>How it works:</strong> When an Archive policy triggers, the CI is moved from the primary table (e.g., <code>cmdb_ci_server</code>) to a separate <strong>Archive table</strong> (e.g., <code>ar_cmdb_ci_server</code>).</p></li><li><p><strong>The \"Safety Net\":</strong> Because the data is stored in these archive tables rather than being permanently deleted from the database, the Configuration Manager can restore the records if they were archived in error or if they are needed for a specific audit later.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/platform-administration/t_CreateAnArchiveRule.html\"><strong>Create an archive rule (ServiceNow Docs)</strong></a></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/create-data-manager-policy.html\"><strong>Create a CMDB Data Manager policy (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 152, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>A ServiceNow practitioner wants guidance on how <strong>Infrastructure Configuration Items</strong>, <strong>Technical Service Offerings</strong>, and <strong>Application Services</strong> should be structured and related within the CMDB according to CSDM best practices.</p><p>Which <strong>CSDM domain</strong> provides this guidance?</p>", "question_plain": "A ServiceNow practitioner wants guidance on how Infrastructure Configuration Items, Technical Service Offerings, and Application Services should be structured and related within the CMDB according to CSDM best practices.Which CSDM domain provides this guidance?", "answers": [{"id": "a0", "text": "Build and Integration (Build)", "text_plain": "Build and Integration (Build)", "correct": false}, {"id": "a1", "text": "Foundation", "text_plain": "Foundation", "correct": false}, {"id": "a2", "text": "Design and Planning (Design)", "text_plain": "Design and Planning (Design)", "correct": false}, {"id": "a3", "text": "Service Consumption (Sell / Consume)", "text_plain": "Service Consumption (Sell / Consume)", "correct": false}, {"id": "a4", "text": "Service Delivery (Manage Technical Services)", "text_plain": "Service Delivery (Manage Technical Services)", "correct": true}], "correct_count": 1, "correct_texts": ["Service Delivery (Manage Technical Services)"], "explanation": "<p>In the <strong>CSDM</strong>, the <strong>Service Delivery</strong> domain (also known as the <strong>Manage Technical Services</strong> domain) is the operational heart of the CMDB. It is specifically designed to show how IT infrastructure supports the services consumed by the business.</p><p>This domain provides the guidance for connecting:</p><ul><li><p><strong>Technical Service Offerings:</strong> The service level provided by a technical team (e.g., \"SQL Database Hosting - High Availability\").</p></li><li><p><strong>Application Services:</strong> The logical instances of a stack </p></li><li><p><strong>Infrastructure CIs:</strong> The physical or virtual assets (Servers, DBs, Clusters) that are managed by the technical teams.</p></li></ul>", "corrected": false}, {"num": 153, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>Which two activities are part of ‘operationalizing’ the CMDB? (Choose two)</p>", "question_plain": "Which two activities are part of ‘operationalizing’ the CMDB? (Choose two)", "answers": [{"id": "a0", "text": "Publishing an internal wiki page about CMDB", "text_plain": "Publishing an internal wiki page about CMDB", "correct": false}, {"id": "a1", "text": "Embedding CI lookups in IPC forms and automation", "text_plain": "Embedding CI lookups in IPC forms and automation", "correct": true}, {"id": "a2", "text": "Automating change impact analysis using relationships", "text_plain": "Automating change impact analysis using relationships", "correct": true}, {"id": "a3", "text": "Hiding the CI field to simplify forms", "text_plain": "Hiding the CI field to simplify forms", "correct": false}], "correct_count": 2, "correct_texts": ["Embedding CI lookups in IPC forms and automation", "Automating change impact analysis using relationships"], "explanation": "", "corrected": false}, {"num": 154, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>What’s the first step to operationalize CMDB value across ITSM?</p>", "question_plain": "What’s the first step to operationalize CMDB value across ITSM?", "answers": [{"id": "a0", "text": "Migrate all assets into the CMDB", "text_plain": "Migrate all assets into the CMDB", "correct": false}, {"id": "a1", "text": "Publish a schema map to Confluence", "text_plain": "Publish a schema map to Confluence", "correct": false}, {"id": "a2", "text": "Tie CI usage with required CI references", "text_plain": "Tie CI usage with required CI references", "correct": true}, {"id": "a3", "text": "Disable free text categorization on incidents", "text_plain": "Disable free text categorization on incidents", "correct": false}], "correct_count": 1, "correct_texts": ["Tie CI usage with required CI references"], "explanation": "", "corrected": false}, {"num": 155, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>A spike in ‘Compliance’ violations on CMDB Health most likely indicates which two issues? (Choose two)</p>", "question_plain": "A spike in ‘Compliance’ violations on CMDB Health most likely indicates which two issues? (Choose two)", "answers": [{"id": "a0", "text": "Classes not enabled for Discovery", "text_plain": "Classes not enabled for Discovery", "correct": false}, {"id": "a1", "text": "Missing required attributes", "text_plain": "Missing required attributes", "correct": false}, {"id": "a2", "text": "Incorrect relationship cardinalities", "text_plain": "Incorrect relationship cardinalities", "correct": true}, {"id": "a3", "text": "Fields not meeting regex/value policies", "text_plain": "Fields not meeting regex/value policies", "correct": true}], "correct_count": 2, "correct_texts": ["Incorrect relationship cardinalities", "Fields not meeting regex/value policies"], "explanation": "", "corrected": false}, {"num": 156, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>Which Workspace feature helps triage class-specific data quality and tasks in one place?</p>", "question_plain": "Which Workspace feature helps triage class-specific data quality and tasks in one place?", "answers": [{"id": "a0", "text": "CMDB Workspace tiles and guided actions", "text_plain": "CMDB Workspace tiles and guided actions", "correct": true}, {"id": "a1", "text": "Guided Setup for ITSM", "text_plain": "Guided Setup for ITSM", "correct": false}, {"id": "a2", "text": "Event Management Workbench", "text_plain": "Event Management Workbench", "correct": false}, {"id": "a3", "text": "Incident Workspace ‘Agent Assist’", "text_plain": "Incident Workspace ‘Agent Assist’", "correct": false}], "correct_count": 1, "correct_texts": ["CMDB Workspace tiles and guided actions"], "explanation": "", "corrected": false}, {"num": 157, "quiz": "Quiz 2", "type": "multiple-choice", "question": "<p>Which action best prevents ‘custom attribute sprawl’ over time?</p>", "question_plain": "Which action best prevents ‘custom attribute sprawl’ over time?", "answers": [{"id": "a0", "text": "Add all attributes at base table cmdb_ci", "text_plain": "Add all attributes at base table cmdb_ci", "correct": false}, {"id": "a1", "text": "Permit any team to add attributes on demand", "text_plain": "Permit any team to add attributes on demand", "correct": false}, {"id": "a2", "text": "Require design review for business value and correct class level before adding attributes", "text_plain": "Require design review for business value and correct class level before adding attributes", "correct": true}, {"id": "a3", "text": "Replace attributes with tags before adding attributes", "text_plain": "Replace attributes with tags before adding attributes", "correct": false}], "correct_count": 1, "correct_texts": ["Require design review for business value and correct class level before adding attributes"], "explanation": "", "corrected": false}, {"num": 158, "quiz": "Quiz 2", "type": "multi-select", "question": "<p>A Configuration Management Process Owner is preparing solution options for presentation to the technical governance board for ingesting custom Cls to the CMDB. The solution needs to align with best practice, minimize the cost of future work (technical debt) and ensure compliance with future upgrades.</p><p>Which solutions accomplish this? (Choose two.)</p>", "question_plain": "A Configuration Management Process Owner is preparing solution options for presentation to the technical governance board for ingesting custom Cls to the CMDB. The solution needs to align with best practice, minimize the cost of future work (technical debt) and ensure compliance with future upgrades.Which solutions accomplish this? (Choose two.)", "answers": [{"id": "a0", "text": "Repurposing a base CI class and rename attributes, as required", "text_plain": "Repurposing a base CI class and rename attributes, as required", "correct": false}, {"id": "a1", "text": "Extending an existing Asset class table to accommodate the custom Cl class attributes", "text_plain": "Extending an existing Asset class table to accommodate the custom Cl class attributes", "correct": false}, {"id": "a2", "text": "Extending an existing Cl class table to accommodate the custom Cl class attributes", "text_plain": "Extending an existing Cl class table to accommodate the custom Cl class attributes", "correct": true}, {"id": "a3", "text": "Installing or upgrading the 'CMDB CI Class Models' store application to find a suitable existing Cl class accommodating any new attributes", "text_plain": "Installing or upgrading the 'CMDB CI Class Models' store application to find a suitable existing Cl class accommodating any new attributes", "correct": true}], "correct_count": 2, "correct_texts": ["Extending an existing Cl class table to accommodate the custom Cl class attributes", "Installing or upgrading the 'CMDB CI Class Models' store application to find a suitable existing Cl class accommodating any new attributes"], "explanation": "<p>In ServiceNow CMDB best practice, when introducing <strong>new/custom CI classes</strong>, you should:</p><ul><li><p><strong>Reuse and extend existing CMDB classes</strong> where possible</p></li><li><p>Avoid modifying base tables directly</p></li><li><p>Minimize <strong>technical debt</strong> and ensure <strong>upgrade-safe design</strong></p></li></ul><p>ServiceNow strongly promotes:</p><ul><li><p>Using <strong>existing class models (CSDM-aligned)</strong></p></li><li><p>Extending classes instead of repurposing or overloading unrelated tables</p></li></ul><p><strong>The correct answer:</strong></p><p><code><strong>Extending an existing CI class table to accommodate the custom CI class attributes</strong></code></p><ul><li><p>This is the <strong>recommended best practice</strong></p></li><li><p>Benefits:</p><ul><li><p>Maintains CMDB hierarchy integrity</p></li><li><p>Keeps alignment with <strong>CSDM and platform design</strong></p></li><li><p>Ensures <strong>upgrade safety</strong></p></li></ul></li><li><p>Extending = clean inheritance model (no breaking base behavior)</p></li></ul><p><code><strong>Installing or upgrading the 'CMDB CI Class Models' store application...</strong></code></p><ul><li><p>Helps:</p><ul><li><p>Identify <strong>existing standard classes</strong> before creating new ones</p></li><li><p>Avoid unnecessary customization</p></li></ul></li><li><p>Reduces:</p><ul><li><p>Duplication</p></li><li><p>Technical debt</p></li></ul></li><li><p>Aligns with <strong>ServiceNow’s model-first approach</strong></p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/t_CreateCIType.html\"><strong>Create a CI class (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 159, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>In a company there is a need to understand the CSDM maturity level needed. Different stakeholders listed a number of use cases that they expect over time.</p><p>Which use case requires information objects?</p>", "question_plain": "In a company there is a need to understand the CSDM maturity level needed. Different stakeholders listed a number of use cases that they expect over time.Which use case requires information objects?", "answers": [{"id": "a0", "text": "The Event Operations team wants to automate their events into incident for operational actions.", "text_plain": "The Event Operations team wants to automate their events into incident for operational actions.", "correct": false}, {"id": "a1", "text": "The Asset Management team wants to understand the asset life cycle compliancy in a Business Application context.", "text_plain": "The Asset Management team wants to understand the asset life cycle compliancy in a Business Application context.", "correct": false}, {"id": "a2", "text": "The SecOps team wants to understand the operational risk in the Business Application context.", "text_plain": "The SecOps team wants to understand the operational risk in the Business Application context.", "correct": true}, {"id": "a3", "text": "The Business Service Management team wants to understand the operational impact for their consumer parties.", "text_plain": "The Business Service Management team wants to understand the operational impact for their consumer parties.", "correct": false}, {"id": "a4", "text": "The Customer Service team wants to onboard pro-active case management.", "text_plain": "The Customer Service team wants to onboard pro-active case management.", "correct": false}], "correct_count": 1, "correct_texts": ["The SecOps team wants to understand the operational risk in the Business Application context."], "explanation": "", "corrected": true}, {"num": 160, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>What is the difference between Data Certification and Attestation policies when managing a CI?</p>", "question_plain": "What is the difference between Data Certification and Attestation policies when managing a CI?", "answers": [{"id": "a0", "text": "Attestation requires correcting specific attributes of a Cl, while Data Certification tracks acknowledgement the CI still exists.", "text_plain": "Attestation requires correcting specific attributes of a Cl, while Data Certification tracks acknowledgement the CI still exists.", "correct": false}, {"id": "a1", "text": "Attestation can be assigned to a Group or an individual, while Data Certification can only be assigned to an individual.", "text_plain": "Attestation can be assigned to a Group or an individual, while Data Certification can only be assigned to an individual.", "correct": false}, {"id": "a2", "text": "Attestation tracks acknowledgement the CI still exists, while Data Certification requires validating specific attributes of a Cl.", "text_plain": "Attestation tracks acknowledgement the CI still exists, while Data Certification requires validating specific attributes of a Cl.", "correct": true}, {"id": "a3", "text": "Attestation can be scheduled, while Data Certification cannot be scheduled.", "text_plain": "Attestation can be scheduled, while Data Certification cannot be scheduled.", "correct": false}], "correct_count": 1, "correct_texts": ["Attestation tracks acknowledgement the CI still exists, while Data Certification requires validating specific attributes of a Cl."], "explanation": "<p>While both tools are used to verify CMDB accuracy, they serve different functional purposes within the ServiceNow ecosystem:</p><ul><li><p><code><strong>Attestation</strong></code> is your \"Inventory Check.\" It’s built into the modern <strong>CMDB Workspace</strong> to help prevent the database from filling up with \"ghost\" CIs that no longer exist.</p></li><li><p><code><strong>Data Certification</strong></code> is your \"Audit Check.\" Use it only when you have a regulatory or business requirement to prove that specific attributes (like <em>Cost Center</em> or <em>IP Address</em>) have been manually verified by a human.</p></li></ul><p><strong>Reference:</strong></p><p><strong>- </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/review-data-manager-attes-task.html\"><strong>Review CMDB Data Manager attestation tasks in CMDB Workspace (ServiceNow Docs)</strong></a></p><p>- <a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/data-cert-exp-cmdb-workspace.html\"><strong>Data Certification experience in CMDB Workspace (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 161, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A Configuration Manager needs to leverage a policy type to automate the creation and assignment of tasks to validate the existence of Cls. Which policy type should be used to accomplish this goal?</p>", "question_plain": "A Configuration Manager needs to leverage a policy type to automate the creation and assignment of tasks to validate the existence of Cls. Which policy type should be used to accomplish this goal?", "answers": [{"id": "a0", "text": "Delete", "text_plain": "Delete", "correct": false}, {"id": "a1", "text": "Certification", "text_plain": "Certification", "correct": false}, {"id": "a2", "text": "Attestation", "text_plain": "Attestation", "correct": true}, {"id": "a3", "text": "Retire", "text_plain": "Retire", "correct": false}], "correct_count": 1, "correct_texts": ["Attestation"], "explanation": "<p>The <strong>CMDB Data Manager</strong> uses policy types to drive the lifecycle of Configuration Items. When the goal is to <strong>validate the existence</strong> of CIs - essentially asking a human \"Is this server still in the rack?\" or \"Do you still have this laptop?\" - the <strong>Attestation</strong> policy is the correct choice.</p><ul><li><p><code><strong>Automation</strong></code><strong>:</strong> Once the policy conditions are met (e.g., CIs that haven't been discovered in 60 days), the Data Manager automatically creates <strong>Data Management Tasks</strong>.</p></li><li><p><code><strong>Assignment</strong></code><strong>:</strong> These tasks are assigned to the individual listed in the <strong>Managed by</strong> field of the CI.</p></li><li><p><code><strong>Validation</strong></code><strong>:</strong> The assignee must review the list and \"Attest\" that the CIs still exist or mark them as missing.</p></li></ul><p><strong>Reference: </strong><a href=\"https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/data-manager-create-policy-wrkspc.html\"><strong>Create a CMDB Data Manager policy (ServiceNow Docs)</strong></a></p>", "corrected": false}, {"num": 162, "quiz": "Quiz 3", "type": "multiple-choice", "question": "<p>A Configuration Manager has configured multiple data sources which are all authorized to update the same class and the same set of class attributes in the CMDB.</p><p>What can the Configuration Manager do to control which data source should be the authoritative source of truth for a specific class or set of class attributes?</p>", "question_plain": "A Configuration Manager has configured multiple data sources which are all authorized to update the same class and the same set of class attributes in the CMDB.What can the Configuration Manager do to control which data source should be the authoritative source of truth for a specific class or set of class attributes?", "answers": [{"id": "a0", "text": "Assign a run order to each data source in the identification rules", "text_plain": "Assign a run order to each data source in the identification rules", "correct": false}, {"id": "a1", "text": "Configure data refresh rules with a specific time period", "text_plain": "Configure data refresh rules with a specific time period", "correct": false}, {"id": "a2", "text": "Assign a priority to each data source in the reconciliation rules", "text_plain": "Assign a priority to each data source in the reconciliation rules", "correct": true}, {"id": "a3", "text": "Manually run the data source updates in the correct order", "te
